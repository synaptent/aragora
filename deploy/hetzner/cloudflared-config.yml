# Cloudflare Tunnel for the production API.
#
# The tunnel dials OUT to Cloudflare, so this host needs no inbound firewall
# rule and no public IP. api.aragora.ai already resolves to Cloudflare, so
# nothing about DNS changes — only what sits behind it.
#
# Install to /etc/cloudflared/config.yml on the host.

tunnel: aragora-prod
credentials-file: /etc/cloudflared/aragora-prod.json

originRequest:
  connectTimeout: 30s
  noTLSVerify: false

ingress:
  # WebSocket first: the more specific path must precede the catch-all host
  # rule, or every /ws request is served by the HTTP origin instead. The path
  # is an unanchored regular expression, so anchor it or any HTTP path that
  # merely contains "/ws" would be sent to the WebSocket port too.
  - hostname: api.aragora.ai
    path: ^/ws(/|$)
    service: http://127.0.0.1:8765
  - hostname: api.aragora.ai
    service: http://127.0.0.1:8080
  - service: http_status:404
