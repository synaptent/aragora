name: Uptime Monitor

on:
  # Scheduled probes are PARKED (operator decision 2026-09-07, #9391 / #9966
  # metric 7): api.aragora.ai has had no production origin since AWS was retired
  # on 2026-08-19, so every 30-minute run failed by construction (~100 red runs a
  # day). Re-enable the schedule in the same PR that lands the provider-neutral
  # canary (#9851 / #9882) and restores a 200 on /readyz. Manual dispatch still
  # works for a one-off probe.
  # schedule:
  #   - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  health-check:
    runs-on: aragora
    timeout-minutes: 5
    env:
      LIVE_FRONTEND_BASE_URL: ${{ vars.LIVE_FRONTEND_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/verify_frontend_routes.sh
          sparse-checkout-cone-mode: false

      - name: Verify checkout integrity
        shell: bash
        run: |
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::pyproject.toml missing after checkout; attempting recovery"
            git sparse-checkout disable || true
            git fetch --no-tags origin "${GITHUB_SHA:-HEAD}"
            git reset --hard FETCH_HEAD
            git clean -ffd || true
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::Standard recovery failed; attempting archive restore"
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            git archive "${GITHUB_SHA:-HEAD}" | tar -x || git archive HEAD | tar -x
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::error::Repository checkout is incomplete (pyproject.toml missing)"
            echo "PWD=$(pwd)"
            ls -la
            exit 1
          fi

      - name: Check Frontend Critical Routes
        id: frontend
        run: |
          FRONTEND_URL="${LIVE_FRONTEND_BASE_URL:-https://aragora.ai}"
          # Retry once on transient failure
          for attempt in 1 2; do
            if bash scripts/verify_frontend_routes.sh "$FRONTEND_URL"; then
              echo "Frontend routes: OK ($FRONTEND_URL)"
              exit 0
            fi
            if [ "$attempt" -eq 1 ]; then
              echo "Frontend route check failed on attempt 1, retrying in 10s..."
              sleep 10
            fi
          done
          echo "::error::Frontend route check failed after 2 attempts"
          exit 1

      - name: Check Production API (Lightsail)
        id: production_api
        run: |
          # Use /api/health (public, load-balancer friendly)
          CURL_EXIT=0
          response=$(curl -sf -o /dev/null -w "%{http_code}" "https://api.aragora.ai/api/health") || CURL_EXIT=$?
          response=${response:-000}
          echo "Production API: http_status=$response curl_exit=$CURL_EXIT"
          if [ "$CURL_EXIT" -ne 0 ] || [ "$response" != "200" ]; then
            echo "::error::Production API failed (http_status=$response curl_exit=$CURL_EXIT)"
            exit 1
          fi
          echo "Production API: OK ($response)"

      - name: Check Staging API (EC2)
        id: staging_api
        # Non-blocking: Staging environment may be down during maintenance without affecting production
        continue-on-error: true
        run: |
          # Use /api/health (public, load-balancer friendly)
          CURL_EXIT=0
          response=$(curl -sf -o /dev/null -w "%{http_code}" "http://${{ secrets.EC2_HOST }}:8080/api/health" --connect-timeout 10) || CURL_EXIT=$?
          response=${response:-000}
          echo "Staging API: http_status=$response curl_exit=$CURL_EXIT"
          if [ "$CURL_EXIT" -ne 0 ] || [ "$response" != "200" ]; then
            echo "::warning::Staging API failed (http_status=$response curl_exit=$CURL_EXIT; non-critical)"
            exit 1
          fi
          echo "Staging API: OK ($response)"

      - name: Check WebSocket Endpoint
        id: websocket
        run: |
          # Basic connectivity check for WebSocket upgrade
          # Any HTTP response (including 400) proves reachability, so omit curl -f.
          CURL_EXIT=0
          response=$(curl -s -o /dev/null -w "%{http_code}" -H "Upgrade: websocket" -H "Connection: Upgrade" "https://api.aragora.ai/ws") || CURL_EXIT=$?
          response=${response:-000}
          echo "WebSocket endpoint: http_status=$response curl_exit=$CURL_EXIT"
          if [ "$CURL_EXIT" -ne 0 ] || ! [[ "$response" =~ ^[1-5][0-9][0-9]$ ]]; then
            echo "::error::WebSocket endpoint unreachable (http_status=$response curl_exit=$CURL_EXIT)"
            exit 1
          fi
          echo "WebSocket endpoint reachable ($response)"

      - name: Summary
        if: always()
        env:
          FRONTEND_OUTCOME: ${{ steps.frontend.outcome }}
          PRODUCTION_API_OUTCOME: ${{ steps.production_api.outcome }}
          WEBSOCKET_OUTCOME: ${{ steps.websocket.outcome }}
          STAGING_API_OUTCOME: ${{ steps.staging_api.outcome }}
        run: |
          echo "## Health Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status | Policy |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend (Vercel/custom domain) | ${FRONTEND_OUTCOME:-skipped} | blocking |" >> $GITHUB_STEP_SUMMARY
          echo "| Production API | ${PRODUCTION_API_OUTCOME:-skipped} | blocking |" >> $GITHUB_STEP_SUMMARY
          echo "| WebSocket endpoint | ${WEBSOCKET_OUTCOME:-skipped} | blocking |" >> $GITHUB_STEP_SUMMARY
          echo "| Staging API | ${STAGING_API_OUTCOME:-skipped} | advisory (non-blocking) |" >> $GITHUB_STEP_SUMMARY
          echo "| Timestamp | $(date -u) | |" >> $GITHUB_STEP_SUMMARY

  notify-on-failure:
    needs: health-check
    if: failure()
    runs-on: aragora
    timeout-minutes: 5
    permissions:
      issues: write

    steps:
      - name: Create Issue on Failure
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🚨 Service Outage Detected - ${new Date().toISOString()}`;
            const body = `
            ## Automated Health Check Failed

            One or more services are not responding correctly.

            **Time**: ${new Date().toISOString()}
            **Workflow Run**: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}

            ### Services to Check
            - [ ] Frontend: https://aragora.ai
            - [ ] Production API: https://api.aragora.ai/api/health
            - [ ] Lightsail instance status

            ### Quick Commands
            \`\`\`bash
            # Check Lightsail
            ssh -i ~/.ssh/lightsail-aragora.pem ubuntu@3.17.253.61 "sudo systemctl status aragora cloudflared"

            # Restart services
            ssh -i ~/.ssh/lightsail-aragora.pem ubuntu@3.17.253.61 "sudo systemctl restart aragora cloudflared"
            \`\`\`
            `;

            // Check for existing open issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'outage'
            });

            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['outage', 'automated']
              });
            }
