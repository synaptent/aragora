name: Quality Pipeline Smoke

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'aragora/debate/output_quality.py'
      - 'aragora/debate/repo_grounding.py'
      - 'aragora/cli/commands/debate.py'
      - 'tests/debate/test_output_quality.py'
      - 'tests/debate/test_repo_grounding.py'
      - 'tests/cli/test_offline_golden_path.py'
      - '.github/workflows/quality-smoke.yml'
      - '.github/actions/pr-scope-classifier/**'
  schedule:
    # Nightly at 1:30 UTC
    - cron: '30 1 * * *'
  workflow_dispatch:

concurrency:
  group: quality-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      quality: ${{ steps.decision.outputs.quality }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify checkout integrity
        shell: bash
        run: |
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::pyproject.toml missing after checkout; attempting recovery"
            git sparse-checkout disable || true
            git fetch --no-tags origin "${GITHUB_SHA:-HEAD}"
            git reset --hard FETCH_HEAD
            git clean -ffd || true
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::Standard recovery failed; attempting archive restore"
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            git archive "${GITHUB_SHA:-HEAD}" | tar -x || git archive HEAD | tar -x
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::error::Repository checkout is incomplete (pyproject.toml missing)"
            echo "PWD=$(pwd)"
            ls -la
            exit 1
          fi

      - uses: ./.github/actions/pr-scope-classifier
        id: scope

      - name: Decide quality scope
        id: decision
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "quality=${{ steps.scope.outputs.quality }}" >> "$GITHUB_OUTPUT"
          else
            echo "quality=true" >> "$GITHUB_OUTPUT"
          fi

  quality-smoke-run:
    needs: changes
    if: needs.changes.outputs.quality == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    name: Quality Pipeline Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify checkout integrity
        shell: bash
        run: |
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::pyproject.toml missing after checkout; attempting recovery"
            git sparse-checkout disable || true
            git fetch --no-tags origin "${GITHUB_SHA:-HEAD}"
            git reset --hard FETCH_HEAD
            git clean -ffd || true
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::Standard recovery failed; attempting archive restore"
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            git archive "${GITHUB_SHA:-HEAD}" | tar -x || git archive HEAD | tar -x
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::error::Repository checkout is incomplete (pyproject.toml missing)"
            echo "PWD=$(pwd)"
            ls -la
            exit 1
          fi

      - name: Set up Python
        uses: ./.github/actions/setup-python-safe
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          bash scripts/ci_install_project.sh --extras dev,test

      - name: Run output quality tests
        run: |
          pytest tests/debate/test_output_quality.py -v --timeout=60 --tb=short
        env:
          PYTHONPATH: .

      - name: Run repo grounding tests
        run: |
          pytest tests/debate/test_repo_grounding.py -v --timeout=60 --tb=short
        env:
          PYTHONPATH: .

      - name: Run offline golden path tests
        run: |
          pytest tests/cli/test_offline_golden_path.py -v --timeout=60 --tb=short \
            -W error::ResourceWarning \
            -W error::pytest.PytestUnraisableExceptionWarning
        env:
          PYTHONPATH: .
          PYTHONWARNINGS: "error::ResourceWarning"

      - name: Quality smoke summary
        if: always()
        run: |
          echo "## Quality Pipeline Smoke Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Validates post-consensus quality pipeline WITHOUT real API calls:" >> $GITHUB_STEP_SUMMARY
          echo "- \`test_output_quality.py\` — output formatting and quality checks" >> $GITHUB_STEP_SUMMARY
          echo "- \`test_repo_grounding.py\` — repository grounding pipeline" >> $GITHUB_STEP_SUMMARY
          echo "- \`test_offline_golden_path.py\` — end-to-end offline debate flow" >> $GITHUB_STEP_SUMMARY

  quality-smoke:
    needs: [changes, quality-smoke-run]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Evaluate quality smoke result
        env:
          CLASSIFIER_RESULT: ${{ needs.changes.result }}
          WORKER_RESULT: ${{ needs.quality-smoke-run.result }}
          IN_SCOPE: ${{ needs.changes.outputs.quality }}
          # Unlike the other aggregators, quality-smoke-run is additionally gated on the PR
          # not being a draft, so an in-scope skip is legitimate here — but only for drafts.
          IS_DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft || 'false' }}
        run: |
          set -euo pipefail
          if [[ "$CLASSIFIER_RESULT" != "success" ]]; then
            echo "::error::Change classification concluded '$CLASSIFIER_RESULT'; its scope verdict cannot be trusted. Failing closed."
            exit 1
          fi
          case "$IN_SCOPE" in
            true)
              if [[ "$IS_DRAFT" == "true" ]]; then
                if [[ "$WORKER_RESULT" != "skipped" ]]; then
                  echo "::error::Quality pipeline smoke was deferred for a draft but concluded '$WORKER_RESULT'. Failing closed."
                  exit 1
                fi
                echo "Quality pipeline smoke deferred — draft PR."
              else
                if [[ "$WORKER_RESULT" != "success" ]]; then
                  echo "::error::Quality pipeline smoke concluded '$WORKER_RESULT' (expected 'success'). Failing closed."
                  exit 1
                fi
                echo "Quality pipeline smoke passed."
              fi
              ;;
            false)
              if [[ "$WORKER_RESULT" != "skipped" ]]; then
                echo "::error::Quality pipeline smoke was out of scope but concluded '$WORKER_RESULT'. Failing closed."
                exit 1
              fi
              echo "Quality pipeline smoke not required — no relevant changes."
              ;;
            *)
              echo "::error::Change classification produced invalid IN_SCOPE value '$IN_SCOPE' (expected exactly 'true' or 'false'). Failing closed."
              exit 1
              ;;
          esac
