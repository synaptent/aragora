name: OpenAPI Spec

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Nightly at 1:10 UTC
    - cron: '10 1 * * *'
  workflow_dispatch:
    inputs:
      publish_envelope:
        description: >-
          Publish and attest the immutable openapi-envelope-<sha> release
          capsule for this main head (finalization delegation only).
        type: boolean
        required: false
        default: false
      operator_confirmed_immutable_releases:
        description: >-
          Attestation that an admin-capable read of
          repos/<owner>/<repo>/immutable-releases returned {"enabled":true}
          immediately before this dispatch. The in-run token cannot see that
          setting, so the envelope job fails closed (blocked) without this.
        type: boolean
        default: false

concurrency:
  group: openapi-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Run/SHA-bound artifact names (FIX-RT-017). `github.sha` is the merge SHA on
# pull_request events, so the pull-request head SHA must win there for the
# name to end with the run's head_sha. The attempt is deliberately not part
# of the name: re-running only a failed dependent job increments the run
# attempt while the artifact keeps its original name.
env:
  OPENAPI_RUN_ARTIFACT: openapi-spec-${{ github.run_id }}-${{ github.event.pull_request.head.sha || github.sha }}
  DRIFT_RUN_ARTIFACT: contract-drift-artifacts-${{ github.run_id }}-${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  scope:
    name: OpenAPI Scope
    runs-on: ubuntu-latest
    outputs:
      run_openapi: ${{ steps.decision.outputs.run_openapi }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify checkout integrity
        shell: bash
        run: |
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::pyproject.toml missing after checkout; attempting recovery"
            git reset --hard || true
            git clean -ffdx || true
            git sparse-checkout disable || true
            git fetch --no-tags origin "${GITHUB_SHA:-HEAD}" || true
            git checkout -f "${GITHUB_SHA:-HEAD}" || true
            if git rev-parse --verify FETCH_HEAD >/dev/null 2>&1; then
              git reset --hard FETCH_HEAD
            else
              git reset --hard HEAD
            fi
            git clean -ffdx || true
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::Sparse-checkout recovery incomplete; attempting archive restore"
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            if ! git archive "${GITHUB_SHA:-HEAD}" | tar -x; then
              git archive HEAD | tar -x
            fi
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::error::Repository checkout is incomplete (pyproject.toml missing)"
            echo "PWD=$(pwd)"
            ls -la
            exit 1
          fi

      - name: Detect OpenAPI-relevant changes
        id: scope
        uses: ./.github/actions/pr-scope-classifier

      - name: Decide OpenAPI scope
        id: decision
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "run_openapi=${{ steps.scope.outputs.openapi }}" >> "$GITHUB_OUTPUT"
          else
            echo "run_openapi=true" >> "$GITHUB_OUTPUT"
          fi

  generate-run:
    name: OpenAPI Generate & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: scope
    if: needs.scope.outputs.run_openapi == 'true'
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify checkout integrity
        shell: bash
        run: |
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::pyproject.toml missing after checkout; attempting recovery"
            git reset --hard || true
            git clean -ffdx || true
            git sparse-checkout disable || true
            git fetch --no-tags origin "${GITHUB_SHA:-HEAD}" || true
            git checkout -f "${GITHUB_SHA:-HEAD}" || true
            if git rev-parse --verify FETCH_HEAD >/dev/null 2>&1; then
              git reset --hard FETCH_HEAD
            else
              git reset --hard HEAD
            fi
            git clean -ffdx || true
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::Sparse-checkout recovery incomplete; attempting archive restore"
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            if ! git archive "${GITHUB_SHA:-HEAD}" | tar -x; then
              git archive HEAD | tar -x
            fi
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::error::Repository checkout is incomplete (pyproject.toml missing)"
            echo "PWD=$(pwd)"
            ls -la
            exit 1
          fi

      - name: Set up Python 3.11
        id: setup-python
        # Runner-resilience seam only (VAL-CDG-012 adjudicated): the next step
        # re-verifies the python toolchain fail-closed (set -euo pipefail +
        # exit 1), so a masked setup failure cannot reach any validation step.
        continue-on-error: true
        uses: ./.github/actions/setup-python-safe
        with:
          python-version: "3.11"

      - name: Ensure python toolchain is available
        shell: bash
        run: |
          set -euo pipefail

          PY_BIN=""
          if [[ -n "${pythonLocation:-}" && -x "${pythonLocation}/bin/python" ]]; then
            PY_BIN="${pythonLocation}/bin/python"
          elif command -v python3.11 >/dev/null 2>&1; then
            PY_BIN="$(command -v python3.11)"
          elif command -v python3 >/dev/null 2>&1; then
            PY_BIN="$(command -v python3)"
          elif command -v python >/dev/null 2>&1; then
            PY_BIN="$(command -v python)"
          fi
          if [[ -z "$PY_BIN" ]]; then
            echo "::error::No python interpreter found on runner"
            exit 1
          fi

          PY_OK="$("$PY_BIN" - <<'PY'
          import sys
          print(int(sys.version_info >= (3, 10)))
          PY
          )"
          if [[ "$PY_OK" != "1" ]]; then
            "$PY_BIN" --version
            echo "::error::OpenAPI workflow requires Python >= 3.10"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/bin"
          ln -sf "$PY_BIN" "$RUNNER_TEMP/bin/python"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

          if ! command -v pip >/dev/null 2>&1; then
            "$PY_BIN" -m ensurepip --upgrade || true
          fi

          "$PY_BIN" --version
          pip --version || "$PY_BIN" -m pip --version

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.18.0"

      - name: Configure npm cache for self-hosted runners
        shell: bash
        run: |
          set -euo pipefail
          NPM_CACHE_DIR="${RUNNER_TEMP}/npm-cache"
          mkdir -p "$NPM_CACHE_DIR"
          echo "NPM_CONFIG_CACHE=${NPM_CACHE_DIR}" >> "$GITHUB_ENV"
          echo "npm_config_cache=${NPM_CACHE_DIR}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          bash scripts/ci_install_project.sh --extras dev
          USER_BASE="$(python -m site --user-base)"
          echo "${USER_BASE}/bin" >> "$GITHUB_PATH"

      - name: Generate OpenAPI spec
        run: |
          python scripts/generate_openapi.py --output docs/api/openapi_generated.json
          python scripts/generate_openapi.py --output docs/api/openapi_generated.yaml --format yaml

      - name: Normalize OpenAPI spec metadata
        run: |
          python scripts/add_openapi_operation_ids.py --spec docs/api/openapi_generated.json
          python scripts/add_openapi_param_descriptions.py --spec docs/api/openapi_generated.json
          python scripts/add_openapi_descriptions.py --spec docs/api/openapi_generated.json

      - name: Enforce canonical OpenAPI version
        run: |
          VERSION=$(python -c "import json; print(json.load(open('docs/api/openapi_generated.json'))['openapi'])")
          if [ "$VERSION" != "3.1.0" ]; then
            echo "::error::OpenAPI version is $VERSION; expected 3.1.0 (canonical registry)."
            exit 1
          fi

      - name: Validate spec structure
        run: |
          python -c "
          import json, sys

          with open('docs/api/openapi_generated.json') as f:
              spec = json.load(f)

          errors = []

          # Check OpenAPI version
          if spec.get('openapi') != '3.1.0':
              errors.append(f\"OpenAPI version is {spec.get('openapi')!r}, expected '3.1.0'\")

          # Check required top-level keys
          for key in ('info', 'paths', 'servers', 'components'):
              if key not in spec:
                  errors.append(f'Missing required top-level key: {key}')

          # Check info fields
          info = spec.get('info', {})
          if not info.get('title'):
              errors.append('Missing info.title')
          if not info.get('version'):
              errors.append('Missing info.version')

          # Check security scheme
          schemes = spec.get('components', {}).get('securitySchemes', {})
          if 'bearerAuth' not in schemes:
              errors.append('Missing bearerAuth security scheme')

          # Check paths exist
          paths = spec.get('paths', {})
          if not paths:
              errors.append('No paths defined in spec')

          # Count operations
          total_ops = sum(len(methods) for methods in paths.values())
          print(f'Total paths: {len(paths)}')
          print(f'Total operations: {total_ops}')

          if errors:
              for e in errors:
                  print(f'::error::{e}')
              sys.exit(1)
          else:
              print('Spec structure validation passed')
          "

      - name: Validate all paths start with /api/ or are system paths
        run: |
          python -c "
          import json, sys

          with open('docs/api/openapi_generated.json') as f:
              spec = json.load(f)

          # System paths that are allowed without /api/ prefix
          ALLOWED_NON_API = {'/healthz', '/readyz', '/readyz/dependencies', '/status', '/audio'}

          non_api_paths = []
          for path in spec.get('paths', {}):
              if not path.startswith('/api/') and path not in ALLOWED_NON_API:
                  non_api_paths.append(path)

          if non_api_paths:
              print(f'::warning::Found {len(non_api_paths)} paths not starting with /api/:')
              for p in sorted(non_api_paths)[:20]:
                  print(f'  {p}')
              if len(non_api_paths) > 20:
                  print(f'  ... and {len(non_api_paths) - 20} more')
          else:
              print('All paths start with /api/ or are allowed system paths')
          "

      - name: Validate YAML output is parseable
        run: |
          python -c "
          import yaml, sys
          with open('docs/api/openapi_generated.yaml') as f:
              spec = yaml.safe_load(f)
          assert spec.get('openapi') == '3.1.0', f\"YAML spec version: {spec.get('openapi')}\"
          print(f\"YAML spec valid: {len(spec.get('paths', {}))} paths\")
          "

      - name: AST-only generation smoke test
        run: |
          python scripts/generate_openapi.py --ast-only --output /tmp/openapi_ast.json --format json --quiet
          python -c "
          import json
          with open('/tmp/openapi_ast.json') as f:
              spec = json.load(f)
          paths = spec.get('paths', {})
          total = sum(len(m) for m in paths.values())
          print(f'AST-only mode: {len(paths)} paths, {total} operations')
          assert spec.get('openapi') == '3.1.0'
          "

      - name: Fix npm cache ownership
        run: |
          if [[ -d "$HOME/.npm" ]]; then
            sudo chown -R "$(id -u):$(id -g)" "$HOME/.npm" 2>/dev/null || true
          fi

      - name: Generate TypeScript SDK types
        run: python scripts/generate_sdk_types.py --openapi docs/api/openapi_generated.json

      - name: Generate Python SDK types
        run: python scripts/generate_python_sdk_types.py --openapi docs/api/openapi_generated.json

      - name: Generate Live API types (strict)
        if: github.event_name != 'pull_request'
        run: |
          npm --prefix aragora/live ci --fetch-retries=5 --fetch-retry-mintimeout=20000
          npm --prefix aragora/live run generate:types

      - name: Generate Live API types (best-effort on PR)
        if: github.event_name == 'pull_request'
        # PR-lane frontend-types seam only (VAL-CDG-012 adjudicated): not a
        # route/SDK authority. The strict twin above enforces this generation
        # fail-closed on every push/schedule/dispatch execution.
        continue-on-error: true
        run: |
          set -o pipefail
          npm --prefix aragora/live ci --fetch-retries=5 --fetch-retry-mintimeout=20000
          npm --prefix aragora/live run generate:types

      - name: Compare with existing spec
        id: compare
        run: |
          if [ -f docs/api/openapi.json ]; then
            # Extract endpoint counts
            EXISTING=$(python -c "import json; d=json.load(open('docs/api/openapi.json')); print(sum(len(m) for m in d.get('paths', {}).values()))")
            GENERATED=$(python -c "import json; d=json.load(open('docs/api/openapi_generated.json')); print(sum(len(m) for m in d.get('paths', {}).values()))")

            echo "Existing endpoints: $EXISTING"
            echo "Generated endpoints: $GENERATED"

            if [ "$EXISTING" != "$GENERATED" ]; then
              echo "::warning::Endpoint count changed: $EXISTING -> $GENERATED"
              echo "spec_changed=true" >> $GITHUB_OUTPUT
            else
              echo "spec_changed=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "No existing spec found, creating new one"
            echo "spec_changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Install OpenAPI validator
        run: npm install -g @redocly/cli@1.34.11

      - name: Validate OpenAPI spec
        run: |
          redocly lint docs/api/openapi_generated.json \
            --skip-rule=no-empty-servers \
            --skip-rule=path-parameters-defined

      - name: Audit documentation coverage
        run: |
          python scripts/audit_openapi_docs.py --spec docs/api/openapi_generated.json --min-coverage 90
          echo "Documentation coverage check passed"

      - name: Validate handler route coverage
        run: |
          # pipefail: without it, `| tee` masks the validator's exit code and
          # the gate silently passes on drift (that happened Jan-Jul 2026).
          set -o pipefail
          # Method-aware operation plane (VAL-CDG-011/012): bind the route
          # authority to this execution's exact resolved commit SHA and
          # require the plane to echo the same binding back.
          EXEC_SHA="$(git rev-parse HEAD)"
          python scripts/validate_openapi_routes.py \
            --spec docs/api/openapi.json \
            --ref "${EXEC_SHA}" \
            --internal-prefixes scripts/baselines/internal_route_prefixes.json \
            --json > /tmp/route-plane.json
          python - "${EXEC_SHA}" <<'PY'
          import json, sys
          plane = json.load(open("/tmp/route-plane.json"))
          if plane.get("ref") != sys.argv[1]:
              raise SystemExit(
                  f"method-aware plane ref {plane.get('ref')!r} is not this "
                  f"execution's exact SHA {sys.argv[1]!r}"
              )
          print(f"Method-aware plane bound to {sys.argv[1]}")
          print(f"Served operations: {plane['served_operations_count']}")
          PY
          # Baseline-gated coverage: the fail-closed drift ratchet.
          python scripts/validate_openapi_routes.py \
            --spec docs/api/openapi.json \
            --fail-on-missing \
            --baseline scripts/baselines/validate_openapi_routes.json \
            --internal-prefixes scripts/baselines/internal_route_prefixes.json \
            --json | tee /tmp/route-coverage.json
          # Extract coverage and regression stats
          COVERAGE=$(python -c "import json; print(json.load(open('/tmp/route-coverage.json'))['coverage_percentage'])")
          MISSING=$(python -c "import json; print(json.load(open('/tmp/route-coverage.json'))['missing_in_spec_count'])")
          NEW_MISSING=$(python -c "import json; print(json.load(open('/tmp/route-coverage.json'))['new_missing_in_spec_count'])")
          NEW_ORPHANED=$(python -c "import json; print(json.load(open('/tmp/route-coverage.json'))['new_orphaned_in_spec_count'])")
          echo "Handler route coverage: ${COVERAGE}%"
          echo "Routes missing from spec: ${MISSING}"
          echo "New missing vs baseline: ${NEW_MISSING}"
          echo "New orphaned vs baseline: ${NEW_ORPHANED}"

      - name: Check for missing operationIds (warning only)
        run: |
          # pipefail: the operationId count is advisory, but a crash of the
          # audit producer must fail the step, not vanish into the pipe.
          set -o pipefail
          python scripts/audit_openapi_docs.py --spec docs/api/openapi_generated.json --json | python -c "
          import json, sys
          data = json.load(sys.stdin)
          missing = len([e for e in data['priority_list'] if 'operationId' in e.get('missing', [])])
          print(f'Endpoints missing operationId: {missing}')
          if missing > 400:
              print('::warning::Large number of endpoints missing operationId - SDK generation may be incomplete')
          "

      - name: Verify SDK contracts against spec
        run: |
          python scripts/verify_sdk_contracts.py \
            --strict \
            --baseline scripts/baselines/verify_sdk_contracts.json
          echo "SDK contract verification passed"

      - name: Check namespace SDK parity
        run: |
          python scripts/check_sdk_namespace_parity.py \
            --strict \
            --baseline scripts/baselines/check_sdk_namespace_parity.json

      - name: Generate contract drift summary
        if: always()
        run: |
          # Present no verdict without parseable CURRENT-run inputs: the
          # summary must reflect this execution's route-coverage output and
          # generated spec. Missing or truncated inputs fail here instead of
          # summarizing stale state.
          python - <<'PY'
          import json
          json.load(open("/tmp/route-coverage.json"))
          json.load(open("docs/api/openapi_generated.json"))
          PY
          python scripts/contract_drift_report.py \
            --json-out /tmp/contract-drift-summary.json \
            --md-out /tmp/contract-drift-summary.md

      - name: Generate contract drift backlog seeds
        if: always()
        run: |
          # Backlog seeds derive from the CURRENT run's drift summary; never
          # seed from a prior run's artifacts.
          python - <<'PY'
          import json
          json.load(open("/tmp/contract-drift-summary.json"))
          PY
          python scripts/generate_contract_drift_backlog.py \
            --markdown-out /tmp/CONTRACT_DRIFT_BACKLOG.md \
            --json-out /tmp/CONTRACT_DRIFT_BACKLOG.json

      - name: Run contract matrix tests
        run: |
          # Authoritative: the pytest exit code IS the verdict. An
          # unconditional-success guard here masked contract-matrix
          # failures until the VAL-CDG-012 rearm.
          python -m pip install pytest pytest-asyncio
          pytest tests/server/openapi/test_contract_matrix.py -v --timeout=60

      - name: Validate release envelope helper (dry run)
        run: |
          set -euo pipefail
          python3 scripts/openapi_release_envelope.py dry-run

      # overwrite: v4 artifacts are immutable per run and the name carries no
      # attempt, so re-running all jobs would otherwise 409 on the name laid
      # down by the previous attempt.
      - name: Upload generated spec and SDK types
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OPENAPI_RUN_ARTIFACT }}
          path: |
            docs/api/openapi_generated.json
            docs/api/openapi_generated.yaml
            sdk/typescript/src/openapi-types.ts
            sdk/python/aragora/generated_types.py
            aragora/live/src/types/api.generated.ts
          retention-days: 14
          overwrite: true

      - name: Upload contract drift artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DRIFT_RUN_ARTIFACT }}
          path: |
            /tmp/contract-drift-summary.json
            /tmp/contract-drift-summary.md
            /tmp/CONTRACT_DRIFT_BACKLOG.json
            /tmp/CONTRACT_DRIFT_BACKLOG.md
          retention-days: 14
          overwrite: true

      - name: Comment on PR (if spec changed)
        if: github.event_name == 'pull_request' && steps.compare.outputs.spec_changed == 'true'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '**OpenAPI Spec Update**\n\nThe OpenAPI specification has changed. Please review the generated spec in the workflow artifacts.'
              });
            } catch (error) {
              core.warning(`Unable to post PR comment: ${error.message}`);
            }

  # sync is manual-only: auto-committing to main on every push was armed accidentally by the push trigger (PR #8952 review); dispatch it deliberately.
  sync:
    name: Sync Spec (main only)
    runs-on: ubuntu-latest
    needs: generate-run
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify checkout integrity
        shell: bash
        run: |
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::pyproject.toml missing after checkout; attempting recovery"
            git reset --hard || true
            git clean -ffdx || true
            git sparse-checkout disable || true
            git fetch --no-tags origin "${GITHUB_SHA:-HEAD}" || true
            git checkout -f "${GITHUB_SHA:-HEAD}" || true
            if git rev-parse --verify FETCH_HEAD >/dev/null 2>&1; then
              git reset --hard FETCH_HEAD
            else
              git reset --hard HEAD
            fi
            git clean -ffdx || true
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::Sparse-checkout recovery incomplete; attempting archive restore"
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            if ! git archive "${GITHUB_SHA:-HEAD}" | tar -x; then
              git archive HEAD | tar -x
            fi
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::error::Repository checkout is incomplete (pyproject.toml missing)"
            echo "PWD=$(pwd)"
            ls -la
            exit 1
          fi

      - name: Download generated spec
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.OPENAPI_RUN_ARTIFACT }}
          path: /tmp/openapi-spec/

      - name: Check for changes
        id: changes
        run: |
          # download-artifact@v4 preserves the upload's repo-root-relative
          # layout, so the sources sit at their full nested paths. A flat
          # basename copy matches nothing, and masking that turned the whole
          # sync push into a silent no-op; a missing source now fails the
          # job loudly (the dependent envelope job is then skipped).
          cp /tmp/openapi-spec/docs/api/openapi_generated.json docs/api/openapi.json
          cp /tmp/openapi-spec/docs/api/openapi_generated.yaml docs/api/openapi.yaml
          cp /tmp/openapi-spec/sdk/typescript/src/openapi-types.ts sdk/typescript/src/openapi-types.ts
          cp /tmp/openapi-spec/sdk/python/aragora/generated_types.py sdk/python/aragora/generated_types.py
          cp /tmp/openapi-spec/aragora/live/src/types/api.generated.ts aragora/live/src/types/api.generated.ts
          git diff --quiet docs/api/ sdk/typescript/src/openapi-types.ts sdk/python/aragora/generated_types.py aragora/live/src/types/api.generated.ts || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit updated spec
        if: steps.changes.outputs.changes == 'true'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch latest and reset to handle concurrent changes
          git fetch origin main
          git reset --hard origin/main

          # Re-apply the generated files from the artifact's nested layout
          # (same sources as "Check for changes"; no masking).
          cp /tmp/openapi-spec/docs/api/openapi_generated.json docs/api/openapi.json
          cp /tmp/openapi-spec/docs/api/openapi_generated.yaml docs/api/openapi.yaml
          cp /tmp/openapi-spec/sdk/typescript/src/openapi-types.ts sdk/typescript/src/openapi-types.ts
          cp /tmp/openapi-spec/sdk/python/aragora/generated_types.py sdk/python/aragora/generated_types.py
          cp /tmp/openapi-spec/aragora/live/src/types/api.generated.ts aragora/live/src/types/api.generated.ts

          # Check if there are actual changes
          if git diff --quiet docs/api/ sdk/typescript/src/openapi-types.ts sdk/python/aragora/generated_types.py aragora/live/src/types/api.generated.ts 2>/dev/null; then
            echo "No changes to commit"
            exit 0
          fi

          # Stage and commit
          git add docs/api/openapi.json docs/api/openapi.yaml sdk/typescript/src/openapi-types.ts sdk/python/aragora/generated_types.py aragora/live/src/types/api.generated.ts
          git commit -m "chore(api): auto-update OpenAPI spec and SDK types [skip ci]" || true

          # Push — may fail if branch protection requires status checks.
          # This is expected when GITHUB_TOKEN lacks bypass permissions.
          # The spec generation and validation already passed in the 'generate' job.
          if git push origin main; then
            echo "Successfully pushed OpenAPI spec update"
          else
            echo "::warning::Could not auto-push spec update (branch protection). The generated spec is available as a workflow artifact."
          fi

  # FIX-RT-017 publication path: expiring run artifacts are authoritative only
  # through this immutable, digest-bound release capsule. Dispatch-gated and
  # default-off; the finalization delegation dispatches it deliberately at the
  # exact main head it binds.
  envelope:
    name: Publish Release Envelope (dispatch only)
    runs-on: ubuntu-latest
    # sync runs on the same dispatch+main events and can push a spec-drift
    # commit to main; needing it serializes any such push BEFORE preflight's
    # main-still-at-bound-head check, so the movement is the free exit-3
    # restart instead of a post-publish supersession record.
    needs: [generate-run, sync]
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' && inputs.publish_envelope == true && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write
      attestations: write
      # Preflight/verify re-query the workflow, run, and run-level artifacts;
      # an explicit permissions block zeroes unlisted scopes, so without this
      # read every dispatch would 403 before publication.
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      # The workflow token reads admin-gated settings behind HTTP 404, so
      # in-run report-mode preflight cannot distinguish "immutable releases
      # disabled" from "hidden from this token" and a disabled setting would
      # surface only post-publish. This gate machine-checks the operator's
      # admin-capable {"enabled":true} pre-dispatch read instead of weakening
      # that degradation: without an explicit true, nothing is downloaded,
      # attested, or published.
      - name: Require operator immutable-releases attestation
        env:
          OPERATOR_CONFIRMED: ${{ inputs.operator_confirmed_immutable_releases }}
        run: |
          set -euo pipefail
          if [[ "$OPERATOR_CONFIRMED" != "true" ]]; then
            echo "::error::blocked: operator_confirmed_immutable_releases is not true. Re-run the admin-capable immutable-releases enabled-check and re-dispatch with the attestation input set."
            exit 2
          fi
          echo "Operator immutable-releases attestation present."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify checkout integrity
        shell: bash
        run: |
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::pyproject.toml missing after checkout; attempting recovery"
            git reset --hard || true
            git clean -ffdx || true
            git sparse-checkout disable || true
            git fetch --no-tags origin "${GITHUB_SHA:-HEAD}" || true
            git checkout -f "${GITHUB_SHA:-HEAD}" || true
            if git rev-parse --verify FETCH_HEAD >/dev/null 2>&1; then
              git reset --hard FETCH_HEAD
            else
              git reset --hard HEAD
            fi
            git clean -ffdx || true
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::Sparse-checkout recovery incomplete; attempting archive restore"
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            if ! git archive "${GITHUB_SHA:-HEAD}" | tar -x; then
              git archive HEAD | tar -x
            fi
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::error::Repository checkout is incomplete (pyproject.toml missing)"
            echo "PWD=$(pwd)"
            ls -la
            exit 1
          fi

      - name: Download run-level spec artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.OPENAPI_RUN_ARTIFACT }}
          path: /tmp/openapi-envelope/payload/

      - name: Build deterministic release envelope
        run: |
          set -euo pipefail
          python3 scripts/openapi_release_envelope.py build \
            --repository "$GITHUB_REPOSITORY" \
            --head-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --artifact-name "$OPENAPI_RUN_ARTIFACT" \
            --payload-dir /tmp/openapi-envelope/payload \
            --output-dir /tmp/openapi-envelope/assets
          (cd /tmp/openapi-envelope/assets && sha256sum --check --strict checksums.txt)

      # Attestation precedes publication: the only irreversible step
      # (creating the immutable release) runs last, after the exact local
      # bytes are attested and preflight-verified, so a failure never
      # strands a half-published capsule.
      - name: Attest the envelope assets
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: /tmp/openapi-envelope/assets/*

      - name: Preflight verify before publication
        run: |
          set -euo pipefail
          gh --version
          python3 scripts/openapi_release_envelope.py preflight \
            --repository "$GITHUB_REPOSITORY" \
            --head-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --artifact-name "$OPENAPI_RUN_ARTIFACT" \
            --assets-dir /tmp/openapi-envelope/assets \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/openapi.yml" \
            --admin-reads report

      - name: Publish immutable release
        run: |
          set -euo pipefail
          tag="openapi-envelope-$GITHUB_SHA"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes "Immutable OpenAPI contract envelope for $GITHUB_SHA (run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT)." \
            /tmp/openapi-envelope/assets/*

      - name: Verify release, assets, attestation, and rule suite
        run: |
          set -euo pipefail
          verify_attempt=1
          verify_delays=(5 10 20)
          while true; do
            set +e
            python3 scripts/openapi_release_envelope.py verify \
              --repository "$GITHUB_REPOSITORY" \
              --head-sha "$GITHUB_SHA" \
              --run-id "$GITHUB_RUN_ID" \
              --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --artifact-name "$OPENAPI_RUN_ARTIFACT" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/openapi.yml" \
              --admin-reads report
            verify_rc=$?
            set -e

            if [[ "$verify_rc" -eq 0 ]]; then
              break
            fi
            if [[ "$verify_rc" -ne 2 ]]; then
              exit "$verify_rc"
            fi
            if [[ "$verify_attempt" -gt "${#verify_delays[@]}" ]]; then
              echo "::error::post-publish verification remained blocked after $verify_attempt attempts; use the original-identity recovery runbook."
              exit "$verify_rc"
            fi

            verify_delay="${verify_delays[$((verify_attempt - 1))]}"
            echo "::warning::post-publish verification attempt $verify_attempt blocked; retrying the same immutable capsule in ${verify_delay}s."
            sleep "$verify_delay"
            verify_attempt=$((verify_attempt + 1))
          done

  generate:
    name: Generate & Validate
    needs: [scope, generate-run]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Evaluate OpenAPI result
        env:
          CLASSIFIER_RESULT: ${{ needs.scope.result }}
          WORKER_RESULT: ${{ needs.generate-run.result }}
          IN_SCOPE: ${{ needs.scope.outputs.run_openapi }}
        run: |
          set -euo pipefail
          if [[ "$CLASSIFIER_RESULT" != "success" ]]; then
            echo "::error::OpenAPI scope classification concluded '$CLASSIFIER_RESULT'; its scope verdict cannot be trusted. Failing closed."
            exit 1
          fi
          case "$IN_SCOPE" in
            true)
              if [[ "$WORKER_RESULT" != "success" ]]; then
                echo "::error::OpenAPI generate & validate concluded '$WORKER_RESULT' (expected 'success'). Failing closed."
                exit 1
              fi
              echo "OpenAPI generate & validate passed."
              ;;
            false)
              if [[ "$WORKER_RESULT" != "skipped" ]]; then
                echo "::error::OpenAPI was out of scope but concluded '$WORKER_RESULT'. Failing closed."
                exit 1
              fi
              echo "OpenAPI not required — no relevant changes."
              ;;
            *)
              echo "::error::OpenAPI scope classification produced invalid IN_SCOPE value '$IN_SCOPE' (expected exactly 'true' or 'false'). Failing closed."
              exit 1
              ;;
          esac
