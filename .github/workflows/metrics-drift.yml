name: Metrics Drift

# Validates docs/METRICS.md against ground truth. The script
# scripts/regenerate_metrics.py recounts every canonical metric
# (tests, LOC, OpenAPI paths, adapters, etc.) and fails if any value
# drifts more than 0.5% from the committed doc.
#
# Thesis alignment (Commitment 4: respect the limits): public numeric
# claims must remain honest as the codebase grows. Silent staleness
# is a failure mode.
#
# Triggers:
#   - PR: when the script, the doc, or any counted surface changes.
#   - Weekly (Monday 05:00 UTC): catch drift introduced by changes
#     that didn't touch the script but did change counted surfaces
#     (new tests, new routes, new adapters, etc.).
#   - Manual: workflow_dispatch.

on:
  pull_request:
    branches: [main]
    paths:
      - 'aragora/**'
      - 'tests/**'
      - 'sdk/python/aragora_sdk/**'
      - 'sdk/typescript/src/**'
      - 'docs/api/openapi.json'
      - 'docs/METRICS.md'
      - 'scripts/regenerate_metrics.py'
      - '.mypy-baseline'
      # The import-cycle ratchet builds its graph from the `aragora` package
      # only, so `aragora/**` above already re-runs it for every source
      # change that can add a cycle; these two entries cover the measurer
      # and its frozen baseline.
      - 'scripts/ci/measure_import_graph.py'
      - 'scripts/baselines/import_cycles_baseline.json'
      - '.github/workflows/metrics-drift.yml'
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

concurrency:
  group: metrics-drift-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Depth 2 so the synthetic merge commit's parents are available:
          # HEAD^1 is the exact main tip this merge was computed against,
          # which is what base attribution compares to.
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - name: Snapshot base ref for drift attribution
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          # PR runs execute on the synthetic merge commit (PR head merged
          # into the current main tip), so the live counts include every
          # main-side change since docs/METRICS.md was last refreshed —
          # drift the PR did not cause. Snapshot the metrics at the merge
          # commit's first parent (the exact main tip) so the check can
          # attribute that drift to main instead of failing the PR.
          if ! base_sha=$(git rev-parse -q --verify HEAD^1); then
            echo "No merge parent found; base attribution skipped (strict check)."
            exit 0
          fi
          git worktree add --detach /tmp/base-tree "$base_sha"
          # Run the PR-side counters against the base tree so counter
          # changes in the PR cannot masquerade as metric drift.
          cp scripts/regenerate_metrics.py scripts/repository_metrics.py /tmp/base-tree/scripts/
          (cd /tmp/base-tree && python3 scripts/regenerate_metrics.py --json > /tmp/base-live.json)
          cp /tmp/base-tree/docs/METRICS.md /tmp/base-doc.md
          echo "Base attribution snapshot taken at $base_sha"

      - name: Verify drift
        id: check
        shell: bash
        run: |
          set -euo pipefail

          # Snapshot the committed doc into a backup BEFORE any regeneration
          # so the post-check diff is unambiguous: committed-doc vs what-live-
          # numbers-would-produce. Without this snapshot, a reviewer cannot
          # tell whether the diff was between two regenerations or between
          # the committed state and current truth.
          cp docs/METRICS.md /tmp/metrics-committed.md

          # PR runs: attribute drift to the base ref when the snapshot from
          # the previous step exists — drift pre-existing on main is
          # reported as INHERITED and does not fail this PR.
          ATTRIB_ARGS=()
          if [ -f /tmp/base-live.json ] && [ -f /tmp/base-doc.md ]; then
            ATTRIB_ARGS=(--base-json /tmp/base-live.json --base-doc /tmp/base-doc.md)
          fi

          if ! python3 scripts/regenerate_metrics.py --check "${ATTRIB_ARGS[@]}"; then
            echo "::error::docs/METRICS.md is stale. Run 'python3 scripts/regenerate_metrics.py' locally and commit the updated doc."
            echo ""
            echo "=== DIFF: committed doc vs current ground truth ==="
            # Regenerate into a temp file without touching the tracked file,
            # then diff the two explicit artifacts.
            python3 scripts/regenerate_metrics.py --json > /tmp/metrics-live.json
            python3 scripts/regenerate_metrics.py
            diff -u /tmp/metrics-committed.md docs/METRICS.md | head -200 || true
            # Restore the committed doc so downstream steps see the original.
            cp /tmp/metrics-committed.md docs/METRICS.md
            exit 1
          fi

      - name: Emit summary
        if: always()
        shell: bash
        run: |
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "## Metrics Drift Check"
              echo ""
              if [ "${{ job.status }}" = "success" ]; then
                echo "- Status: passed (no metric drifted more than 0.5%)"
              else
                echo "- Status: failed — \`docs/METRICS.md\` is stale"
                echo ""
                echo "Run locally:"
                echo ""
                echo '```sh'
                echo 'python3 scripts/regenerate_metrics.py'
                echo 'git add docs/METRICS.md'
                echo 'git commit -m "chore(docs): refresh METRICS.md"'
                echo '```'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  import-cycles:
    name: Import cycle ratchet (non-required)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install grimp
        # Pinned so the strict lane compares like with like across runs; bump
        # deliberately (and re-measure) rather than floating with upstream.
        run: python3 -m pip install -q "grimp==3.17"

      - name: Measure mutual import cycles at head
        if: github.event_name == 'pull_request'
        id: head
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/measure_import_graph.py --json > /tmp/head.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          print("cycles=" + str(json.load(open("/tmp/head.json"))["mutual_import_cycles"]))
          PY

      - name: Fail only on growth this PR introduces
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          HEAD_CYCLES: ${{ steps.head.outputs.cycles }}
        run: |
          set -euo pipefail
          base_sha=$(git rev-parse -q --verify HEAD^1)
          git worktree add --detach /tmp/base-tree "$base_sha"
          mkdir -p /tmp/base-tree/scripts/ci
          cp scripts/ci/measure_import_graph.py /tmp/base-tree/scripts/ci/measure_import_graph.py
          (cd /tmp/base-tree && python3 scripts/ci/measure_import_graph.py --json > /tmp/base.json)
          read -r base head_frozen base_frozen < <(python3 - <<'PY'
          import json, os
          base = json.load(open("/tmp/base.json"))["mutual_import_cycles"]
          head_frozen = json.load(open("scripts/baselines/import_cycles_baseline.json"))["value"]
          base_path = "/tmp/base-tree/scripts/baselines/import_cycles_baseline.json"
          base_frozen = json.load(open(base_path))["value"] if os.path.exists(base_path) else head_frozen
          print(base, head_frozen, base_frozen)
          PY
          )
          head="$HEAD_CYCLES"
          echo "mutual import cycles: base=$base head=$head frozen_baseline=$head_frozen (base tree: $base_frozen)"
          if [ "$head_frozen" -gt "$base_frozen" ]; then
            echo "::error::This PR raises the frozen cycles baseline $base_frozen -> $head_frozen. The baseline is shrink-only; re-freeze only after removing cycles (scripts/ci/measure_import_graph.py --freeze)."
            exit 1
          fi
          if [ "$head" -gt "$base" ]; then
            echo "::error::This PR adds $((head - base)) mutual import cycle(s). The ratchet is shrink-only; remove the new mutual import (see #9240 for the current identity set)."
            exit 1
          fi
          if [ "$head" -gt "$head_frozen" ]; then
            echo "::warning::main is above the frozen baseline ($head > $head_frozen). Inherited, not introduced by this PR. Repair is tracked in #9240."
          fi

      - name: Strict ratchet against the frozen baseline (schedule and manual runs)
        if: github.event_name != 'pull_request'
        run: python3 scripts/ci/measure_import_graph.py --check
