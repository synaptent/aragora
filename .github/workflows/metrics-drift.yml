name: Metrics Drift

# Validates docs/METRICS.md against ground truth. The script
# scripts/regenerate_metrics.py recounts every canonical metric
# (tests, LOC, OpenAPI paths, adapters, etc.) and fails if any value
# drifts more than 0.5% from the committed doc.
#
# Thesis alignment (Commitment 4: respect the limits): public numeric
# claims must remain honest as the codebase grows. Silent staleness
# is a failure mode.
#
# Triggers:
#   - PR: when the script, the doc, or any counted surface changes.
#   - Weekly (Monday 05:00 UTC): catch drift introduced by changes
#     that didn't touch the script but did change counted surfaces
#     (new tests, new routes, new adapters, etc.).
#   - Manual: workflow_dispatch.

on:
  pull_request:
    branches: [main]
    paths:
      - 'aragora/**'
      - 'tests/**'
      - 'sdk/python/aragora_sdk/**'
      - 'sdk/typescript/src/**'
      - 'docs/api/openapi.json'
      - 'docs/METRICS.md'
      - 'scripts/regenerate_metrics.py'
      - '.mypy-baseline'
      # The import-cycle ratchet builds its graph from the `aragora` package
      # only, so `aragora/**` above already re-runs it for every source
      # change that can add a cycle; these two entries cover the measurer
      # and its frozen baseline.
      - 'scripts/ci/measure_import_graph.py'
      - 'scripts/baselines/import_cycles_baseline.json'
      - '.github/workflows/metrics-drift.yml'
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

concurrency:
  group: metrics-drift-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Depth 2 so the synthetic merge commit's parents are available:
          # HEAD^1 is the exact main tip this merge was computed against,
          # which is what base attribution compares to.
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - name: Snapshot base ref for drift attribution
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          # PR runs execute on the synthetic merge commit (PR head merged
          # into the current main tip), so the live counts include every
          # main-side change since docs/METRICS.md was last refreshed —
          # drift the PR did not cause. Snapshot the metrics at the merge
          # commit's first parent (the exact main tip) so the check can
          # attribute that drift to main instead of failing the PR.
          if ! base_sha=$(git rev-parse -q --verify HEAD^1); then
            echo "No merge parent found; base attribution skipped (strict check)."
            exit 0
          fi
          git worktree add --detach /tmp/base-tree "$base_sha"
          # Run the PR-side counters against the base tree so counter
          # changes in the PR cannot masquerade as metric drift.
          cp scripts/regenerate_metrics.py scripts/repository_metrics.py /tmp/base-tree/scripts/
          (cd /tmp/base-tree && python3 scripts/regenerate_metrics.py --json > /tmp/base-live.json)
          cp /tmp/base-tree/docs/METRICS.md /tmp/base-doc.md
          echo "Base attribution snapshot taken at $base_sha"

      - name: Verify drift
        id: check
        shell: bash
        run: |
          set -euo pipefail

          # Snapshot the committed doc into a backup BEFORE any regeneration
          # so the post-check diff is unambiguous: committed-doc vs what-live-
          # numbers-would-produce. Without this snapshot, a reviewer cannot
          # tell whether the diff was between two regenerations or between
          # the committed state and current truth.
          cp docs/METRICS.md /tmp/metrics-committed.md

          # PR runs: attribute drift to the base ref when the snapshot from
          # the previous step exists — drift pre-existing on main is
          # reported as INHERITED and does not fail this PR.
          ATTRIB_ARGS=()
          if [ -f /tmp/base-live.json ] && [ -f /tmp/base-doc.md ]; then
            ATTRIB_ARGS=(--base-json /tmp/base-live.json --base-doc /tmp/base-doc.md)
          fi

          if ! python3 scripts/regenerate_metrics.py --check "${ATTRIB_ARGS[@]}"; then
            echo "::error::docs/METRICS.md is stale. Run 'python3 scripts/regenerate_metrics.py' locally and commit the updated doc."
            echo ""
            echo "=== DIFF: committed doc vs current ground truth ==="
            # Regenerate into a temp file without touching the tracked file,
            # then diff the two explicit artifacts.
            python3 scripts/regenerate_metrics.py --json > /tmp/metrics-live.json
            python3 scripts/regenerate_metrics.py
            diff -u /tmp/metrics-committed.md docs/METRICS.md | head -200 || true
            # Restore the committed doc so downstream steps see the original.
            cp /tmp/metrics-committed.md docs/METRICS.md
            exit 1
          fi

      - name: Emit summary
        if: always()
        shell: bash
        run: |
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "## Metrics Drift Check"
              echo ""
              if [ "${{ job.status }}" = "success" ]; then
                echo "- Status: passed (no metric drifted more than 0.5%)"
              else
                echo "- Status: failed — \`docs/METRICS.md\` is stale"
                echo ""
                echo "Run locally:"
                echo ""
                echo '```sh'
                echo 'python3 scripts/regenerate_metrics.py'
                echo 'git add docs/METRICS.md'
                echo 'git commit -m "chore(docs): refresh METRICS.md"'
                echo '```'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  import-cycles:
    name: Import cycle ratchet (non-required)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install grimp
        # Pinned so the strict lane compares like with like across runs; bump
        # deliberately (and re-measure) rather than floating with upstream.
        run: python3 -m pip install -q "grimp==3.17"

      - name: Measure mutual import cycles at head
        if: github.event_name == 'pull_request'
        id: head
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/measure_import_graph.py --json > /tmp/head.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          print("cycles=" + str(json.load(open("/tmp/head.json"))["mutual_import_cycles"]))
          PY

      - name: Fail only on growth this PR introduces
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          HEAD_CYCLES: ${{ steps.head.outputs.cycles }}
        run: |
          set -euo pipefail
          base_sha=$(git rev-parse -q --verify HEAD^1)
          git worktree add --detach /tmp/base-tree "$base_sha"
          mkdir -p /tmp/base-tree/scripts/ci
          cp scripts/ci/measure_import_graph.py /tmp/base-tree/scripts/ci/measure_import_graph.py
          (cd /tmp/base-tree && python3 scripts/ci/measure_import_graph.py --json > /tmp/base.json)
          read -r base head_frozen base_frozen < <(python3 - <<'PY'
          import json, os
          base = json.load(open("/tmp/base.json"))["mutual_import_cycles"]
          head_frozen = json.load(open("scripts/baselines/import_cycles_baseline.json"))["value"]
          base_path = "/tmp/base-tree/scripts/baselines/import_cycles_baseline.json"
          base_frozen = json.load(open(base_path))["value"] if os.path.exists(base_path) else head_frozen
          print(base, head_frozen, base_frozen)
          PY
          )
          head="$HEAD_CYCLES"
          echo "mutual import cycles: base=$base head=$head frozen_baseline=$head_frozen (base tree: $base_frozen)"
          if [ "$head_frozen" -gt "$base_frozen" ]; then
            echo "::error::This PR raises the frozen cycles baseline $base_frozen -> $head_frozen. The baseline is shrink-only; re-freeze only after removing cycles (scripts/ci/measure_import_graph.py --freeze)."
            exit 1
          fi
          if [ "$head" -gt "$base" ]; then
            echo "::error::This PR adds $((head - base)) mutual import cycle(s). The ratchet is shrink-only; remove the new mutual import (see #9240 for the current identity set)."
            exit 1
          fi
          if [ "$head" -gt "$head_frozen" ]; then
            echo "::warning::main is above the frozen baseline ($head > $head_frozen). Inherited, not introduced by this PR. Repair is tracked in #9240."
          fi

      - name: Strict ratchet against the frozen baseline (schedule and manual runs)
        if: github.event_name != 'pull_request'
        run: python3 scripts/ci/measure_import_graph.py --check

  atlas:
    name: Disagreement Atlas
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Cold caches may span several API-budget windows; the collector backs off itself.
    timeout-minutes: 360
    permissions:
      contents: read
      issues: read
      pull-requests: read
      statuses: read
    outputs:
      artifact-id: ${{ steps.atlas_upload.outputs.artifact-id }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ARAGORA_USE_SECRETS_MANAGER: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Atlas dependencies
        run: bash scripts/ci_install_project.sh

      - name: Set Atlas scratch paths
        run: |
          echo "ATLAS_CACHE=$RUNNER_TEMP/atlas-cache" >> "$GITHUB_ENV"
          echo "ATLAS_OUT=$RUNNER_TEMP/atlas-output" >> "$GITHUB_ENV"

      - name: Restore Atlas fetch cache
        id: atlas_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.ATLAS_CACHE }}
          key: atlas-fetch-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            atlas-fetch-v1-${{ runner.os }}-

      - name: Collect Atlas incrementally
        id: atlas_collect
        # Leave time to persist partial fetches even if collection exhausts its budget.
        timeout-minutes: 300
        shell: bash
        run: |
          set -euo pipefail
          # Retry once from saved per-PR responses; never publish an incomplete corpus.
          for attempt in 1 2; do
            log="$RUNNER_TEMP/atlas-collect-$attempt.log"
            if python3 scripts/build_disagreement_atlas.py collect --cache-dir "$ATLAS_CACHE" \
                --repo "$GH_REPO" --refresh-index 2>&1 | tail -n 200 | tail -c 16384 > "$log"; then
              cat "$log"
              exit 0
            fi
            cat "$log" >&2
            if [ "$attempt" -eq 1 ]; then
              echo "atlas: collection incomplete; retrying once from cache" >&2
              sleep 10
            fi
          done
          echo "::error::Atlas collection incomplete after two attempts; publication blocked. Inspect collection diagnostics and restore source access before retrying." >&2
          exit 1

      - name: Upload Atlas collection diagnostics
        if: failure() && steps.atlas_collect.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: atlas-collection-errors-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/atlas-collect-*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Save Atlas fetch cache
        if: always() && steps.atlas_cache.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.ATLAS_CACHE }}
          key: ${{ steps.atlas_cache.outputs.cache-primary-key }}

      - name: Build Atlas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ATLAS_OUT"
          python3 scripts/build_disagreement_atlas.py build --cache-dir "$ATLAS_CACHE" \
            --out "$ATLAS_OUT/atlas-v1.jsonl" --manifest "$ATLAS_OUT/manifest.json" \
            --schema docs/atlas/schema.json --repo-root "$GITHUB_WORKSPACE" --force-sample
          python3 scripts/build_disagreement_atlas.py summary \
            --dataset "$ATLAS_OUT/atlas-v1.jsonl" --manifest "$ATLAS_OUT/manifest.json" \
            --out "$ATLAS_OUT/summary.md"
          python3 scripts/build_disagreement_atlas.py verify \
            --manifest "$ATLAS_OUT/manifest.json" --repo-root "$ATLAS_OUT" --require-dataset

      - name: Name Atlas artifact
        id: atlas_date
        run: echo "tag=atlas-$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Upload Atlas artifact
        id: atlas_upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.atlas_date.outputs.tag }}
          if-no-files-found: error
          path: |
            ${{ env.ATLAS_OUT }}/atlas-v1.jsonl
            ${{ env.ATLAS_OUT }}/atlas-v1.sample.jsonl
            ${{ env.ATLAS_OUT }}/manifest.json
            ${{ env.ATLAS_OUT }}/summary.md

      - name: Explain branch release skip
        if: github.ref != 'refs/heads/main'
        run: 'echo "atlas: non-main ref; artifact uploaded; release skipped"'

  publish-atlas:
    name: Publish Disagreement Atlas
    needs: atlas
    if: >-
      github.ref == 'refs/heads/main' && needs.atlas.result == 'success' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Require Atlas artifact
        env:
          ATLAS_ARTIFACT_ID: ${{ needs.atlas.outputs.artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${ATLAS_ARTIFACT_ID:-}" =~ ^[1-9][0-9]*$ ]]; then
            echo "atlas: successful build artifact ID missing or invalid" >&2
            exit 1
          fi
          echo "ATLAS_OUT=$RUNNER_TEMP/atlas-output" >> "$GITHUB_ENV"

      - name: Download this run's Atlas artifact
        uses: actions/download-artifact@v4
        with:
          # No cross-run token or run-id override: consume only this run's upload.
          artifact-ids: ${{ needs.atlas.outputs.artifact-id }}
          path: ${{ env.ATLAS_OUT }}
          merge-multiple: true

      - name: Publish dated Atlas release
        shell: bash
        run: |
          set -euo pipefail
          today=$(date -u +%F)
          if gh release view "atlas-$today" > /dev/null 2> "$RUNNER_TEMP/atlas-release-view.err"; then
            echo "atlas: dated release already exists; no release"
            exit 0
          elif ! grep -q 'release not found' "$RUNNER_TEMP/atlas-release-view.err"; then
            cat "$RUNNER_TEMP/atlas-release-view.err" >&2
            exit 1
          fi
          latest=$(gh release list --limit 100 --exclude-drafts --json tagName \
            --jq '[.[] | select(.tagName | startswith("atlas-"))][0].tagName // empty')
          sha=$(jq -er '.dataset.sha256' "$ATLAS_OUT/manifest.json")
          if [ -n "$latest" ]; then
            previous=$(mktemp -d "$RUNNER_TEMP/atlas-previous.XXXXXX")
            gh release download "$latest" --pattern manifest.json --dir "$previous"
            previous_sha=$(jq -er '.dataset.sha256' "$previous/manifest.json")
            if [ "$sha" = "$previous_sha" ]; then
              echo "atlas: dataset unchanged ($sha); no release"
              exit 0
            fi
          fi
          gh release create "atlas-$today" \
            "$ATLAS_OUT/atlas-v1.jsonl" "$ATLAS_OUT/atlas-v1.sample.jsonl" \
            "$ATLAS_OUT/manifest.json" "$ATLAS_OUT/summary.md" \
            --target main --latest=false --title "Disagreement Atlas $today" \
            --notes "Weekly Atlas regeneration. Dataset SHA-256: $sha"
