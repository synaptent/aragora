name: Mac Runner Health Poll

# Weekly SSH into each Mac runner to read the TIME_WAIT / health log.
# Alerts via a runner-health labeled issue if:
#   (a) any host's latest log line shows TIME_WAIT > threshold, or
#   (b) any host's log hasn't been appended to in >48h (indicates the
#       launchd job itself is stuck — the condition we CAN'T detect
#       from the host's own alerting path), or
#   (c) any host has less than DISK_MIN_FREE_GB of free space.
#
# The disk check exists because on 2026-07-27 mac-studio-m3ultra was found
# 100% full (132 MiB free of 926 GiB) after an unrotated third-party log grew
# to 474 GB. Every CI job on that host had been failing with ENOSPC since
# ~2026-07-09 — and this poll ran green every week throughout, because it only
# looked at TIME_WAIT and log freshness. The runner also could not upload its
# own job logs, so the failures surfaced as red jobs with no retrievable log.
#
# Survives the failure mode from issue #6474: the host's outbound TCP
# was broken, so a host-initiated alert would not have reached GH.
# This workflow runs on GH-hosted ubuntu and SSHes IN to the Macs.
#
# This job fails loudly if it cannot poll (missing SSH key), and only reports
# "healthy" when the poll actually ran and returned no drift. It must never be
# possible for this workflow to be green without having checked anything.

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  issues: write
  contents: read

concurrency:
  group: mac-runner-health-poll
  cancel-in-progress: false

env:
  THRESHOLD: "5000"
  STALE_HOURS: "48"
  # Absolute headroom, not a percentage: npm/pip/node need bytes, and the
  # fleet's Macs all have ~926 GB disks. Observed healthy free space on
  # 2026-07-27 was 441 GB (mac-studio) and 232 GB (macbook-intel), so 50 GB is
  # quiet in steady state while still leaving lead time at a weekly cadence.
  DISK_MIN_FREE_GB: "50"

jobs:
  poll:
    name: Poll Mac runner TIME_WAIT logs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ssh client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-client

      - name: Setup SSH key
        env:
          MAC_RUNNER_SSH_KEY: ${{ secrets.MAC_RUNNER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -z "${MAC_RUNNER_SSH_KEY:-}" ]; then
            # Hard failure, not a warning. This previously warned and exited 0,
            # so every scheduled run since the workflow landed reported success
            # while polling nothing -- the secret has never been set. That green
            # tick was read as "Macs are healthy" for months, including the
            # ~3 weeks mac-studio-m3ultra spent with a full disk failing every
            # CI job on it. A monitor that cannot run must be loudly broken.
            echo "::error::MAC_RUNNER_SSH_KEY secret is not set, so no Mac runner can be polled. Add the secret (private key authorized on all hosts in HOSTS_JSON) or disable this workflow. Do not leave it green and inert."
            exit 1
          fi
          echo "$MAC_RUNNER_SSH_KEY" > ~/.ssh/mac_runner
          chmod 600 ~/.ssh/mac_runner
          echo "KEY_READY=1" >> "$GITHUB_ENV"

      - name: Poll each Mac
        id: poll
        env:
          HOSTS_JSON: |
            [
              {"name": "mac-studio-m3ultra", "host": "mac-studio.aragora.ts.net"},
              {"name": "macbook-m1-16gb", "host": "macbook-pro16gb.aragora.ts.net"},
              {"name": "macbook-intel-64gb", "host": "macbook-pro-3.aragora.ts.net"}
            ]
        run: |
          set +e
          declare -a alerts=()

          while read -r entry; do
            name=$(echo "$entry" | jq -r '.name')
            host=$(echo "$entry" | jq -r '.host')

            echo "=== Polling $name ($host) ==="

            # -n is load-bearing: without it ssh inherits this loop's stdin (the
            # jq host stream) and forwards it to the remote, draining the remaining
            # hosts. The loop would then exit after the FIRST host with alerts empty
            # and report every Mac healthy. See tests/ci/test_workflow_ssh_stdin.py.
            LAST_LINE=$(ssh -n -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
                           -i ~/.ssh/mac_runner \
                           armand@"$host" \
                           'tail -n 1 ~/Library/Logs/aragora-runner-health.log 2>/dev/null || echo no-log' \
                           2>/dev/null || echo "ssh-failed")

            echo "  last: $LAST_LINE"

            if [ "$LAST_LINE" = "ssh-failed" ]; then
              alerts+=("$name: SSH unreachable")
              continue
            fi

            # Disk check runs before the health-log checks below, so a host with
            # a missing or stale log still gets its free space reported. On APFS
            # "/" is the read-only system snapshot, but it shares the container's
            # free space with /System/Volumes/Data, so a single df is accurate.
            DISK_FREE_KB=$(ssh -n -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
                               -i ~/.ssh/mac_runner \
                               armand@"$host" \
                               'df -Pk / | tail -1 | tr -s " " | cut -d" " -f4' \
                               2>/dev/null || echo "")

            case "$DISK_FREE_KB" in
              ''|*[!0-9]*)
                alerts+=("$name: could not read free disk space")
                ;;
              *)
                DISK_FREE_GB=$(( DISK_FREE_KB / 1048576 ))
                echo "  disk: ${DISK_FREE_GB} GB free"
                if [ "$DISK_FREE_GB" -lt "$DISK_MIN_FREE_GB" ]; then
                  alerts+=("$name: only ${DISK_FREE_GB} GB free < ${DISK_MIN_FREE_GB} GB minimum")
                fi
                ;;
            esac

            if [ "$LAST_LINE" = "no-log" ]; then
              alerts+=("$name: health log missing")
              continue
            fi

            TS=$(echo "$LAST_LINE" | grep -oE 'ts=[^ ]+' | cut -d= -f2 | head -1)
            TW=$(echo "$LAST_LINE" | grep -oE 'timewait=[0-9]+' | cut -d= -f2 | head -1)

            if [ -z "$TW" ]; then
              alerts+=("$name: could not parse timewait from: $LAST_LINE")
              continue
            fi

            if [ "$TW" -gt "$THRESHOLD" ]; then
              alerts+=("$name: TIME_WAIT=$TW > threshold $THRESHOLD (at $TS)")
            fi

            if [ -n "$TS" ]; then
              NOW_EPOCH=$(date -u +%s)
              LAST_EPOCH=$(date -u -d "$TS" +%s 2>/dev/null || echo 0)
              HOURS_STALE=$(( (NOW_EPOCH - LAST_EPOCH) / 3600 ))
              if [ "$HOURS_STALE" -gt "$STALE_HOURS" ]; then
                alerts+=("$name: log stale by ${HOURS_STALE}h > $STALE_HOURS")
              fi
            fi
          done < <(echo "$HOSTS_JSON" | jq -c '.[]')

          if [ ${#alerts[@]} -gt 0 ]; then
            {
              echo "alerts<<EOF"
              printf '%s\n' "${alerts[@]}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "drift=1" >> "$GITHUB_OUTPUT"
          else
            echo "drift=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Open alert issue
        if: steps.poll.outputs.drift == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALERTS: ${{ steps.poll.outputs.alerts }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TITLE="runners: Mac health alert $(date -u +%Y-%m-%d)"
          BODY=$(cat <<BODY_END
          ## Mac runner health alert

          Weekly poll detected one or more issues:

          \`\`\`
          $ALERTS
          \`\`\`

          ### What to check

          - **TIME_WAIT > threshold**: reboot the affected host. See docs/runners/FLEET.md "Past incidents" section for the #6474 playbook.
          - **Health log missing or stale**: SSH in and verify the \`com.aragora.runner-health\` launchd job is loaded: \`launchctl list | grep runner-health\`.
          - **SSH unreachable**: host may be off, on a different network, or have SSH disabled.
          - **Low free disk**: find the consumer with \`du -xh -d1 ~ | sort -rh | head\`, then drill down. A full disk fails CI jobs with \`ENOSPC\` **and** stops the runner uploading its own job logs, so those jobs go red with a \`BlobNotFound\` 404 and no visible error. Recover the missing output from \`~/actions-runner/_diag/pages/\` on the host. Truncate oversized logs in place (\`: > file.log\`) rather than deleting — launchd holds them open in append mode, so unlink/rename reclaims nothing.

          [Run log]($SERVER_URL/$REPO/actions/runs/$RUN_ID)
          BODY_END
          )

          gh label create runner-health \
            --description "Mac runner health and TIME_WAIT alerts" \
            --color "B60205" \
            2>/dev/null || true

          EXISTING=$(gh issue list --label runner-health --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label runner-health
          fi

      - name: Report clean
        if: steps.poll.outputs.drift == '0'
        run: echo "::notice::All Mac runners healthy — TIME_WAIT within threshold, logs fresh, disk above minimum."
