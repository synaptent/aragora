name: Publish TypeScript SDK to npm

# Publishes `@aragora/sdk` from sdk/typescript/ to npm.
# Triggers on version tags or manual dispatch.

on:
  push:
    tags:
      - 'sdk-ts-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 2.7.5)'
        required: true
        type: string
      dry_run:
        description: 'Dry run only (skip actual publish)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: publish-ts-sdk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: aragora
    timeout-minutes: 15
    name: Test TypeScript SDK (Node ${{ matrix.node-version }})
    strategy:
      fail-fast: true
      matrix:
        node-version: ['20', '22']

    defaults:
      run:
        working-directory: sdk/typescript

    steps:
      - uses: actions/checkout@v4

      - name: Verify checkout integrity
        shell: bash
        # The job default is sdk/typescript; pyproject.toml lives at the repository root.
        working-directory: ${{ github.workspace }}
        run: |
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::pyproject.toml missing after checkout; attempting recovery"
            git sparse-checkout disable || true
            git fetch --no-tags origin "${GITHUB_SHA:-HEAD}"
            git reset --hard FETCH_HEAD
            git clean -ffd || true
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::Standard recovery failed; attempting archive restore"
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            git archive "${GITHUB_SHA:-HEAD}" | tar -x || git archive HEAD | tar -x
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::error::Repository checkout is incomplete (pyproject.toml missing)"
            echo "PWD=$(pwd)"
            ls -la
            exit 1
          fi

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  build-and-publish:
    needs: test
    # npm trusted publishing (OIDC) does not support self-hosted runners, so the
    # publish job runs GitHub-hosted. The trusted publisher on npmjs.com is bound
    # to synaptent/aragora + this workflow file; no NPM_TOKEN is used.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # GitHub release on sdk-ts-v* tags
      id-token: write  # npm trusted publishing

    defaults:
      run:
        working-directory: sdk/typescript

    steps:
      - uses: actions/checkout@v4

      - name: Verify checkout integrity
        shell: bash
        # The job default is sdk/typescript; pyproject.toml lives at the repository root.
        working-directory: ${{ github.workspace }}
        run: |
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::pyproject.toml missing after checkout; attempting recovery"
            git sparse-checkout disable || true
            git fetch --no-tags origin "${GITHUB_SHA:-HEAD}"
            git reset --hard FETCH_HEAD
            git clean -ffd || true
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::Standard recovery failed; attempting archive restore"
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            git archive "${GITHUB_SHA:-HEAD}" | tar -x || git archive HEAD | tar -x
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::error::Repository checkout is incomplete (pyproject.toml missing)"
            echo "PWD=$(pwd)"
            ls -la
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 24 bundles npm 11, which trusted publishing needs (>= 11.5.1).
          # No dependency cache in a release build.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Require an npm that supports trusted publishing
        run: |
          v=$(npm --version)
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$v" \
            || { echo "::error::npm $v cannot use trusted publishing (needs >= 11.5.1)"; exit 1; }
          echo "npm $v"

      - name: Install dependencies
        run: npm ci

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            # Extract version from tag: sdk-ts-v1.2.3 -> 1.2.3
            VERSION="${GITHUB_REF_NAME#sdk-ts-v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION"

      - name: Update version
        run: npm version ${{ steps.version.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Build
        run: npm run build

      - name: Dry run -- validate package
        run: |
          npm pack --dry-run
          echo ""
          echo "=== Package contents ==="
          npm pack --dry-run 2>&1 | tail -20

      - name: Check version not already published
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true') }}
        run: |
          PACKAGE_NAME=$(npm pkg get name | tr -d '"')
          LOCAL=$(npm pkg get version | tr -d '"')
          PUBLISHED=$(npm view "$PACKAGE_NAME" version 2>/dev/null || echo "none")
          if [ "$PUBLISHED" = "$LOCAL" ]; then
            echo "::error::Version $LOCAL already published to npm"
            exit 1
          fi
          echo "Publishing $PACKAGE_NAME@$LOCAL (current published: $PUBLISHED)"

      - name: Publish to npm
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true') }}
        # Authenticates through the npm trusted publisher (OIDC); provenance is automatic.
        run: npm publish --access public

      - name: Dry run summary
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
        run: |
          echo "::notice::DRY RUN complete. Package built and validated but NOT published."
          echo "Package: @aragora/sdk@${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        if: ${{ github.event_name == 'push' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: TypeScript SDK v${{ steps.version.outputs.version }}
          body: |
            ## TypeScript SDK v${{ steps.version.outputs.version }}

            Install with:
            ```bash
            npm install @aragora/sdk@${{ steps.version.outputs.version }}
            ```

            See [documentation](https://docs.aragora.ai/guides/sdk) for usage.
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'alpha') || contains(steps.version.outputs.version, 'rc') }}
