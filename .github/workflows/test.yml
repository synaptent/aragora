  # Full compatibility matrix with test sharding
  # ============================================================
  # Test Sharding Strategy:
  #   Shard 1 (handlers):  tests/handlers/ (~646 test files, ~20k tests)
  #   Shard 2 (server):    tests/server/ (~756 test files)
  #   Shard 3 (core):      tests/debate/ tests/agents/ tests/knowledge/ tests/memory/
  #                         tests/resilience/ tests/workflow/ tests/rlm/ tests/reasoning/
  #   Shard 4 (remaining): everything else via --ignore exclusions
  # ============================================================
  test:
    # The full OS/Python compatibility matrix duplicates the faster PR shards
    # and routinely exceeds the 30-minute job cap on ordinary PRs. Keep it for
    # nightly/manual coverage; PR admission is covered by test-fast, focused
    # integration smoke, zero-coverage, type, lint, SDK, and spec gates.
    if: github.event_name != 'pull_request'
    name: Test (${{ matrix.shard.name }}, ${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: [test-fast, aragora-debate-tests]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        shard:
          - name: handlers
            path: tests/handlers/
            index: 1
          - name: server
            path: tests/server/
            index: 2
          - name: core
            path: >-
              tests/debate/ tests/agents/ tests/knowledge/ tests/memory/
              tests/resilience/ tests/workflow/ tests/rlm/ tests/reasoning/
              tests/client/
            index: 3
          - name: remaining
            # Runs tests/ with --ignore for shards 1-3 dirs (set in step below)
            path: tests/
            index: 4
        exclude:
          # Reduce matrix size - only test 3.11 on Windows/macOS
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.13"
          # Skip Ubuntu 3.11 - covered by test-fast
          - os: ubuntu-latest
            python-version: "3.11"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify checkout integrity
        shell: bash
        run: |
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::pyproject.toml missing after checkout; attempting recovery"
            git sparse-checkout disable || true
            git fetch --no-tags origin "${GITHUB_SHA:-HEAD}"
            git reset --hard FETCH_HEAD
            git clean -ffd || true
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::Standard recovery failed; attempting archive restore"
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            git archive "${GITHUB_SHA:-HEAD}" | tar -x || git archive HEAD | tar -x
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::error::Repository checkout is incomplete (pyproject.toml missing)"
            echo "PWD=$(pwd)"
            ls -la
            exit 1
          fi

      - name: Set up Python
        uses: ./.github/actions/setup-python-safe
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          bash scripts/ci_install_project.sh --extras dev,research,test
          python -m pip install pytest-cov pytest-timeout pytest-xdist

      - name: Run tests – shard ${{ matrix.shard.name }} (parallel with xdist)
        run: |
          IGNORE_ARGS=""
          if [ "${{ matrix.shard.index }}" = "4" ]; then
            # "remaining" shard: run tests/ but ignore directories covered by shards 1-3
            IGNORE_ARGS="--ignore=tests/handlers --ignore=tests/server --ignore=tests/debate --ignore=tests/agents --ignore=tests/knowledge --ignore=tests/memory --ignore=tests/resilience --ignore=tests/workflow --ignore=tests/rlm --ignore=tests/reasoning --ignore=tests/client --ignore=tests/connectors"
          fi
          pytest ${{ matrix.shard.path }} \
            -m "not slow and not load and not e2e and not benchmark and not integration and not integration_minimal and not performance" \
            --timeout=120 \
            --cov=aragora \
            --cov-report=xml:coverage-${{ matrix.shard.name }}.xml \
            -n auto \
            --dist loadscope \
            -v \
            --tb=short \
            $IGNORE_ARGS
        shell: bash
        env:
          PYTHONPATH: .:aragora-debate/src

      - name: Upload shard coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}-${{ matrix.shard.name }}
          path: coverage-${{ matrix.shard.name }}.xml
          retention-days: 14

  # Summary job: merge coverage from shards and enforce gates
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test]
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (always())

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify checkout integrity
        shell: bash
        run: |
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::pyproject.toml missing after checkout; attempting recovery"
            git sparse-checkout disable || true
            git fetch --no-tags origin "${GITHUB_SHA:-HEAD}"
            git reset --hard FETCH_HEAD
            git clean -ffd || true
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::Standard recovery failed; attempting archive restore"
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            git archive "${GITHUB_SHA:-HEAD}" | tar -x || git archive HEAD | tar -x
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::error::Repository checkout is incomplete (pyproject.toml missing)"
            echo "PWD=$(pwd)"
            ls -la
            exit 1
          fi

      - name: Check shard results
        run: |
          # Fail only when shards actually failed. "skipped"/"cancelled" can
          # occur for filtered/superseded/prioritized runs and should not
          # hard-fail summary coverage.
          case "${{ needs.test.result }}" in
            success)
              echo "All test shards passed."
              ;;
            skipped)
              echo "::warning::Test shards were skipped; continuing summary without failing."
              ;;
            cancelled)
              echo "::warning::Test shards were cancelled; continuing summary without failing."
              ;;
            *)
              echo "::error::One or more test shards failed (result: ${{ needs.test.result }})"
              exit 1
              ;;
          esac

      - name: Set up Python
        uses: ./.github/actions/setup-python-safe
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install coverage tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install coverage

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-ubuntu-latest-py3.10-*
          path: coverage-reports/
          merge-multiple: true

      - name: Merge coverage and enforce threshold
        run: |
          # Combine coverage XML reports from all 4 shards (Ubuntu 3.10 as reference)
          python -c "
          import xml.etree.ElementTree as ET
          import os, sys, glob

          reports = glob.glob('coverage-reports/coverage-*.xml')
          if not reports:
              print('::warning::No coverage reports found to merge. Skipping coverage gate.')
              sys.exit(0)

          print(f'Found {len(reports)} shard coverage reports')
          for r in sorted(reports):
              print(f'  - {r}')

          # Parse first report as base
          base_tree = ET.parse(reports[0])
          base_root = base_tree.getroot()
          base_packages = base_root.find('.//packages')

          # Merge remaining reports
          existing_pkg_names = {p.get('name') for p in base_packages.findall('package')}
          for report_path in reports[1:]:
              tree = ET.parse(report_path)
              root = tree.getroot()
              for package in root.findall('.//packages/package'):
                  pkg_name = package.get('name')
                  if pkg_name not in existing_pkg_names:
                      base_packages.append(package)
                      existing_pkg_names.add(pkg_name)

          # Write merged report
          base_tree.write('coverage.xml', xml_declaration=True)
          print('Merged coverage written to coverage.xml')

          # Check overall coverage
          total_lines = 0
          covered_lines = 0
          for package in base_root.findall('.//packages/package'):
              line_rate = float(package.get('line-rate', 0))
              # Count lines from classes
              for cls in package.findall('.//class'):
                  lines = cls.findall('.//line')
                  total_lines += len(lines)
                  covered_lines += sum(1 for l in lines if int(l.get('hits', 0)) > 0)

          if total_lines > 0:
              overall = (covered_lines / total_lines) * 100
              print(f'Overall coverage: {overall:.1f}% ({covered_lines}/{total_lines} lines)')
              if overall < 70:
                  print(f'::error::Coverage {overall:.1f}% is below 70% threshold')
                  sys.exit(1)
          else:
              print('::warning::No line data found in coverage reports')
          "

      - name: Check critical path coverage
        run: |
          # Verify critical modules meet higher coverage threshold
          echo "Checking critical module coverage..."
          python -c "
          import xml.etree.ElementTree as ET
          import sys, os

          if not os.path.exists('coverage.xml'):
              print('::warning::No merged coverage.xml found. Skipping critical path check.')
              sys.exit(0)

          tree = ET.parse('coverage.xml')
          root = tree.getroot()

          CRITICAL_MODULES = {
              'aragora/server': 65,
              'aragora/debate': 60,
              'aragora/memory': 60,
              'aragora/knowledge/mound': 65,
              'aragora/rbac': 70,
              'aragora/auth': 70,
              'aragora/agents': 55,
          }

          failures = []
          for package in root.findall('.//package'):
              name = package.get('name', '')
              for module, threshold in CRITICAL_MODULES.items():
                  if module in name:
                      line_rate = float(package.get('line-rate', 0)) * 100
                      if line_rate < threshold:
                          failures.append(f'{name}: {line_rate:.1f}% < {threshold}%')
                      else:
                          print(f'OK {name}: {line_rate:.1f}% >= {threshold}%')
                      break

          if failures:
              print()
              print('Critical module coverage below threshold:')
              for f in failures:
                  print(f'  - {f}')
              sys.exit(1)
          "

      - name: Upload merged coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true
          flags: unittests
          name: aragora-coverage
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Coverage Summary Comment
        if: github.event_name == 'pull_request'
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINIMUM_GREEN: 70
          MINIMUM_ORANGE: 55
        # Non-blocking: PR coverage comment is cosmetic and depends on third-party action
        continue-on-error: true

