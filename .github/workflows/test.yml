      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          bash scripts/ci_install_project.sh

      - name: Smoke - demo ask
        run: |
          python -m aragora ask "Smoke test a demo debate" --demo --rounds 1

      - name: Smoke - demo gauntlet
        run: |
          cat > /tmp/aragora_demo_spec.md <<'EOF'
          # Demo Spec
          Build a simple HTTP service that returns "ok" to GET /health.
          EOF
          if ! python -m aragora gauntlet /tmp/aragora_demo_spec.md \
            --input-type spec \
            --agents demo,demo \
            --profile quick \
            --no-probing \
            --no-audit \
            --timeout 30 \
            --output /tmp/aragora_gauntlet_demo.json; then
            echo "Gauntlet exited non-zero (possible needs-review/reject verdict)."
          fi
          test -s /tmp/aragora_gauntlet_demo.json

      - name: Smoke - seed demo data
        run: |
          python scripts/seed_demo.py
          python scripts/seed_demo.py --check

      - name: Smoke - boot server
        run: |
          set -e
          python -m aragora serve --demo --api-port 8090 --ws-port 8765 --host 127.0.0.1 >/tmp/aragora-server.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          # Wait for server to be ready (handler init can take ~30s in CI)
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8090/healthz >/dev/null 2>&1; then
              echo "Server is healthy after ${i}s."
              break
            fi
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:8090/healthz >/dev/null; then
            if [[ -f /tmp/aragora-server.log ]]; then
              cat /tmp/aragora-server.log
            else
              echo "aragora server log was not created"
            fi
            exit 1
          fi
          # Verify key API endpoints return data
          echo "Checking /api/v1/health..."
          curl -fsS http://127.0.0.1:8090/api/v1/health | python -c "import sys,json; d=json.load(sys.stdin); assert d.get('status') in {'ok','healthy'}, f'bad health: {d}'"
          echo "Checking leaderboard..."
          curl -fsS http://127.0.0.1:8090/api/leaderboard-view | python -c "import sys,json; d=json.load(sys.stdin); agents=d.get('agents',d.get('rankings',[])); print(f'Agents: {len(agents) if isinstance(agents, list) else \"n/a\"}'); assert isinstance(agents, list), f'bad leaderboard payload: {d}'"
          echo "All smoke checks passed."

  nightly-slow:
