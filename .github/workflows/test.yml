  frontend:
    needs: [scope]
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name != 'pull_request' || needs.scope.outputs.frontend_e2e == 'true')
    name: Frontend E2E Tests (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Sharded 3-way smoke PR lane to keep wall-clock below the job ceiling.
    # Previously a single unsharded all-project job with timeout-minutes=35
    # regularly hit the ceiling, causing the whole Tests workflow to end
    # 'cancelled' (not 'failure'), which hid the underlying failure and
    # produced dashboard lies. See #6495. Production/specialty suites and the
    # broad Chromium suite remain explicit via dedicated projects/scripts. The
    # shell timeout below is intentionally lower than the job timeout so
    # overruns surface as normal failures and still leave time to upload
    # Playwright artifacts.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify checkout integrity
        shell: bash
        run: |
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::pyproject.toml missing after checkout; attempting recovery"
            git sparse-checkout disable || true
            git fetch --no-tags origin "${GITHUB_SHA:-HEAD}"
            git reset --hard FETCH_HEAD
            git clean -ffd || true
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::Standard recovery failed; attempting archive restore"
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            git archive "${GITHUB_SHA:-HEAD}" | tar -x || git archive HEAD | tar -x
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::error::Repository checkout is incomplete (pyproject.toml missing)"
            echo "PWD=$(pwd)"
            ls -la
            exit 1
          fi

      - name: Set up Python
        uses: ./.github/actions/setup-python-safe
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          bash scripts/ci_install_project.sh --extras dev,test

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: 'npm'
          cache-dependency-path: aragora/live/package-lock.json

      - name: Install dependencies
        working-directory: aragora/live
        run: npm ci

      - name: TypeScript Type Check
        working-directory: aragora/live
        run: npx tsc --noEmit

      - name: Run Jest unit tests
        working-directory: aragora/live
        run: npx jest --ci

      - name: Install Playwright browsers
        working-directory: aragora/live
        run: npx playwright install --with-deps

      - name: Start Aragora backend
        run: |
          mkdir -p .nomic

          python -m aragora serve --api-port 8080 --ws-port 8765 --host 127.0.0.1 > /tmp/aragora-server.log 2>&1 &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV

          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
              echo "Backend server is healthy"
              break
            fi
            echo "Waiting for backend... ($i/60)"
            if [ $i -eq 30 ] || [ $i -eq 45 ]; then
              echo "=== Recent server logs ==="
              tail -20 /tmp/aragora-server.log 2>/dev/null || true
              echo "=========================="
            fi
            sleep 2
          done

          if ! curl -fsS http://127.0.0.1:8080/healthz; then
            echo "Server failed to become healthy. Full logs:"
            cat /tmp/aragora-server.log
            exit 1
          fi
        env:
          ARAGORA_REDIS_URL: redis://localhost:6379/0
          ARAGORA_DATA_DIR: .nomic

      - name: Build frontend
        working-directory: aragora/live
        run: npm run build:local
        env:
