            timeout: 15
            parallel_args: ""
          - name: memory
            path: tests/memory
            timeout: 15
            parallel_args: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify checkout integrity
        shell: bash
        run: |
          if [[ ! -f pyproject.toml ]]; then
