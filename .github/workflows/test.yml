      - name: Run epistemic hygiene + settlement gate
        run: bash scripts/run_epistemic_settlement_gate.sh
        env:
          PYTHONPATH: .:aragora-debate/src
          EPISTEMIC_GATE_ARTIFACT_DIR: /tmp/epistemic-gate-artifacts

      - name: Append epistemic compliance summary
        if: always()
        run: |
          if [ -f /tmp/epistemic-gate-artifacts/epistemic-compliance-summary.md ]; then
            echo "## Epistemic Compliance Report" >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/epistemic-gate-artifacts/epistemic-compliance-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Epistemic Compliance Report" >> "$GITHUB_STEP_SUMMARY"
            echo "Artifact not found." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload epistemic gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epistemic-settlement-gate
          path: |
            /tmp/epistemic-gate-artifacts/epistemic-compliance-summary.json
            /tmp/epistemic-gate-artifacts/epistemic-compliance-summary.md
          retention-days: 14

  v1-scope-lock-gate:
    name: V1 Scope Lock Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: baseline-determinism
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name == 'pull_request')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify checkout integrity
        shell: bash
        run: |
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::pyproject.toml missing after checkout; attempting recovery"
            git sparse-checkout disable || true
            git fetch --no-tags origin "${GITHUB_SHA:-HEAD}"
            git reset --hard FETCH_HEAD
            git clean -ffd || true
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::Standard recovery failed; attempting archive restore"
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            git archive "${GITHUB_SHA:-HEAD}" | tar -x || git archive HEAD | tar -x
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::error::Repository checkout is incomplete (pyproject.toml missing)"
            echo "PWD=$(pwd)"
            ls -la
            exit 1
          fi

      - name: Set up Python
        uses: ./.github/actions/setup-python-safe
        with:
          python-version: "3.11"

      - name: Derive V1 scope expansion override
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "${PR_BODY:-}" | grep -q 'ARAGORA_ALLOW_SCOPE_EXPANSION=1'; then
            echo "ARAGORA_ALLOW_SCOPE_EXPANSION=1" >> "$GITHUB_ENV"
          fi

      - name: Enforce V1 scope lock
        run: |
          python scripts/check_v1_scope_lock.py \
            --base "origin/${{ github.base_ref }}" \
            --head "${{ github.sha }}"

  # Integration smoke lane for high-risk paths (PR only)
