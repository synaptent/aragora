  test-analytics:
    name: Test Analytics
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test-fast]
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (always() && github.event_name == 'pull_request')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify checkout integrity
        shell: bash
        run: |
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::pyproject.toml missing after checkout; attempting recovery"
            git sparse-checkout disable || true
            git fetch --no-tags origin "${GITHUB_SHA:-HEAD}"
            git reset --hard FETCH_HEAD
            git clean -ffd || true
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::Standard recovery failed; attempting archive restore"
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            git archive "${GITHUB_SHA:-HEAD}" | tar -x || git archive HEAD | tar -x
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::error::Repository checkout is incomplete (pyproject.toml missing)"
            echo "PWD=$(pwd)"
            ls -la
            exit 1
          fi

      - name: Set up Python
        uses: ./.github/actions/setup-python-safe
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          bash scripts/ci_install_project.sh --extras dev

      - name: Fetch base ref
        run: git fetch --no-tags --depth=200 origin "${{ github.base_ref }}"

      - name: Get changed Python files
        id: changed
        run: |
          if git merge-base "origin/${{ github.base_ref }}" HEAD >/dev/null 2>&1; then
            CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- 'aragora/**/*.py' 'tests/**/*.py' | tr '\n' ' ')
          else
            echo "::warning::No merge base found with origin/${{ github.base_ref }}; continuing with an empty changed-file set"
            CHANGED=""
          fi
          echo "files=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Select relevant tests
        id: selected
        continue-on-error: true
        run: |
          python scripts/nomic_ci_test_selector.py --changed-files ${{ steps.changed.outputs.files }} --dry-run
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path(".nomic-ci-result.json").read_text())
          test_paths = data.get("test_paths", [])
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as fh:
              print(f"count={len(test_paths)}", file=fh)
              print("paths<<EOF", file=fh)
              print("\n".join(test_paths), file=fh)
              print("EOF", file=fh)
          PY

      - name: Run tests with JUnit output
        id: tests
        # Non-blocking: This job is for flakiness analysis (--reruns=2), not a release gate.
        # Gating tests run in test-fast and test jobs above.
        continue-on-error: true
        run: |
          if [ -z "${{ steps.selected.outputs.paths }}" ]; then
            echo "No relevant tests matched changed Python files; skipping Test Analytics run."
          else
            TEST_PATHS_RAW='${{ steps.selected.outputs.paths }}'
            mapfile -t TEST_PATHS <<< "$TEST_PATHS_RAW"
            python -m pytest -o addopts='' "${TEST_PATHS[@]}" \
              -m "not slow and not load and not e2e" \
              --timeout=60 \
              --reruns=2 \
              --junit-xml=test-results.xml \
              -v \
              --tb=short
          fi

      - name: Analyze test results
        id: analyze
        continue-on-error: true
        run: |
          python scripts/analyze_test_results.py \
            --junit test-results.xml \
            --format markdown \
            --output test-summary.md \
            --exit-zero

          # Store summary for PR comment
          SUMMARY_DELIM="SUMMARY_$(python - <<'PY'
          import uuid
          print(uuid.uuid4().hex)
          PY
          )"
          {
            echo "summary<<$SUMMARY_DELIM"
            cat test-summary.md
            printf '\n'
            echo "$SUMMARY_DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Upload test results
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results.xml
            test-summary.md
          retention-days: 14

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          TEST_SUMMARY: ${{ steps.analyze.outputs.summary }}
        with:
          script: |
            const summary = process.env.TEST_SUMMARY || '';

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Test Results Summary')
            );

            const body = summary || '## Test Results Summary\n\nNo test results available.';

            try {
              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: body
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: body
                });
              }
            } catch (error) {
              const status = error?.status ?? 'unknown';
              core.warning(`Skipping PR test summary comment: ${status} ${error.message}`);
            }
