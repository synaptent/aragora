  # Lightweight frontend type checking (PR-only, path-filtered)
  frontend-typecheck:
    name: Frontend TypeScript Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [scope]
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name != 'pull_request' || needs.scope.outputs.frontend == 'true')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify checkout integrity
        shell: bash
        run: |
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::pyproject.toml missing after checkout; attempting recovery"
            git sparse-checkout disable || true
            git fetch --no-tags origin "${GITHUB_SHA:-HEAD}"
            git reset --hard FETCH_HEAD
            git clean -ffd || true
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::Standard recovery failed; attempting archive restore"
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            git archive "${GITHUB_SHA:-HEAD}" | tar -x || git archive HEAD | tar -x
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::error::Repository checkout is incomplete (pyproject.toml missing)"
            echo "PWD=$(pwd)"
            ls -la
            exit 1
          fi

      - name: Check for frontend changes
        uses: ./.github/actions/pr-scope-classifier
        id: scope

      - name: Set up Node.js
        if: steps.scope.outputs.frontend == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: 'npm'
          cache-dependency-path: aragora/live/package-lock.json

      - name: Install dependencies
        if: steps.scope.outputs.frontend == 'true'
        working-directory: aragora/live
        run: npm ci

      - name: TypeScript type check
        if: steps.scope.outputs.frontend == 'true'
        working-directory: aragora/live
        run: npx tsc --noEmit

      - name: Skip (no frontend changes)
        if: steps.scope.outputs.frontend != 'true'
        run: echo "No frontend file changes detected, skipping TypeScript type check."

