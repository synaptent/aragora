name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'aragora/**'
      - 'aragora-debate/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'scripts/capability_gap_report.py'
      - 'scripts/generate_capability_matrix.py'
      - 'scripts/check_capability_matrix_sync.py'
      - 'scripts/check_legacy_entrypoints.py'
      - 'scripts/check_legacy_collab_flags.py'
      - 'scripts/capability_matrix_delta.py'
      - 'scripts/generate_cli_reference.py'
      - 'aragora/capabilities.yaml'
      - 'aragora/capability_surfaces.yaml'
      - 'docs/CAPABILITY_MATRIX.md'
      - 'docs/reference/CLI_REFERENCE.md'
      - 'docs-site/docs/contributing/capability-matrix.md'
      - 'docs-site/docs/api/cli.md'
      - '.github/workflows/test.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}${{ startsWith(github.ref, 'refs/heads/dev/') && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

jobs:
  # ============================================================
  # Test Tier Architecture (#180)
  # ============================================================
  # PR tier (test-fast):       <5 min target, parallel by category
  #   Markers excluded: slow, load, e2e, integration, benchmark, performance
  # Compat matrix (test):      Full OS/Python matrix, coverage gates
  # Nightly tier (nightly-slow): slow + load + e2e tests, 600s timeout
  # Benchmarks:                Dedicated workflow in benchmark.yml
  #   (pytest-benchmark with regression detection + baseline comparison)
  # ============================================================

  # Version alignment check (fast, runs first)
  version-check:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Version Alignment
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify checkout integrity
        shell: bash
        run: |
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::pyproject.toml missing after checkout; attempting recovery"
            git sparse-checkout disable || true
            git fetch --no-tags origin "${GITHUB_SHA:-HEAD}"
            git reset --hard FETCH_HEAD
            git clean -ffd || true
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::Standard recovery failed; attempting archive restore"
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            git archive "${GITHUB_SHA:-HEAD}" | tar -x || git archive HEAD | tar -x
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::error::Repository checkout is incomplete (pyproject.toml missing)"
            echo "PWD=$(pwd)"
            ls -la
            exit 1
          fi

      - name: Set up Python
        uses: ./.github/actions/setup-python-safe
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Detect PR scope
        if: github.event_name == 'pull_request'
        id: pr_scope
        uses: ./.github/actions/pr-scope-classifier

      - name: Decide OpenAPI alignment scope
        id: openapi_scope
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "run_openapi=${{ steps.pr_scope.outputs.openapi }}" >> "$GITHUB_OUTPUT"
          else
            echo "run_openapi=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install OpenAPI generation dependencies
        run: |
          python -m pip install --upgrade pip
          bash scripts/ci_install_project.sh --extras dev

      - name: Check version alignment
        run: python scripts/check_version_alignment.py
      - name: Repo hygiene guard
        run: python scripts/guard_repo_clean.py --check-working-tree

      - name: Check OpenAPI spec is up to date
        if: steps.openapi_scope.outputs.run_openapi == 'true'
        run: |
          TMPDIR=$(mktemp -d)
          python scripts/generate_openapi.py --output "$TMPDIR/openapi_generated.json"
          python scripts/generate_openapi.py --output "$TMPDIR/openapi_generated.yaml" --format yaml
          python scripts/add_openapi_operation_ids.py --spec "$TMPDIR/openapi_generated.json"
          python scripts/add_openapi_param_descriptions.py --spec "$TMPDIR/openapi_generated.json"
          python scripts/add_openapi_descriptions.py --spec "$TMPDIR/openapi_generated.json"
          diff -u "$TMPDIR/openapi_generated.json" docs/api/openapi_generated.json
          diff -u "$TMPDIR/openapi_generated.yaml" docs/api/openapi_generated.yaml

      - name: Check TypeScript SDK types are up to date
        if: steps.openapi_scope.outputs.run_openapi == 'true'
        run: |
          TMP_OPENAPI=$(mktemp)
          cp docs/api/openapi_generated.json "$TMP_OPENAPI"
          python scripts/add_openapi_operation_ids.py --spec "$TMP_OPENAPI"
          python scripts/generate_sdk_types.py --openapi "$TMP_OPENAPI" --check

      - name: Check Python SDK types are up to date
        if: steps.openapi_scope.outputs.run_openapi == 'true'
        run: |
          TMP_OPENAPI=$(mktemp)
          cp docs/api/openapi_generated.json "$TMP_OPENAPI"
          python scripts/add_openapi_operation_ids.py --spec "$TMP_OPENAPI"
          python scripts/generate_python_sdk_types.py --openapi "$TMP_OPENAPI" --check

      - name: Check capability matrix is up to date
        run: python scripts/check_capability_matrix_sync.py

      - name: Check command guidance drift
        run: python scripts/check_legacy_entrypoints.py

      - name: Check legacy Codex collab flag drift
        run: python scripts/check_legacy_collab_flags.py

      - name: Check CLI reference is up to date
        run: python scripts/generate_cli_reference.py --check

      - name: Check epistemic compliance regression baseline
        run: |
          python scripts/check_epistemic_compliance_regression.py --strict \
            --json-out /tmp/epistemic-compliance-summary.json \
            --md-out /tmp/epistemic-compliance-summary.md

      - name: Upload epistemic compliance summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epistemic-compliance-summary
          path: |
            /tmp/epistemic-compliance-summary.json
            /tmp/epistemic-compliance-summary.md
          retention-days: 14

      - name: Fetch PR base branch for capability summary
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"

      - name: Generate capability matrix summary artifact
        if: github.event_name == 'pull_request'
        run: |
          python scripts/capability_matrix_delta.py \
            --base-ref "origin/${{ github.base_ref }}" \
            --out /tmp/capability-matrix-summary.md

      - name: Upload capability matrix summary artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: capability-matrix-summary
          path: /tmp/capability-matrix-summary.md
          retention-days: 14

  scope:
    name: PR Scope
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.scope_override.outputs.frontend || steps.scope_defaults.outputs.frontend }}
      frontend_e2e: ${{ steps.scope_override.outputs.frontend_e2e || steps.scope_defaults.outputs.frontend_e2e }}

    steps:
      - name: Default scope (non-PR)
        id: scope_defaults
        run: |
          echo "frontend=true" >> "$GITHUB_OUTPUT"
          echo "frontend_e2e=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4

      - name: Detect PR scope
        if: github.event_name == 'pull_request'
        id: scope
        uses: ./.github/actions/pr-scope-classifier

      - name: Set scope outputs (PR)
        if: github.event_name == 'pull_request'
        id: scope_override
        run: |
          echo "frontend=${{ steps.scope.outputs.frontend }}" >> "$GITHUB_OUTPUT"
          echo "frontend_e2e=${{ steps.scope.outputs.frontend_e2e }}" >> "$GITHUB_OUTPUT"

  sdk-typescript-compile-gate:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: SDK TypeScript Compile Gate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: version-check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify checkout integrity
        shell: bash
        run: |
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::pyproject.toml missing after checkout; attempting recovery"
            git sparse-checkout disable || true
            git fetch --no-tags origin "${GITHUB_SHA:-HEAD}"
            git reset --hard FETCH_HEAD
            git clean -ffd || true
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::Standard recovery failed; attempting archive restore"
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            git archive "${GITHUB_SHA:-HEAD}" | tar -x || git archive HEAD | tar -x
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::error::Repository checkout is incomplete (pyproject.toml missing)"
            echo "PWD=$(pwd)"
            ls -la
            exit 1
          fi

      - name: Set up Python
        uses: ./.github/actions/setup-python-safe
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          bash scripts/ci_install_project.sh --extras dev

      - name: Install TypeScript SDK dependencies
        working-directory: sdk/typescript
        run: npm ci

      - name: Run SDK TypeScript compile gate test
        env:
          PYTHONPATH: sdk/python:.
        run: |
          pytest -q tests/sdk/test_typescript_exports.py::TestTypeScriptCompilation::test_sdk_compiles_cleanly

  baseline-determinism:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Baseline Determinism
    runs-on: ubuntu-latest
    timeout-minutes: 18
    needs: version-check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify checkout integrity
        shell: bash
        run: |
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::pyproject.toml missing after checkout; attempting recovery"
            git sparse-checkout disable || true
            git fetch --no-tags origin "${GITHUB_SHA:-HEAD}"
            git reset --hard FETCH_HEAD
            git clean -ffd || true
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::Standard recovery failed; attempting archive restore"
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            git archive "${GITHUB_SHA:-HEAD}" | tar -x || git archive HEAD | tar -x
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::error::Repository checkout is incomplete (pyproject.toml missing)"
            echo "PWD=$(pwd)"
            ls -la
            exit 1
          fi

      - name: Set up Python
        uses: ./.github/actions/setup-python-safe
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install baseline test dependencies
        run: |
          python -m pip install --upgrade pip
          bash scripts/ci_install_project.sh --extras test,monitoring,observability

      - name: Verify deterministic baseline command
        run: python scripts/run_test_baseline.py

  # Skip marker audit (warns if skip count increases)
  skip-audit:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Skip Marker Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify checkout integrity
        shell: bash
        run: |
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::pyproject.toml missing after checkout; attempting recovery"
            git sparse-checkout disable || true
            git fetch --no-tags origin "${GITHUB_SHA:-HEAD}"
            git reset --hard FETCH_HEAD
            git clean -ffd || true
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::Standard recovery failed; attempting archive restore"
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            git archive "${GITHUB_SHA:-HEAD}" | tar -x || git archive HEAD | tar -x
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::error::Repository checkout is incomplete (pyproject.toml missing)"
            echo "PWD=$(pwd)"
            ls -la
            exit 1
          fi

      - name: Set up Python
        uses: ./.github/actions/setup-python-safe
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Run skip audit
        run: |
          CURRENT=$(python scripts/audit_test_skips.py --count-only)
          BASELINE=$(cat tests/.skip_baseline 2>/dev/null || echo 600)
          THRESHOLD=2  # Fail if skips increase by more than this (tightened Feb 2026)
          echo "Current skip count: $CURRENT"
          echo "Baseline: $BASELINE"
          echo "Threshold: $THRESHOLD"

          DIFF=$((CURRENT - BASELINE))
          if [ "$DIFF" -gt "$THRESHOLD" ]; then
            echo "::error::Skip count increased by $DIFF (from $BASELINE to $CURRENT)"
            echo "::error::This exceeds the threshold of $THRESHOLD additional skips"
            echo "Run 'python scripts/audit_test_skips.py' locally to see details"
            exit 1
          elif [ "$DIFF" -gt 0 ]; then
            echo "::warning::Skip count increased slightly: $CURRENT > $BASELINE baseline (+$DIFF)"
            echo "Consider updating tests/.skip_baseline if these skips are intentional"
          elif [ "$DIFF" -lt 0 ]; then
            echo "::notice::Skip count decreased by $((-DIFF))! Consider updating baseline."
          fi
          # Store for potential artifact
          echo "$CURRENT" > skip_count.txt

      - name: Upload skip audit
        uses: actions/upload-artifact@v4
        with:
          name: skip-audit
          path: skip_count.txt
          retention-days: 7

  # Status document reconciliation (detect drift across capability/GA/roadmap docs)
  status-reconciliation:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Status Doc Reconciliation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify checkout integrity
        shell: bash
        run: |
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::pyproject.toml missing after checkout; attempting recovery"
            git sparse-checkout disable || true
            git fetch --no-tags origin "${GITHUB_SHA:-HEAD}"
            git reset --hard FETCH_HEAD
            git clean -ffd || true
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::Standard recovery failed; attempting archive restore"
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            git archive "${GITHUB_SHA:-HEAD}" | tar -x || git archive HEAD | tar -x
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::error::Repository checkout is incomplete (pyproject.toml missing)"
            echo "PWD=$(pwd)"
            ls -la
            exit 1
          fi

      - name: Set up Python
        uses: ./.github/actions/setup-python-safe
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          bash scripts/ci_install_project.sh

      - name: Run status reconciliation
        run: |
          python scripts/reconcile_status_docs.py --strict --output reconciliation_report.md
        env:
          PYTHONPATH: .:aragora-debate/src

      - name: Upload reconciliation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: status-reconciliation
          path: reconciliation_report.md
          retention-days: 14

  # Zero-coverage baseline check (prevents new zero-coverage files)
  zero-coverage-check:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Zero Coverage Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: baseline-determinism

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify checkout integrity
        shell: bash
        run: |
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::pyproject.toml missing after checkout; attempting recovery"
            git sparse-checkout disable || true
            git fetch --no-tags origin "${GITHUB_SHA:-HEAD}"
            git reset --hard FETCH_HEAD
            git clean -ffd || true
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::Standard recovery failed; attempting archive restore"
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            git archive "${GITHUB_SHA:-HEAD}" | tar -x || git archive HEAD | tar -x
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::error::Repository checkout is incomplete (pyproject.toml missing)"
            echo "PWD=$(pwd)"
            ls -la
            exit 1
          fi

      - name: Set up Python
        uses: ./.github/actions/setup-python-safe
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          bash scripts/ci_install_project.sh --extras test

      - name: Fetch base ref
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"

      - name: Get changed Python files
        if: github.event_name == 'pull_request'
        id: changed
        run: |
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- 'aragora/**/*.py' 'tests/**/*.py' | tr '\n' ' ')
          echo "files=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Select relevant tests
        if: github.event_name == 'pull_request'
        id: selected
        run: |
          python scripts/nomic_ci_test_selector.py --changed-files ${{ steps.changed.outputs.files }} --dry-run
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path(".nomic-ci-result.json").read_text())
          test_paths = data.get("test_paths", [])
          status = data.get("status", "")
          changed_python_files = data.get("changed_python_files", [])
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as fh:
              print(f"status={status}", file=fh)
              print(f"changed_python_count={len(changed_python_files)}", file=fh)
              print(f"count={len(test_paths)}", file=fh)
              print("paths<<EOF", file=fh)
              print("\n".join(test_paths), file=fh)
              print("EOF", file=fh)
          PY

      - name: Check for new zero-coverage files
        env:
          SELECTOR_STATUS: ${{ steps.selected.outputs.status }}
          CHANGED_PYTHON_COUNT: ${{ steps.selected.outputs.changed_python_count || 0 }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ steps.selected.outputs.status }}" = "skipped" ]; then
              echo "No changed Python files required PR-scoped zero-coverage probing; skipping."
            elif [ -z "${{ steps.selected.outputs.paths }}" ]; then
              echo "::error::PR-scoped coverage selector returned no tests for changed Python files"
              exit 1
            else
              TEST_PATHS_RAW='${{ steps.selected.outputs.paths }}'
              mapfile -t TEST_PATHS <<< "$TEST_PATHS_RAW"
              python -m pytest "${TEST_PATHS[@]}" -q --cov=aragora --cov-report=json:cov.json \
                -m "not slow and not load and not e2e" --timeout=60 -x || true
            fi
          else
            python -m pytest tests/debate tests/server -q --cov=aragora --cov-report=json:cov.json \
              -m "not slow and not load and not e2e" --timeout=60 -x || true
          fi

          python scripts/check_zero_coverage_gate.py \
            --coverage-path cov.json \
            --baseline-path tests/.zero_coverage_baseline \
            --selector-status "${SELECTOR_STATUS}" \
            --changed-python-count "${CHANGED_PYTHON_COUNT}"

  # ==========================================================================
  # test-shard-scope (NEW): classify which test-fast shards must run for this
  # change. Heavy shards (debate, server-handlers, handlers) skip when no
  # relevant code/test paths changed; their job still reports success so the
  # `needs: test-fast` downstream gates remain satisfied.
  #
  # Triggered always on push/schedule; scope-filtered only on pull_request.
  # The `core` filter, when matched, forces ALL shards to run (covers
  # workflow/script/dependency/version edits that touch the whole repo).
  # ==========================================================================
  test-shard-scope:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Classify test-fast Shard Scope
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      scopes_changed: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect scopes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            core:
              - 'pyproject.toml'
              - 'requirements*.txt'
              - 'scripts/ci_install_project.sh'
              - '.github/workflows/test.yml'
              - '.github/actions/setup-python-safe/**'
              - 'aragora/__init__.py'
              - 'aragora/__version__.py'
              - 'aragora/_version.py'
              - 'aragora/core.py'
              - 'aragora/config/**'
              - 'aragora/protocols/**'
              - 'tests/conftest.py'
              - 'conftest.py'
            agents:
              - 'aragora/agents/**'
              - 'tests/agents/**'
            debate:
              - 'aragora/debate/**'
              - 'tests/debate/**'
              - 'aragora/agents/**'
              - 'aragora/memory/**'
              - 'aragora/reasoning/**'
            reasoning:
              - 'aragora/rlm/**'
              - 'aragora/reasoning/**'
              - 'tests/rlm/**'
              - 'tests/reasoning/**'
            workflow_client:
              - 'aragora/workflow/**'
              - 'aragora/client/**'
              - 'tests/workflow/**'
              - 'tests/client/**'
            server_handlers:
              - 'aragora/server/handlers/**'
              - 'tests/server/handlers/**'
              - 'aragora/server/handler_registry/**'
              - 'aragora/server/openapi/**'
              - 'aragora/server/openapi_impl.py'
            server_rest:
              - 'aragora/server/**'
              - 'tests/server/**'
            handlers:
              - 'aragora/server/handlers/**'
              - 'tests/handlers/**'
              - 'aragora/control_plane/**'
            knowledge:
              - 'aragora/knowledge/**'
              - 'aragora/memory/**'
              - 'aragora/evidence/**'
              - 'tests/knowledge/**'
              - 'tests/evidence/**'
              - 'tests/memory/**'
            storage:
              - 'aragora/storage/**'
              - 'aragora/persistence/**'
              - 'aragora/billing/**'
              - 'aragora/ranking/**'
              - 'tests/storage/**'
              - 'tests/persistence/**'
              - 'tests/billing/**'
              - 'tests/ranking/**'
            infra:
              - 'aragora/nomic/**'
              - 'aragora/control_plane/**'
              - 'aragora/rbac/**'
              - 'aragora/events/**'
              - 'aragora/observability/**'
              - 'aragora/compliance/**'
              - 'aragora/gauntlet/**'
              - 'aragora/cli/**'
              - 'tests/nomic/**'
              - 'tests/control_plane/**'
              - 'tests/rbac/**'
              - 'tests/events/**'
              - 'tests/observability/**'
              - 'tests/compliance/**'
              - 'tests/gauntlet/**'
              - 'tests/cli/**'

      - name: Report scopes
        run: |
          echo "Scopes changed: ${{ steps.filter.outputs.changes }}"

  # ==========================================================================
  # Fast parallel tests by category (Ubuntu only, primary Python)
  #
  # Sub-sharding history:
  #   2026-04-25: Heavy shards split to fit within 30-min runner cap.
  #     - debate (1 shard, 30+ min) -> debate-am, debate-nz, debate-phases
  #   2026-07-15: debate-am re-saturated (28-30+ min, cancelled on main sched
  #     run 29390230325 and PR #9245 run 29293412959 despite the #9280
  #     rebalance). Re-split into 4 balanced shards: debate-phases + debate-1/2/3
  #     (~11.5 min pytest each). Boundaries in scripts/ci_resolve_test_shard.py.
  #     - server (1 shard, 23 min)  -> server-handlers-am, server-handlers-nz, server-rest
  #     - handlers (1 shard, 26 min) -> handlers-features, handlers-amk-no-features, handlers-lz
  #   Path-filter (test-shard-scope) added: PRs touching only docs/CI/integration
  #     tests skip irrelevant heavy shards entirely.
  # ==========================================================================
  test-fast:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.category.timeout }}
    needs: [baseline-determinism, test-shard-scope]
    strategy:
      fail-fast: false
      matrix:
        category:
          # Light shards (unchanged from prior 9-shard layout)
          - name: agents
            pytest_args: tests/agents
            scope: agents
            timeout: 30
          - name: reasoning
            pytest_args: tests/rlm tests/reasoning
            scope: reasoning
            timeout: 30
          - name: workflow-client
            pytest_args: tests/workflow tests/client
            scope: workflow_client
            timeout: 30
          - name: knowledge
            pytest_args: tests/knowledge tests/evidence tests/memory
            scope: knowledge
            timeout: 30
          - name: storage
            pytest_args: tests/storage tests/ranking tests/persistence tests/billing
            scope: storage
            timeout: 30
          - name: infra
            pytest_args: tests/nomic tests/control_plane tests/rbac tests/events tests/observability tests/compliance tests/gauntlet tests/cli
            scope: infra
            timeout: 30

          # debate: 4 balanced sub-shards (~11.5 min pytest each, measured
          # 2026-07-15). debate-phases = tests/debate/ subdirs + first range
          # of top-level files; debate-1/2/3 = remaining contiguous ranges.
          # Boundaries live in scripts/ci_resolve_test_shard.py.
          - name: debate-phases
            pytest_args: ""
            resolver: debate-phases
            scope: debate
            timeout: 30
          - name: debate-1
            pytest_args: ""
            resolver: debate-1
            scope: debate
            timeout: 30
          - name: debate-2
            pytest_args: ""
            resolver: debate-2
            scope: debate
            timeout: 30
          - name: debate-3
            pytest_args: ""
            resolver: debate-3
            scope: debate
            timeout: 30

          # server (was 1 shard at 23 min, now 3 sub-shards)
          # tests/server/handlers/ a-m subdirs + files (~16K tests)
          - name: server-handlers-am
            pytest_args: ""
            resolver: server-handlers-am
            scope: server_handlers
            timeout: 30
          # tests/server/handlers/ n-z subdirs + files (~8K tests)
          - name: server-handlers-nz
            pytest_args: ""
            resolver: server-handlers-nz
            scope: server_handlers
            timeout: 30
          # tests/server/ minus tests/server/handlers/ (~7500 tests)
          - name: server-rest
            pytest_args: ""
            resolver: server-rest
            scope: server_rest
            timeout: 30

          # handlers (was 1 shard at 26 min, now 3 sub-shards)
          # tests/handlers/features/ alone (~7700 tests, biggest single subdir)
          - name: handlers-features
            pytest_args: ""
            resolver: handlers-features
            scope: handlers
            timeout: 30
          # tests/handlers/ A-K subdirs (incl. underscore-prefixed) + A-K files,
          # excluding ``features``. Mutually-exclusive with handlers-lz.
          - name: handlers-amk-no-features
            pytest_args: ""
            resolver: handlers-amk-no-features
            scope: handlers
            timeout: 30
          # tests/handlers/ L-Z subdirs + L-Z files. Mutually-exclusive with
          # handlers-amk-no-features. See scripts/ci_resolve_test_shard.py.
          - name: handlers-lz
            pytest_args: ""
            resolver: handlers-lz
            scope: handlers
            timeout: 30

    steps:
      - name: Resolve shard relevance
        id: relevance
        shell: bash
        env:
          SCOPES: ${{ needs.test-shard-scope.outputs.scopes_changed }}
          MY_SCOPE: ${{ matrix.category.scope }}
          EVENT: ${{ github.event_name }}
        run: |
          # Always run on push/schedule/dispatch (non-PR)
          if [[ "$EVENT" != "pull_request" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Reason: not a pull_request"
            exit 0
          fi
          # If 'core' (workflow/dependency/version) changed, all shards run
          if echo "$SCOPES" | grep -q '"core"'; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Reason: core scope matched (deps/workflow/version)"
            exit 0
          fi
          # If our scope matched, run
          if echo "$SCOPES" | grep -q "\"$MY_SCOPE\""; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Reason: scope '$MY_SCOPE' matched"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Shard ${{ matrix.category.name }} skipped (scope '$MY_SCOPE' not in changes: $SCOPES)"
          fi

      - name: Checkout
        if: steps.relevance.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Verify checkout integrity
        if: steps.relevance.outputs.should_run == 'true'
        shell: bash
        run: |
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::pyproject.toml missing after checkout; attempting recovery"
            git sparse-checkout disable || true
            git fetch --no-tags origin "${GITHUB_SHA:-HEAD}"
            git reset --hard FETCH_HEAD
            git clean -ffd || true
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::Standard recovery failed; attempting archive restore"
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            git archive "${GITHUB_SHA:-HEAD}" | tar -x || git archive HEAD | tar -x
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::error::Repository checkout is incomplete (pyproject.toml missing)"
            echo "PWD=$(pwd)"
            ls -la
            exit 1
          fi

      - name: Set up Python
        if: steps.relevance.outputs.should_run == 'true'
        uses: ./.github/actions/setup-python-safe
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        if: steps.relevance.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          bash scripts/ci_install_project.sh --extras test
          python -m pip install pytest-timeout pytest-xdist

      - name: Resolve shard test paths
        id: shard_paths
        if: steps.relevance.outputs.should_run == 'true'
        shell: bash
        env:
          RESOLVER: ${{ matrix.category.resolver }}
          INLINE_ARGS: ${{ matrix.category.pytest_args }}
        run: |
          # Light shards encode their paths inline via pytest_args. Heavy
          # shards delegate to scripts/ci_resolve_test_shard.py so the
          # alphabetic partitioning lives in versioned Python rather than
          # 5KB of fragile YAML --ignore-glob soup. See script header for
          # rationale.
          if [[ -n "$RESOLVER" ]]; then
            args=$(python3 scripts/ci_resolve_test_shard.py "$RESOLVER" --check)
          else
            args="$INLINE_ARGS"
          fi
          echo "args=$args" >> "$GITHUB_OUTPUT"
          echo "Resolved pytest args: $args"

      - name: Run ${{ matrix.category.name }} tests
        if: steps.relevance.outputs.should_run == 'true'
        run: |
          pytest ${{ steps.shard_paths.outputs.args }} \
            -m "not slow and not load and not e2e and not integration and not integration_minimal and not benchmark and not performance" \
            --timeout=120 \
            -n auto \
            --dist loadscope \
            -v \
            --tb=short \
            --durations=20 \
            --durations-min=1.0
        env:
          PYTHONPATH: .:aragora-debate/src

      - name: Mark shard as skipped (no-op success)
        if: steps.relevance.outputs.should_run != 'true'
        run: |
          echo "::notice::Shard ${{ matrix.category.name }} skipped: scope '${{ matrix.category.scope }}' not in changed scopes"

  epistemic-settlement-gate:
