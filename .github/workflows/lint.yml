  frontend-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'pull_request'

    defaults:
      run:
        working-directory: aragora/live

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify checkout integrity
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          if [[ ! -f pyproject.toml ]] || [[ ! -f aragora/live/package.json ]]; then
            echo "::warning::Frontend checkout incomplete after checkout; attempting recovery"
            git reset --hard || true
            git clean -ffdx || true
            git sparse-checkout disable || true
            git fetch --no-tags origin "${GITHUB_SHA:-HEAD}" || true
            git checkout -f "${GITHUB_SHA:-HEAD}" || true
            if git rev-parse --verify FETCH_HEAD >/dev/null 2>&1; then
              git reset --hard FETCH_HEAD
            else
              git reset --hard HEAD
            fi
            git clean -ffdx || true
          fi
          if [[ ! -f pyproject.toml ]] || [[ ! -f aragora/live/package.json ]]; then
            echo "::warning::Sparse-checkout recovery incomplete; attempting archive restore"
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            if ! git archive "${GITHUB_SHA:-HEAD}" | tar -x; then
              git archive HEAD | tar -x
            fi
          fi
          if [[ ! -f pyproject.toml ]] || [[ ! -f aragora/live/package.json ]]; then
            echo "::error::Repository checkout is incomplete (missing pyproject.toml or aragora/live/package.json)"
            echo "PWD=$(pwd)"
            ls -la
            ls -la aragora/live || true
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: "npm"
          cache-dependency-path: aragora/live/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
        # Phase 12: ESLint now blocking (was continue-on-error: true)

      - name: Check API types are in sync
        continue-on-error: true  # Types are generated from spec; drift is expected during rapid development
        run: npm run check:types

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify checkout integrity
        shell: bash
        run: |
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::pyproject.toml missing after checkout; attempting recovery"
            git reset --hard || true
            git clean -ffdx || true
            git sparse-checkout disable || true
            git fetch --no-tags origin "${GITHUB_SHA:-HEAD}" || true
            git checkout -f "${GITHUB_SHA:-HEAD}" || true
            if git rev-parse --verify FETCH_HEAD >/dev/null 2>&1; then
              git reset --hard FETCH_HEAD
            else
              git reset --hard HEAD
            fi
            git clean -ffdx || true
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::Sparse-checkout recovery incomplete; attempting archive restore"
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            if ! git archive "${GITHUB_SHA:-HEAD}" | tar -x; then
              git archive HEAD | tar -x
            fi
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::error::Repository checkout is incomplete (pyproject.toml missing)"
            echo "PWD=$(pwd)"
            ls -la
            exit 1
          fi

      - name: Set up Python
        uses: ./.github/actions/setup-python-safe
        with:
          python-version: "3.11"

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          # safety runs pinned in its own venv in the dependency-check step below;
          # only bandit is needed in this base env.
          python -m pip install bandit

      - name: Run Bandit security scan
        run: |
          # Generate JSON report for artifacts
          bandit -r aragora/ -ll -ii --format json --output bandit-report.json || true
          # Fail on HIGH severity only (-lll = high, -ll = medium, -l = low)
          bandit -r aragora/ -lll -ii

      - name: Check dependencies for vulnerabilities
        run: |
          python -m pip install -e .
          # Capture the project's resolved deps (drop the editable self-install)
          # so safety scans them without sharing the project's environment.
          python -m pip freeze --exclude-editable > /tmp/aragora-deps.txt
          # Run safety in an ISOLATED venv: aragora requires typer>=0.26.7 while
          # safety pins typer<0.26.0, so installing the project into safety's env
          # breaks the safety CLI. Isolating safety satisfies both pins.
          python -m venv /tmp/safety-env
          /tmp/safety-env/bin/python -m pip install --upgrade pip
          # Pin Safety so this REQUIRED gate is reproducible (a future Safety
          # release could change/remove `check` or require an API key); no
          # --quiet so the installed version is visible in CI logs.
          /tmp/safety-env/bin/python -m pip install "safety==3.8.1"
          /tmp/safety-env/bin/safety --version
          # Blocking: fail on HIGH/CRITICAL vulnerabilities.
          # --ignore 70612: Known false positive / accepted risk.
          /tmp/safety-env/bin/safety check --full-report --ignore 70612 -r /tmp/aragora-deps.txt

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Secret Scanning
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for comprehensive scanning

      - name: Verify checkout integrity
        shell: bash
        run: |
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::pyproject.toml missing after checkout; attempting recovery"
            git reset --hard || true
            git clean -ffdx || true
            git sparse-checkout disable || true
            git fetch --no-tags origin "${GITHUB_SHA:-HEAD}" || true
            git checkout -f "${GITHUB_SHA:-HEAD}" || true
            if git rev-parse --verify FETCH_HEAD >/dev/null 2>&1; then
              git reset --hard FETCH_HEAD
            else
              git reset --hard HEAD
            fi
            git clean -ffdx || true
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::Sparse-checkout recovery incomplete; attempting archive restore"
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            if ! git archive "${GITHUB_SHA:-HEAD}" | tar -x; then
              git archive HEAD | tar -x
            fi
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::error::Repository checkout is incomplete (pyproject.toml missing)"
            echo "PWD=$(pwd)"
            ls -la
            exit 1
          fi

      # Gitleaks removed: gitleaks-action@v2 requires a paid GITLEAKS_LICENSE
      # for organization accounts. TruffleHog provides equivalent secret-
      # scanning coverage for free, with --only-verified filtering to
      # actually-live credentials (no false positives). Local pre-commit
      # still runs gitleaks (the binary) which remains free for individual use.
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@v3.95.2
        with:
          # GHCR publishes the trufflehog image without the leading "v"
          # (ghcr.io/trufflesecurity/trufflehog:3.95.2 exists; :v3.95.2 does not),
          # so the action's docker pull fails with "manifest unknown" when we
          # pass version: v3.95.2. Action ref `@v3.95.2` is correct (release tag);
          # only the docker tag drops the v.
          version: 3.95.2
          extra_args: --only-verified

  helm-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Helm Chart Validation
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify checkout integrity
        shell: bash
        run: |
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::pyproject.toml missing after checkout; attempting recovery"
            git reset --hard || true
            git clean -ffdx || true
            git sparse-checkout disable || true
            git fetch --no-tags origin "${GITHUB_SHA:-HEAD}" || true
            git checkout -f "${GITHUB_SHA:-HEAD}" || true
            if git rev-parse --verify FETCH_HEAD >/dev/null 2>&1; then
              git reset --hard FETCH_HEAD
            else
              git reset --hard HEAD
            fi
            git clean -ffdx || true
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::Sparse-checkout recovery incomplete; attempting archive restore"
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            if ! git archive "${GITHUB_SHA:-HEAD}" | tar -x; then
              git archive HEAD | tar -x
            fi
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::error::Repository checkout is incomplete (pyproject.toml missing)"
            echo "PWD=$(pwd)"
            ls -la
            exit 1
          fi

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Add Helm repositories
        run: helm repo add bitnami https://charts.bitnami.com/bitnami

      - name: Lint primary Helm chart
        run: |
          helm dependency build deploy/helm/aragora/
          helm lint deploy/helm/aragora/ --strict
          echo "Primary chart passed lint!"

      - name: Lint Kubernetes Helm chart
        run: |
          helm dependency build deploy/kubernetes/helm/aragora/
          helm lint deploy/kubernetes/helm/aragora/ --strict
          echo "Kubernetes chart passed lint!"

      - name: Lint multi-region Helm chart
        run: |
          helm dependency build deploy/multi-region/helm/aragora/
          helm lint deploy/multi-region/helm/aragora/ --strict
          echo "Multi-region chart passed lint!"

      - name: Lint operator Helm chart
        run: |
          helm lint aragora-operator/helm/aragora-operator/ --strict
          echo "Operator chart passed lint!"

      - name: Validate chart templates
        run: |
          # Validate primary chart renders correctly
          helm template aragora deploy/helm/aragora/ --debug > /dev/null
          echo "Primary chart template validation passed!"

          # Validate with staging values
          if [ -f deploy/helm/aragora/values-staging.yaml ]; then
            helm template aragora deploy/helm/aragora/ -f deploy/helm/aragora/values-staging.yaml --debug > /dev/null
            echo "Staging values validation passed!"
          fi

      - name: Validate values schema
        run: |
          # Install schema validator
          python -m pip install check-jsonschema

          # Validate values.yaml against schema
          if [ -f deploy/helm/aragora/values.schema.json ]; then
            check-jsonschema --schemafile deploy/helm/aragora/values.schema.json deploy/helm/aragora/values.yaml
            echo "Values schema validation passed!"
          fi

      - name: Install kubeconform
        run: |
          # Install kubeconform (kubeval successor) for K8s schema validation
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.4/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
          kubeconform -v

      - name: Validate Kubernetes schemas
        run: |
          # Validate all charts against Kubernetes 1.28+ schemas
          # Uses strict mode to catch unknown fields

          echo "Validating primary chart..."
          helm template aragora deploy/helm/aragora/ | kubeconform -strict -summary -kubernetes-version 1.28.0

          echo "Validating kubernetes chart..."
          helm template aragora deploy/kubernetes/helm/aragora/ | kubeconform -strict -summary -kubernetes-version 1.28.0

          echo "Validating multi-region chart..."
          helm template aragora deploy/multi-region/helm/aragora/ | kubeconform -strict -summary -kubernetes-version 1.28.0

          echo "Validating operator chart..."
          helm template aragora-operator aragora-operator/helm/aragora-operator/ | kubeconform -strict -summary -kubernetes-version 1.28.0

          echo "All charts passed Kubernetes schema validation!"

  todo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: TODO/FIXME Enforcement
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify checkout integrity
        shell: bash
        run: |
