name: Lint

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  merge_group:
  workflow_dispatch:
    inputs:
      changed_files:
        description: "Optional newline- or comma-separated changed files for typecheck planning."
        required: false
        type: string

concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ratchets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python-safe
        with:
          python-version: "3.11"
      - uses: ./.github/actions/setup-node-safe
        with:
          node-version: "25.9.0"
      - name: Install readiness toolchain
        run: python -m pip install -e '.[dev,test,readiness]'
      - name: Run root ratchets
        shell: bash
        working-directory: .
        run: |
          make readiness-lint-root READINESS_REPORT_DIR=/tmp/ratchets 2>&1 | tee ratchets.log
          test ${PIPESTATUS[0]} -eq 0
          ! grep -q '^SKIP root:' ratchets.log
      - name: Summarize root ratchets
        if: always()
        shell: bash
        run: |
          {
            echo '## Root ratchets (advisory)'
            echo '```text'
            if [ -f ratchets.log ]; then
              tail -n 80 ratchets.log
            else
              echo 'Ratchets did not run; check the toolchain setup steps.'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload ratchet reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: root-ratchet-reports
          path: /tmp/ratchets/*.report.json
          if-no-files-found: warn
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      python: ${{ steps.scope.outputs.lint_python }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify checkout integrity
        shell: bash
        working-directory: .
        run: |
          if [[ ! -f pyproject.toml ]] || [[ ! -f aragora/live/package.json ]]; then
            echo "::warning::Frontend checkout incomplete after checkout; attempting recovery"
            git sparse-checkout disable || true
            git fetch --no-tags origin "${GITHUB_SHA:-HEAD}"
            git reset --hard FETCH_HEAD
            git clean -ffd || true
          fi
          if [[ ! -f pyproject.toml ]] || [[ ! -f aragora/live/package.json ]]; then
            echo "::warning::Standard recovery incomplete; attempting archive restore"
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            git archive "${GITHUB_SHA:-HEAD}" | tar -x || git archive HEAD | tar -x
          fi
          if [[ ! -f pyproject.toml ]] || [[ ! -f aragora/live/package.json ]]; then
            echo "::error::Repository checkout is incomplete (missing pyproject.toml or aragora/live/package.json)"
            echo "PWD=$(pwd)"
            ls -la
            ls -la aragora/live || true
            exit 1
          fi

      - uses: ./.github/actions/pr-scope-classifier
        id: scope

  lint-run:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify checkout integrity
        shell: bash
        working-directory: .
        run: |
          if [[ ! -f pyproject.toml ]] || [[ ! -f aragora/live/package.json ]]; then
            echo "::warning::Frontend checkout incomplete after checkout; attempting recovery"
            git reset --hard || true
            git clean -ffdx || true
            git sparse-checkout disable || true
            git fetch --no-tags origin "${GITHUB_SHA:-HEAD}" || true
            git checkout -f "${GITHUB_SHA:-HEAD}" || true
            if git rev-parse --verify FETCH_HEAD >/dev/null 2>&1; then
              git reset --hard FETCH_HEAD
            else
              git reset --hard HEAD
            fi
            git clean -ffdx || true
          fi
          if [[ ! -f pyproject.toml ]] || [[ ! -f aragora/live/package.json ]]; then
            echo "::warning::Sparse-checkout recovery incomplete; attempting archive restore"
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            if ! git archive "${GITHUB_SHA:-HEAD}" | tar -x; then
              git archive HEAD | tar -x
            fi
          fi
          if [[ ! -f pyproject.toml ]] || [[ ! -f aragora/live/package.json ]]; then
            echo "::error::Repository checkout is incomplete (missing pyproject.toml or aragora/live/package.json)"
            echo "PWD=$(pwd)"
            ls -la
            ls -la aragora/live || true
            exit 1
          fi

      - name: Resolve Python runtime
        id: lint_python
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_BIN=""
          for candidate in python3.13 python3.12 python3.11 python3.10 python3 python; do
            if command -v "$candidate" >/dev/null 2>&1; then
              PYTHON_BIN="$(command -v "$candidate")"
              break
            fi
          done
          if [[ -z "$PYTHON_BIN" ]]; then
            echo "::error::Python runtime not found on runner"
            exit 1
          fi
          PYTHON_VERSION="$("$PYTHON_BIN" -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
          if ! "$PYTHON_BIN" -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 10) else 1)'; then
            echo "::error::Python >=3.10 required for lint checks, found ${PYTHON_VERSION} at ${PYTHON_BIN}"
            exit 1
          fi
          echo "Using Python ${PYTHON_VERSION} at ${PYTHON_BIN}"
          "$PYTHON_BIN" -m ensurepip --upgrade || true
          "$PYTHON_BIN" -m pip install --upgrade pip
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "python_bin=$PYTHON_BIN" >> "$GITHUB_OUTPUT"

      - name: Install linters
        run: |
          "${{ steps.lint_python.outputs.python_bin }}" -m pip install --user ruff==0.14.14
          "${{ steps.lint_python.outputs.python_bin }}" -m pip install --user -e .

      - name: Enforce branch mutation policy
        run: ${{ steps.lint_python.outputs.python_bin }} scripts/check_branch_mutation_policy.py

      - name: Enforce deploy SHA verification guard
        run: ${{ steps.lint_python.outputs.python_bin }} scripts/check_deploy_secure_sha_guard.py

      - name: Enforce required-check-priority keep-list policy
        run: ${{ steps.lint_python.outputs.python_bin }} scripts/check_required_check_priority_policy.py

      - name: Enforce workflow pip install policy
        run: ${{ steps.lint_python.outputs.python_bin }} scripts/check_workflow_pip_install_policy.py

      - name: Enforce aragora-verify dependency policy
        run: ${{ steps.lint_python.outputs.python_bin }} scripts/check_aragora_verify_dependency_policy.py

      - name: Enforce Boundary 2 module-edge policy
        run: ${{ steps.lint_python.outputs.python_bin }} scripts/ci/check_boundary_edges.py

      - name: Enforce self-hosted checkout integrity policy
        run: ${{ steps.lint_python.outputs.python_bin }} scripts/check_workflow_checkout_integrity_policy.py

      - name: Enforce execution-gate default hardening policy
        run: ${{ steps.lint_python.outputs.python_bin }} scripts/check_execution_gate_defaults.py

      - name: Enforce execution-gate policy change-control metadata
        run: ${{ steps.lint_python.outputs.python_bin }} scripts/check_execution_gate_policy_control.py

      - name: Validate Prometheus rule syntax with promtool
        run: ${{ steps.lint_python.outputs.python_bin }} scripts/check_prometheus_rules.py

      - name: Enforce code quality ratchet
        run: ${{ steps.lint_python.outputs.python_bin }} scripts/report_code_quality.py --check

      - name: Run ruff format check (all Python files)
        run: ${{ steps.lint_python.outputs.python_bin }} -m ruff format --check aragora/ tests/ scripts/
        shell: bash

      - name: Run ruff lint check (all Python files)
        run: ${{ steps.lint_python.outputs.python_bin }} -m ruff check aragora/ tests/ scripts/
        shell: bash

  lint:
    needs: [changes, lint-run]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Evaluate lint result
        env:
          CLASSIFIER_RESULT: ${{ needs.changes.result }}
          WORKER_RESULT: ${{ needs.lint-run.result }}
          IN_SCOPE: ${{ needs.changes.outputs.python }}
        run: |
          set -euo pipefail
          if [[ "$CLASSIFIER_RESULT" != "success" ]]; then
            echo "::error::Change classification concluded '$CLASSIFIER_RESULT'; its scope verdict cannot be trusted. Failing closed."
            exit 1
          fi
          case "$IN_SCOPE" in
            true)
              if [[ "$WORKER_RESULT" != "success" ]]; then
                echo "::error::Lint concluded '$WORKER_RESULT' (expected 'success'). Failing closed."
                exit 1
              fi
              echo "Lint passed."
              ;;
            false)
              if [[ "$WORKER_RESULT" != "skipped" ]]; then
                echo "::error::Lint was out of scope but concluded '$WORKER_RESULT'. Failing closed."
                exit 1
              fi
              echo "Lint not required — no Python-relevant changes."
              ;;
            *)
              echo "::error::Change classification produced invalid IN_SCOPE value '$IN_SCOPE' (expected exactly 'true' or 'false'). Failing closed."
              exit 1
              ;;
          esac

  connector-exception-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Connector Exception Hygiene
    # PR fast path: this job is non-required and runs on push/workflow_dispatch.
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify checkout integrity
        shell: bash
        run: |
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::pyproject.toml missing after checkout; attempting recovery"
            git reset --hard || true
            git clean -ffdx || true
            git sparse-checkout disable || true
            git fetch --no-tags origin "${GITHUB_SHA:-HEAD}" || true
            git checkout -f "${GITHUB_SHA:-HEAD}" || true
            if git rev-parse --verify FETCH_HEAD >/dev/null 2>&1; then
              git reset --hard FETCH_HEAD
            else
              git reset --hard HEAD
            fi
            git clean -ffdx || true
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::Sparse-checkout recovery incomplete; attempting archive restore"
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            if ! git archive "${GITHUB_SHA:-HEAD}" | tar -x; then
              git archive HEAD | tar -x
            fi
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::error::Repository checkout is incomplete (pyproject.toml missing)"
            echo "PWD=$(pwd)"
            ls -la
            exit 1
          fi

      - name: Set up Python
        uses: ./.github/actions/setup-python-safe
        with:
          python-version: "3.11"

      - name: Run connector/runtime exception guard
        run: python scripts/check_connector_exception_handling.py --path aragora/connectors aragora/runtime

      - name: Connector guard repro hint
        if: failure()
        run: |
          echo "Reproduce locally: python scripts/check_connector_exception_handling.py --path aragora/connectors aragora/runtime"

  agent-registry-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Agent Registry Sync
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify checkout integrity
        shell: bash
        run: |
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::pyproject.toml missing after checkout; attempting recovery"
            git reset --hard || true
            git clean -ffdx || true
            git sparse-checkout disable || true
            git fetch --no-tags origin "${GITHUB_SHA:-HEAD}" || true
            git checkout -f "${GITHUB_SHA:-HEAD}" || true
            if git rev-parse --verify FETCH_HEAD >/dev/null 2>&1; then
              git reset --hard FETCH_HEAD
            else
              git reset --hard HEAD
            fi
            git clean -ffdx || true
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::Sparse-checkout recovery incomplete; attempting archive restore"
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            if ! git archive "${GITHUB_SHA:-HEAD}" | tar -x; then
              git archive HEAD | tar -x
            fi
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::error::Repository checkout is incomplete (pyproject.toml missing)"
            echo "PWD=$(pwd)"
            ls -la
            exit 1
          fi

      - name: Set up Python
        uses: ./.github/actions/setup-python-safe
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          bash scripts/ci_install_project.sh

      - name: Check AGENTS registry sync
        run: python scripts/check_agent_registry_sync.py

      - name: Check doc agent-count drift
        run: python scripts/check_agent_registry_drift.py

      - name: Agent registry repro hint
        if: failure()
        run: |
          echo "Reproduce locally:"
          echo "  python scripts/check_agent_registry_sync.py"
          echo "  python scripts/check_agent_registry_drift.py"

  typecheck-run:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify checkout integrity
        shell: bash
        run: |
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::pyproject.toml missing after checkout; attempting recovery"
            git reset --hard || true
            git clean -ffdx || true
            git sparse-checkout disable || true
            git fetch --no-tags origin "${GITHUB_SHA:-HEAD}" || true
            git checkout -f "${GITHUB_SHA:-HEAD}" || true
            if git rev-parse --verify FETCH_HEAD >/dev/null 2>&1; then
              git reset --hard FETCH_HEAD
            else
              git reset --hard HEAD
            fi
            git clean -ffdx || true
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::Sparse-checkout recovery incomplete; attempting archive restore"
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            if ! git archive "${GITHUB_SHA:-HEAD}" | tar -x; then
              git archive HEAD | tar -x
            fi
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::error::Repository checkout is incomplete (pyproject.toml missing)"
            echo "PWD=$(pwd)"
            ls -la
            exit 1
          fi

      # The full-tier baseline (scripts/baselines/root-mypy-full.json) is a CPython 3.11 HOST census:
      # mypy parses with the host interpreter's ast, so line attribution (and the ratchet keys derived
      # from it) can differ on 3.12+ even with --python-version=3.11. Hosted ubuntu-24.04 puts
      # /usr/bin/python3.12 on PATH and keeps 3.11 only in the toolcache, so the host is set up
      # explicitly instead of resolved from PATH.
      - uses: ./.github/actions/setup-python-safe
        with:
          python-version: "3.11"

      - name: Resolve Python runtime
        id: typecheck_python
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_BIN="$(command -v python)"
          PYTHON_VERSION="$("$PYTHON_BIN" -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
          echo "Using Python ${PYTHON_VERSION} at ${PYTHON_BIN}"
          if [[ "$PYTHON_VERSION" != "3.11" ]]; then
            echo "::error::The full typecheck tier requires a CPython 3.11 host (the mypy baseline's parser); found ${PYTHON_VERSION} at ${PYTHON_BIN}"
            exit 1
          fi
          "$PYTHON_BIN" -m pip install --upgrade pip
          echo "python_bin=$PYTHON_BIN" >> "$GITHUB_OUTPUT"

      - name: Install mypy and type stubs
        run: |
          python -m pip install -e .
          python -m pip install mypy==2.1.0 types-requests types-redis types-python-dateutil types-setuptools types-jsonschema types-PyYAML

      - name: Resolve phase-1 typecheck plan
        id: typecheck_plan
        shell: bash
        run: |
          set -euo pipefail
          TARGETS_FILE="${RUNNER_TEMP}/typecheck-targets.txt"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git fetch --no-tags origin "${{ github.base_ref }}" --depth=1
            "${{ steps.typecheck_python.outputs.python_bin }}" scripts/run_typecheck_gate.py \
              --repo-root . \
              --base-ref "${{ github.base_ref }}" \
              --github-output "$GITHUB_OUTPUT" \
              --targets-file "$TARGETS_FILE"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            dispatch_files_raw="${{ github.event.inputs.changed_files || '' }}"
            mapfile -t dispatch_files < <(
              printf '%s\n' "$dispatch_files_raw" \
                | tr ',' '\n' \
                | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
                | awk 'NF {print}'
            )
            if [[ "${#dispatch_files[@]}" -gt 0 ]]; then
              "${{ steps.typecheck_python.outputs.python_bin }}" scripts/run_typecheck_gate.py \
                --repo-root . \
                --files "${dispatch_files[@]}" \
                --github-output "$GITHUB_OUTPUT" \
                --targets-file "$TARGETS_FILE"
            else
              # Manual dispatches lack PR merge refs; run full rather than diffing a stale branch checkout.
              echo "mode=full" >> "$GITHUB_OUTPUT"
              echo "target_count=0" >> "$GITHUB_OUTPUT"
              echo "summary=Run the full typecheck tier for workflow_dispatch without changed_files." >> "$GITHUB_OUTPUT"
              : > "$TARGETS_FILE"
            fi
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            # Direct push to main: run full typecheck
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "target_count=0" >> "$GITHUB_OUTPUT"
            echo "summary=Run the full typecheck tier on direct main push." >> "$GITHUB_OUTPUT"
            : > "$TARGETS_FILE"
          else
            # Branch push (e.g., boss loop harvest): check only changed files
            git fetch --no-tags origin main --depth=1 2>/dev/null || true
            "${{ steps.typecheck_python.outputs.python_bin }}" scripts/run_typecheck_gate.py \
              --repo-root . \
              --base-ref "origin/main" \
              --github-output "$GITHUB_OUTPUT" \
              --targets-file "$TARGETS_FILE"
          fi
          echo "targets_file=$TARGETS_FILE" >> "$GITHUB_OUTPUT"

      - name: Run full typecheck tier
        if: steps.typecheck_plan.outputs.mode == 'full'
        env:
          TYPECHECK_PYTHON: ${{ steps.typecheck_python.outputs.python_bin }}
        run: PATH="$HOME/.local/bin:$PATH" bash scripts/test_tiers.sh typecheck
        shell: bash
        # Required shrink-only baseline, with raw and NEW counts in the log.

      - name: Run changed-file typecheck gate
        if: steps.typecheck_plan.outputs.mode == 'changed'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t TARGETS < "${{ steps.typecheck_plan.outputs.targets_file }}"
          echo "Running mypy on ${#TARGETS[@]} touched aragora file(s)"
          PATH="$HOME/.local/bin:$PATH" \
            "${{ steps.typecheck_python.outputs.python_bin }}" -m mypy \
            --ignore-missing-imports \
            --follow-imports=skip \
            --show-error-codes \
            "${TARGETS[@]}"

      - name: Skip typecheck gate
        if: steps.typecheck_plan.outputs.mode == 'skip'
        run: echo "${{ steps.typecheck_plan.outputs.summary }}"

  typecheck:
    needs: [changes, typecheck-run]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Evaluate typecheck result
        env:
          CLASSIFIER_RESULT: ${{ needs.changes.result }}
          WORKER_RESULT: ${{ needs.typecheck-run.result }}
          IN_SCOPE: ${{ needs.changes.outputs.python }}
        run: |
          set -euo pipefail
          if [[ "$CLASSIFIER_RESULT" != "success" ]]; then
            echo "::error::Change classification concluded '$CLASSIFIER_RESULT'; its scope verdict cannot be trusted. Failing closed."
            exit 1
          fi
          case "$IN_SCOPE" in
            true)
              if [[ "$WORKER_RESULT" != "success" ]]; then
                echo "::error::Type check concluded '$WORKER_RESULT' (expected 'success'). Failing closed."
                exit 1
              fi
              echo "Type check passed."
              ;;
            false)
              if [[ "$WORKER_RESULT" != "skipped" ]]; then
                echo "::error::Type check was out of scope but concluded '$WORKER_RESULT'. Failing closed."
                exit 1
              fi
              echo "Type check not required — no Python-relevant changes."
              ;;
            *)
              echo "::error::Change classification produced invalid IN_SCOPE value '$IN_SCOPE' (expected exactly 'true' or 'false'). Failing closed."
              exit 1
              ;;
          esac

  typecheck-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Core Module Type Safety
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify checkout integrity
        shell: bash
        run: |
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::pyproject.toml missing after checkout; attempting recovery"
            git reset --hard || true
            git clean -ffdx || true
            git sparse-checkout disable || true
            git fetch --no-tags origin "${GITHUB_SHA:-HEAD}" || true
            git checkout -f "${GITHUB_SHA:-HEAD}" || true
            if git rev-parse --verify FETCH_HEAD >/dev/null 2>&1; then
              git reset --hard FETCH_HEAD
            else
              git reset --hard HEAD
            fi
            git clean -ffdx || true
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::Sparse-checkout recovery incomplete; attempting archive restore"
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            if ! git archive "${GITHUB_SHA:-HEAD}" | tar -x; then
              git archive HEAD | tar -x
            fi
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::error::Repository checkout is incomplete (pyproject.toml missing)"
            echo "PWD=$(pwd)"
            ls -la
            exit 1
          fi

      - name: Set up Python
        uses: ./.github/actions/setup-python-safe
        with:
          python-version: "3.11"

      - name: Install mypy and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install mypy types-requests types-redis types-python-dateutil types-setuptools types-jsonschema types-PyYAML
          python -m pip install -e .

      - name: Typecheck core modules (REQUIRED)
        run: |
          # These modules must pass strict type checking
          # Phase 27: Expanded to 50 modules - gauntlet, workflow, explainability (Feb 2026)
          python -m mypy \
            aragora/ranking/elo.py \
            aragora/server/stream/servers.py \
            aragora/server/handlers/training.py \
            aragora/cli/main.py \
            aragora/config/secrets.py \
            aragora/storage/repository.py \
            aragora/debate/orchestrator.py \
            aragora/memory/continuum/__init__.py \
            aragora/debate/consensus.py \
            aragora/resilience/__init__.py \
            aragora/reasoning/belief.py \
            aragora/debate/team_selector.py \
            aragora/debate/prompt_builder.py \
            aragora/knowledge/types.py \
            aragora/agents/types.py \
            aragora/rbac/models.py \
            aragora/rbac/defaults/__init__.py \
            aragora/server/prometheus_nomic.py \
            aragora/server/prometheus_control_plane.py \
            aragora/server/prometheus_rlm.py \
            aragora/debate/phases/feedback_elo.py \
            aragora/debate/phases/feedback_persona.py \
            aragora/debate/phases/feedback_evolution.py \
            aragora/rlm/debate_adapter.py \
            aragora/rlm/knowledge_adapter.py \
            aragora/rlm/hierarchy_cache.py \
            aragora/rlm/types.py \
            aragora/policy/engine.py \
            aragora/policy/risk.py \
            aragora/policy/tools.py \
            aragora/connectors/chat/models.py \
            aragora/connectors/chat/base/__init__.py \
            aragora/connectors/chat/telegram.py \
            aragora/connectors/chat/whatsapp.py \
            aragora/connectors/chat/slack/__init__.py \
            aragora/connectors/chat/discord.py \
            aragora/gauntlet/runner.py \
            aragora/gauntlet/receipt.py \
            aragora/gauntlet/result.py \
            aragora/gauntlet/types.py \
            aragora/gauntlet/heatmap.py \
            aragora/workflow/engine.py \
            aragora/workflow/engine_v2.py \
