name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: aragora
    timeout-minutes: 5
    outputs:
      version: ${{ steps.get-version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify checkout integrity
        shell: bash
        run: |
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::pyproject.toml missing after checkout; attempting recovery"
            git sparse-checkout disable || true
            git fetch --no-tags origin "${GITHUB_SHA:-HEAD}"
            git reset --hard FETCH_HEAD
            git clean -ffd || true
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::Standard recovery failed; attempting archive restore"
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            git archive "${GITHUB_SHA:-HEAD}" | tar -x || git archive HEAD | tar -x
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::error::Repository checkout is incomplete (pyproject.toml missing)"
            echo "PWD=$(pwd)"
            ls -la
            exit 1
          fi

      - name: Repo hygiene guard
        run: python scripts/guard_repo_clean.py --check-working-tree

      - name: Get version
        id: get-version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Validate version format
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          # Accept SemVer core plus optional pre-release/build metadata (e.g. 2.8.1-rc.4).
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([\-][0-9A-Za-z\.-]+)?([+][0-9A-Za-z\.-]+)?$ ]]; then
            echo "Invalid version format: $VERSION"
            exit 1
          fi

  docs-sync:
    needs: validate
    runs-on: aragora
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify checkout integrity
        shell: bash
        run: |
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::pyproject.toml missing after checkout; attempting recovery"
            git sparse-checkout disable || true
            git fetch --no-tags origin "${GITHUB_SHA:-HEAD}"
            git reset --hard FETCH_HEAD
            git clean -ffd || true
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::Standard recovery failed; attempting archive restore"
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            git archive "${GITHUB_SHA:-HEAD}" | tar -x || git archive HEAD | tar -x
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::error::Repository checkout is incomplete (pyproject.toml missing)"
            echo "PWD=$(pwd)"
            ls -la
            exit 1
          fi

      - name: Set up Python
        uses: ./.github/actions/setup-python-safe
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          bash scripts/ci_install_project.sh --extras dev

      - name: Regenerate API docs
        run: |
          python scripts/generate_api_docs.py --output docs/API_ENDPOINTS.md

      - name: Ensure API endpoint docs are in sync
        run: |
          if ! git diff --exit-code docs/API_ENDPOINTS.md; then
            echo "::error::docs/API_ENDPOINTS.md is stale. Run: python scripts/generate_api_docs.py --output docs/API_ENDPOINTS.md"
            exit 1
          fi

      # Builds docs/api/openapi.{json,yaml} the way openapi.yml generates them and compares
      # the parsed content, so a tag fails while the committed spec drifts from the generator.
      - name: Ensure OpenAPI spec is in sync
        run: |
          OUT="$(mktemp -d)"
          trap 'rm -rf "$OUT"' EXIT
          python scripts/generate_openapi.py --output "$OUT/openapi.json"
          python scripts/generate_openapi.py --output "$OUT/openapi.yaml" --format yaml
          python scripts/add_openapi_operation_ids.py --spec "$OUT/openapi.json"
          python scripts/add_openapi_param_descriptions.py --spec "$OUT/openapi.json"
          python scripts/add_openapi_descriptions.py --spec "$OUT/openapi.json"
          python - "$OUT" <<'PY'
          import json, sys, yaml

          METHODS = {"get", "put", "post", "delete", "options", "head", "patch", "trace"}
          LISTED = 20

          def read(path):
              with open(path) as f:
                  if path.endswith(".json"):
                      return json.load(f)
                  return yaml.load(f, Loader=getattr(yaml, "CSafeLoader", yaml.SafeLoader))

          def operations(spec):
              return {(p, m): op for p, item in spec.get("paths", {}).items() for m, op in item.items() if m in METHODS}

          stale = False
          for name in ("openapi.json", "openapi.yaml"):
              old, new = read(f"docs/api/{name}"), read(f"{sys.argv[1]}/{name}")
              if old == new:
                  print(f"docs/api/{name}: in sync")
                  continue
              stale = True
              old_ops, new_ops = operations(old), operations(new)
              file_only, generator_only = sorted(old_ops.keys() - new_ops.keys()), sorted(new_ops.keys() - old_ops.keys())
              changed = sum(old_ops[k] != new_ops[k] for k in old_ops.keys() & new_ops.keys())
              other = sorted(k for k in set(old) | set(new) if k != "paths" and old.get(k) != new.get(k))
              print(f"::error::docs/api/{name} is stale: {len(file_only)} operations only in the file, "
                    f"{len(generator_only)} only in the generator output, {changed} shared operations differ, "
                    f"other keys differ: {other}. Regenerate it as this step does and commit the result.")
              for label, keys in (("file only", file_only), ("generator only", generator_only)):
                  for p, m in keys[:LISTED]:
                      print(f"  {label}: {m.upper()} {p}")
                  if len(keys) > LISTED:
                      print(f"  {label}: {len(keys) - LISTED} more not listed")
          sys.exit(1 if stale else 0)
          PY

  test:
    needs: validate
    runs-on: aragora
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
        test-group:
          - "tests/debate"
          - "tests/agents tests/rlm tests/reasoning tests/workflow"
          - "tests/server tests/handlers"
          - "tests/knowledge tests/evidence tests/memory"
          - "tests/storage tests/ranking tests/persistence"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify checkout integrity
        shell: bash
        run: |
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::pyproject.toml missing after checkout; attempting recovery"
            git sparse-checkout disable || true
            git fetch --no-tags origin "${GITHUB_SHA:-HEAD}"
            git reset --hard FETCH_HEAD
            git clean -ffd || true
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::Standard recovery failed; attempting archive restore"
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            git archive "${GITHUB_SHA:-HEAD}" | tar -x || git archive HEAD | tar -x
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::error::Repository checkout is incomplete (pyproject.toml missing)"
            echo "PWD=$(pwd)"
            ls -la
            exit 1
          fi

      - name: Set up Python
        uses: ./.github/actions/setup-python-safe
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          bash scripts/ci_install_project.sh --extras test
          python -m pip install pytest-timeout pytest-xdist

      - name: Verify required test dependencies
        run: python scripts/check_test_dependencies.py

      - name: Run tests
        run: |
          pytest ${{ matrix.test-group }} -v --timeout=30 --maxfail=5 --tb=short -n auto
        env:
          PYTHONPATH: .

  # ---------------------------------------------------------------------------
  # SDK parity gate: block release when strict SDK parity baselines regress.
  # ---------------------------------------------------------------------------
  sdk-parity-gate:
    needs: validate
    runs-on: aragora
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify checkout integrity
        shell: bash
        run: |
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::pyproject.toml missing after checkout; attempting recovery"
            git sparse-checkout disable || true
            git fetch --no-tags origin "${GITHUB_SHA:-HEAD}"
            git reset --hard FETCH_HEAD
            git clean -ffd || true
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::Standard recovery failed; attempting archive restore"
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            git archive "${GITHUB_SHA:-HEAD}" | tar -x || git archive HEAD | tar -x
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::error::Repository checkout is incomplete (pyproject.toml missing)"
            echo "PWD=$(pwd)"
            ls -la
            exit 1
          fi

      - name: Set up Python
        uses: ./.github/actions/setup-python-safe
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,test]"
          npm --prefix sdk/typescript ci

      - name: SDK parity strict gate
        run: |
          python scripts/check_sdk_parity.py \
            --strict \
            --baseline scripts/baselines/check_sdk_parity.json \
            --budget scripts/baselines/check_sdk_parity_budget.json

      - name: SDK namespace parity strict gate
        run: |
          python scripts/check_sdk_namespace_parity.py \
            --strict \
            --baseline scripts/baselines/check_sdk_namespace_parity.json

      - name: Cross-SDK parity strict gate
        run: |
          python scripts/check_cross_sdk_parity.py \
            --strict \
            --baseline scripts/baselines/cross_sdk_parity.json

      - name: TypeScript SDK typecheck
        run: npm --prefix sdk/typescript run typecheck

  # ---------------------------------------------------------------------------
  # Security gate: reusable workflow for security checks.
  # Runs bandit, pip-audit, npm audit, and hardcoded secrets scan.
  # ---------------------------------------------------------------------------
  security-gate-reusable:
    needs: validate
    uses: ./.github/workflows/security-gate.yml

  # ---------------------------------------------------------------------------
  # Inline security gate: kept for backwards compatibility and as a fallback
  # in case the reusable workflow has issues.  Runs the same critical checks
  # that block releases.
  # ---------------------------------------------------------------------------
  security-gate:
    needs: validate
    runs-on: aragora
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify checkout integrity
        shell: bash
        run: |
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::pyproject.toml missing after checkout; attempting recovery"
            git sparse-checkout disable || true
            git fetch --no-tags origin "${GITHUB_SHA:-HEAD}"
            git reset --hard FETCH_HEAD
            git clean -ffd || true
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::Standard recovery failed; attempting archive restore"
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            git archive "${GITHUB_SHA:-HEAD}" | tar -x || git archive HEAD | tar -x
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::error::Repository checkout is incomplete (pyproject.toml missing)"
            echo "PWD=$(pwd)"
            ls -la
            exit 1
          fi

      - name: Set up Python
        uses: ./.github/actions/setup-python-safe
        with:
          python-version: "3.11"

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit[toml] pip-audit uv

      # Bandit: fail on HIGH severity findings (-lll = high only)
      - name: Bandit security scan (HIGH severity blocking)
        run: bandit -r aragora/ -c pyproject.toml -lll

      # pip-audit: fail on known vulnerabilities in all locked project dependency groups
      - name: Python dependency audit (pip-audit)
        run: |
          python scripts/run_pip_audit_gate.py

      # Hardcoded secrets pattern scan (new gate)
      - name: "BLOCKING: Hardcoded secrets pattern scan"
        run: |
          python scripts/pre_release_check.py --gate secrets-only

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.18.0"

      # npm audit: fail on high/critical vulnerabilities in frontend deps
      # Low/moderate vulnerabilities are logged as warnings but do not block.
      - name: "BLOCKING: npm audit high/critical (live frontend)"
        working-directory: aragora/live
        run: |
          npm ci --ignore-scripts
          echo "--- Checking for low/moderate advisories (non-blocking) ---"
          npm audit --omit=dev --audit-level=moderate 2>&1 || true
          echo "--- Checking for high/critical advisories (BLOCKING) ---"
          npm audit --omit=dev --audit-level=high

      # npm audit: fail on high/critical vulnerabilities in TypeScript SDK deps
      # Install must succeed; if it fails, the step fails immediately.
      - name: "BLOCKING: npm audit high/critical (TypeScript SDK)"
        working-directory: sdk/typescript
        run: |
          npm ci --ignore-scripts 2>/dev/null || npm install --ignore-scripts
          echo "--- Checking for low/moderate advisories (non-blocking) ---"
          npm audit --omit=dev --audit-level=moderate 2>&1 || true
          echo "--- Checking for high/critical advisories (BLOCKING) ---"
          npm audit --omit=dev --audit-level=high

  # ---------------------------------------------------------------------------
  # Frontend build gate: ensure the Next.js frontend compiles without errors.
  # ---------------------------------------------------------------------------
  frontend-build:
    needs: validate
    runs-on: aragora
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify checkout integrity
        shell: bash
        run: |
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::pyproject.toml missing after checkout; attempting recovery"
            git sparse-checkout disable || true
            git fetch --no-tags origin "${GITHUB_SHA:-HEAD}"
            git reset --hard FETCH_HEAD
            git clean -ffd || true
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::Standard recovery failed; attempting archive restore"
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            git archive "${GITHUB_SHA:-HEAD}" | tar -x || git archive HEAD | tar -x
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::error::Repository checkout is incomplete (pyproject.toml missing)"
            echo "PWD=$(pwd)"
            ls -la
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.18.0"

      - name: Install frontend dependencies
        working-directory: aragora/live
        run: npm ci

      - name: TypeScript type check
        working-directory: aragora/live
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: aragora/live
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # ---------------------------------------------------------------------------
  # Skip baseline and pentest findings: enforce test discipline and security
  # posture before release.
  # ---------------------------------------------------------------------------
  release-checks:
    needs: validate
    runs-on: aragora
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify checkout integrity
        shell: bash
        run: |
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::pyproject.toml missing after checkout; attempting recovery"
            git sparse-checkout disable || true
            git fetch --no-tags origin "${GITHUB_SHA:-HEAD}"
            git reset --hard FETCH_HEAD
            git clean -ffd || true
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::Standard recovery failed; attempting archive restore"
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            git archive "${GITHUB_SHA:-HEAD}" | tar -x || git archive HEAD | tar -x
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::error::Repository checkout is incomplete (pyproject.toml missing)"
            echo "PWD=$(pwd)"
            ls -la
            exit 1
          fi

      - name: Set up Python
        uses: ./.github/actions/setup-python-safe
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,test]"

      - name: Skip baseline enforcement
        run: |
          CURRENT=$(python scripts/audit_test_skips.py --count-only)
          if [ ! -f tests/.skip_baseline ]; then
            echo "::error::tests/.skip_baseline file is missing — cannot enforce skip count"
            exit 1
          fi
          BASELINE=$(cat tests/.skip_baseline)
          # Validate that both values are integers
          if ! [[ "$CURRENT" =~ ^[0-9]+$ ]] || ! [[ "$BASELINE" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid skip count values: current='$CURRENT', baseline='$BASELINE'"
            exit 1
          fi
          echo "Current skip count: $CURRENT"
          echo "Baseline: $BASELINE"
          DIFF=$((CURRENT - BASELINE))
          if [ "$DIFF" -gt 0 ]; then
            echo "::error::Skip count increased by $DIFF (from $BASELINE to $CURRENT). No increase allowed without updating tests/.skip_baseline."
            echo ""
            echo "If this increase is intentional, update the baseline:"
            echo "  echo $CURRENT > tests/.skip_baseline"
            echo "  git add tests/.skip_baseline && git commit -m 'chore: update skip baseline to $CURRENT'"
            exit 1
          fi
          if [ "$DIFF" -lt 0 ]; then
            echo "::notice::Skip count decreased by $((-DIFF)). Consider updating tests/.skip_baseline to $CURRENT."
          fi
          echo "Skip baseline check passed (current=$CURRENT, baseline=$BASELINE)"
        env:
          PYTHONPATH: .

      - name: Pentest findings gate
        run: |
          python scripts/check_pentest_findings.py

      # ---------------------------------------------------------------
      # Version-tag consistency: verify pyproject.toml matches the tag
      # ---------------------------------------------------------------
      - name: Version-tag consistency check
        run: |
          python scripts/pre_release_check.py --gate version-tag
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}

      # ---------------------------------------------------------------
      # STATUS.md validation: enforce strict release/status truthfulness
      # ---------------------------------------------------------------
      - name: Validate release/status truthfulness
        run: python scripts/pre_release_check.py --gate status-doc
        env:
          PYTHONPATH: .

  # ---------------------------------------------------------------------------
  # Integration gate: reusable workflow for integration smoke tests.
  # Runs smoke_test.py, integration tests, and API contract sync checks.
  # ---------------------------------------------------------------------------
  integration-gate-reusable:
    needs: [validate, test]
    uses: ./.github/workflows/integration-gate.yml

  # ---------------------------------------------------------------------------
  # Integration smoke test: run a targeted subset of integration tests to
  # catch wiring / import / startup regressions before release.
  # ---------------------------------------------------------------------------
  integration-smoke:
    needs: [validate, test]
    runs-on: aragora
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify checkout integrity
        shell: bash
        run: |
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::pyproject.toml missing after checkout; attempting recovery"
            git sparse-checkout disable || true
            git fetch --no-tags origin "${GITHUB_SHA:-HEAD}"
            git reset --hard FETCH_HEAD
            git clean -ffd || true
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::Standard recovery failed; attempting archive restore"
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            git archive "${GITHUB_SHA:-HEAD}" | tar -x || git archive HEAD | tar -x
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::error::Repository checkout is incomplete (pyproject.toml missing)"
            echo "PWD=$(pwd)"
            ls -la
            exit 1
          fi

      - name: Set up Python
        uses: ./.github/actions/setup-python-safe
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          bash scripts/ci_install_project.sh --extras test
          python -m pip install pytest-timeout

      - name: Run smoke test harness (--skip-server)
        run: python scripts/smoke_test.py --skip-server --quick --verbose
        env:
          PYTHONPATH: .

      - name: Run integration smoke tests
        run: |
          pytest tests/integration/ \
            -v \
            --timeout=120 \
            --tb=short \
            --maxfail=3
        env:
          PYTHONPATH: .

      - name: Run OpenAPI contract sync tests
        run: |
          pytest tests/sdk/test_openapi_sync.py -q --timeout=60 --tb=short
        env:
          PYTHONPATH: .

      - name: Run SDK contract parity tests
        run: |
          pytest tests/sdk/test_contract_parity.py -q --timeout=60 --tb=short
        env:
          PYTHONPATH: .

      - name: Verify core imports
        run: |
          python -c "
          from aragora import Arena, Environment, DebateProtocol
          from aragora.server.handler_registry import HANDLER_REGISTRY
          from aragora.rbac.models import Permission, Role
          from aragora.knowledge.bridges import KnowledgeBridgeHub
          from aragora.memory.continuum import ContinuumMemory
          print('All core imports OK')
          "

  # ---------------------------------------------------------------------------
  # Build: requires ALL gates to pass before building the release package.
  # ---------------------------------------------------------------------------
  build:
    needs: [validate, test, docs-sync, sdk-parity-gate, security-gate, integration-smoke, frontend-build, release-checks]
    runs-on: aragora
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify checkout integrity
        shell: bash
        run: |
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::pyproject.toml missing after checkout; attempting recovery"
            git sparse-checkout disable || true
            git fetch --no-tags origin "${GITHUB_SHA:-HEAD}"
            git reset --hard FETCH_HEAD
            git clean -ffd || true
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::Standard recovery failed; attempting archive restore"
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            git archive "${GITHUB_SHA:-HEAD}" | tar -x || git archive HEAD | tar -x
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::error::Repository checkout is incomplete (pyproject.toml missing)"
            echo "PWD=$(pwd)"
            ls -la
            exit 1
          fi

      - name: Set up Python
        uses: ./.github/actions/setup-python-safe
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Update version in pyproject.toml
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          sed -i "s/version = \".*\"/version = \"$VERSION\"/" pyproject.toml

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # No PyPI upload here: publish-aragora.yml (manual dispatch) is the only publisher of the
  # aragora package. Run it after this workflow's release job has attached the assets, since
  # immutable releases refuse assets once published.
  release:
    needs: [validate, build]
    runs-on: aragora
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify checkout integrity
        shell: bash
        run: |
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::pyproject.toml missing after checkout; attempting recovery"
            git sparse-checkout disable || true
            git fetch --no-tags origin "${GITHUB_SHA:-HEAD}"
            git reset --hard FETCH_HEAD
            git clean -ffd || true
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::warning::Standard recovery failed; attempting archive restore"
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            git archive "${GITHUB_SHA:-HEAD}" | tar -x || git archive HEAD | tar -x
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::error::Repository checkout is incomplete (pyproject.toml missing)"
            echo "PWD=$(pwd)"
            ls -la
            exit 1
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          name: Release v${{ needs.validate.outputs.version }}
          draft: false
          prerelease: false
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Note: Deployment happens automatically via deploy-secure.yml when push to main occurs.
