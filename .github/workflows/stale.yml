name: Stale Issues

# Marks issues inactive for 150 days as `stale` and closes them 30 days later
# unless they are updated. Pull requests are excluded. Issues labelled
# triage:protected, pinned, security or roadmap are exempt.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: stale-issues
  cancel-in-progress: false

jobs:
  stale:
    name: Mark and close stale issues
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run actions/stale
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-stale: 150
          days-before-close: 30
          days-before-pr-stale: -1
          days-before-pr-close: -1
          stale-issue-label: stale
          exempt-issue-labels: triage:protected,pinned,security,roadmap
          operations-per-run: 100
          remove-stale-when-updated: true
          stale-issue-message: >-
            This issue has had no activity for 150 days and is now marked stale.
            It will be closed in 30 days unless it is updated or the label is removed.
          close-issue-message: >-
            Closing as stale after 30 days without activity. Reopen if it is still relevant.
