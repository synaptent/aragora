name: Production Smoke Test

on:
  # Scheduled probes are PARKED (operator decision 2026-09-07, #9391 / #9966
  # metric 7): api.aragora.ai has had no production origin since AWS was retired
  # on 2026-08-19, so every 30-minute run failed by construction (~100 red runs a
  # day). Re-enable the schedule in the same PR that lands the provider-neutral
  # canary (#9851 / #9882) and restores a 200 on /readyz. Manual dispatch still
  # works for a one-off probe.
  # schedule:
  #   - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: aragora
    timeout-minutes: 5
    steps:
      - name: Check backend health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 \
            "${API_URL}/healthz" || echo "000")
          echo "Health check status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Backend health check failed (status=$STATUS)"
            exit 1
          fi
        env:
          API_URL: ${{ vars.PRODUCTION_API_URL || 'https://api.aragora.ai' }}

      - name: Check playground status endpoint
        run: |
          STATUS=$(curl -sS -o /tmp/playground-status.json -w "%{http_code}" \
            --max-time 10 \
            "${API_URL}/api/v1/playground/status" || echo "000")
          echo "Playground status endpoint: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Playground status endpoint failed (status=$STATUS)"
            [ -f /tmp/playground-status.json ] && cat /tmp/playground-status.json
            exit 1
          fi
          if ! grep -q '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/playground-status.json; then
            echo "::error::Playground status payload missing expected ok marker"
            cat /tmp/playground-status.json
            exit 1
          fi
        env:
          API_URL: ${{ vars.PRODUCTION_API_URL || 'https://api.aragora.ai' }}
