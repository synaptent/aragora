name: Required Check Priority

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: required-check-priority-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  actions: write
  checks: read
  contents: read

jobs:
  prioritize-required-checks:
    name: Prioritize Required Checks
    runs-on: aragora
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    timeout-minutes: 10

    steps:
      - name: Cancel queued non-required workflow runs for superseded PR heads
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const headSha = pr.head.sha;
            const headBranch = pr.head.ref;
            const baseBranch = pr.base.ref;
            const selfRunId = Number(process.env.GITHUB_RUN_ID);

            const sweeps = 4;
            const sweepDelayMs = 10000;

            // Required checks are produced by these workflows, and we also keep
            // Tests plus offline/shadow smoke workflows so PR CI reflects real
            // outcomes instead of looking cancelled after prioritization sweeps.
            const alwaysKeepWorkflowPaths = new Set([
              // aragora-merge-quorum is a REQUIRED status check. The live
              // branch-protection read below cannot run under GITHUB_TOKEN (no
              // administration scope -> 403), so this static keep-list is the
              // only thing that actually protects required checks from being
              // cancelled. Omitting the merge-quorum gate let it be cancelled
              // into a red cancelled required status that needed a manual rerun.
              '.github/workflows/aragora-merge-quorum.yml',
              '.github/workflows/aragora-review-gate.yml',
              '.github/workflows/autopilot-worktree-e2e.yml',
              '.github/workflows/core-suites.yml',
              '.github/workflows/lint.yml',
              '.github/workflows/sdk-parity.yml',
              '.github/workflows/sdk-generate.yml',
              '.github/workflows/sdk-test.yml',
              '.github/workflows/test.yml',
              '.github/workflows/openapi.yml',
              '.github/workflows/pr-admission-controller.yml',
              '.github/workflows/quality-smoke.yml',
              '.github/workflows/release-readiness.yml',
              '.github/workflows/security-gate.yml',
              '.github/workflows/self-hosted-shadow.yml',
              '.github/workflows/smoke.yml',
              '.github/workflows/smoke-offline.yml',
              '.github/workflows/required-check-priority.yml',
            ]);
            const alwaysKeepWorkflowNames = new Set([
              'Aragora Merge Quorum',
              'Aragora Code Review',
              'Autopilot Worktree E2E',
              'Core Suites (Decision Integrity)',
              'Generate SDK Types',
              'Offline Golden Path',
              'Required Check Priority',
              'Lint',
              'PR Admission Controller',
              'Quality Pipeline Smoke',
              'Release Readiness Gate',
              'Security Gate',
              'Self-Hosted Shadow CI',
              'SDK Parity Check',
              'SDK Tests',
              'Smoke Tests',
              'Tests',
              'OpenAPI Spec',
            ]);

            // Fail closed if the static keep-list ever resolves empty (an edit
            // regression or parse error). The keep-list is the only mechanism
            // that protects required checks from cancellation, so when it is
            // empty we cancel nothing this invocation rather than risk
            // cancelling a required check. This guards a broken keep-list only;
            // it is intentionally independent of the (best-effort) branch
            // protection read below.
            const keepListEmpty =
              alwaysKeepWorkflowPaths.size === 0 && alwaysKeepWorkflowNames.size === 0;
            if (keepListEmpty) {
              core.warning(
                'Required-check keep-list resolved empty; failing closed and ' +
                  'cancelling no runs this invocation.'
              );
            }

            const requiredContexts = new Set();
            try {
              const { data: protection } = await github.rest.repos.getBranchProtection({
                owner,
                repo,
                branch: baseBranch,
              });
              for (const name of protection.required_status_checks?.contexts ?? []) {
                requiredContexts.add(name);
              }
              core.info(
                `Loaded required contexts from branch protection (${requiredContexts.size}): ` +
                  `${Array.from(requiredContexts).join(', ')}`
              );
            } catch (error) {
              core.warning(
                `Could not read branch protection for '${baseBranch}' ` +
                  `(continuing with static required-workflow keep-list): ${error.message}`
              );
            }
            const requiredContextsNormalized = new Set(
              Array.from(requiredContexts).map((value) => String(value || '').trim())
            );

            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const canceledRuns = [];
            const seenRunIds = new Set();
            const requiredContextRunCache = new Map();
            let emptySweepCount = 0;

            async function getLiveHeadSha() {
              // Every caller treats an empty result as "stop sweeping", so a
              // transient API error must degrade to '' rather than fail the
              // whole priority job with another non-green rollup entry.
              try {
                const { data: livePr } = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: pr.number,
                });
                return String(livePr.head?.sha || '').trim();
              } catch (error) {
                core.info(`Live PR head lookup failed; stopping sweep: ${error.message || error}`);
                return '';
              }
            }

            async function runHasRequiredContext(run) {
              if (requiredContextsNormalized.size === 0) {
                return false;
              }
              if (requiredContextRunCache.has(run.id)) {
                return requiredContextRunCache.get(run.id);
              }

              const contextNames = new Set();
              const workflowName = String(run.name || '').trim();
              const registerName = (name) => {
                const normalized = String(name || '').trim();
                if (normalized) contextNames.add(normalized);
              };

              if (run.check_suite_id) {
                try {
                  const checkRuns = await github.paginate(github.rest.checks.listForSuite, {
                    owner,
                    repo,
                    check_suite_id: run.check_suite_id,
                    per_page: 100,
                  });
                  for (const checkRun of checkRuns) {
                    registerName(checkRun.name);
                  }
                } catch (error) {
                  core.warning(
                    `Could not inspect check runs for run ${run.id} (suite ${run.check_suite_id}): ${error.message}`
                  );
                }
              }

              // Fallback for runs where check suite data is not yet available.
              if (contextNames.size === 0) {
                try {
                  const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                    owner,
                    repo,
                    run_id: run.id,
                    per_page: 100,
                  });
                  for (const job of jobs) {
                    const jobName = String(job.name || '').trim();
                    registerName(jobName);
                    if (workflowName && jobName) {
                      registerName(`${workflowName} / ${jobName}`);
                    }
                  }
                } catch (error) {
                  core.warning(`Could not inspect jobs for run ${run.id}: ${error.message}`);
                }
              }

              const hasRequired = Array.from(contextNames).some((name) =>
                requiredContextsNormalized.has(name)
              );
              requiredContextRunCache.set(run.id, hasRequired);
              return hasRequired;
            }

            for (let pass = 1; pass <= sweeps; pass++) {
              const liveHeadSha = await getLiveHeadSha();
              if (!liveHeadSha || liveHeadSha !== headSha) {
                core.info(
                  `Stopping stale priority sweep: event head ${headSha} is no longer ` +
                    `the live PR head ${liveHeadSha || '(unavailable)'}`
                );
                break;
              }
              const { data: runPage } = await github.rest.actions.listWorkflowRunsForRepo({
                owner,
                repo,
                branch: headBranch,
                event: 'pull_request',
                per_page: 100,
              });
              const runs = runPage.workflow_runs || [];

              let passCanceled = 0;
              let passConsidered = 0;
              let staleSweep = false;
              for (const run of runs) {
                // Never cancel a run attached to the current PR head. GitHub
                // folds cancelled advisory conclusions into mergeStateStatus,
                // leaving otherwise-ready PRs UNSTABLE (#9034). Queue relief
                // is limited to superseded heads on the same branch.
                if (run.head_sha === liveHeadSha) continue;
                if (run.id === selfRunId) continue;
                // The branch-name listing can match an unrelated PR that
                // happens to share the name (forks, common automation branch
                // names). A run counts as superseded only when it provably
                // comes from this PR's own source repo and branch — and, when
                // GitHub attributes it to PRs at all, to this PR's number.
                const runHeadRepo = String(run.head_repository?.full_name || '').trim();
                const prHeadRepo = String(pr.head?.repo?.full_name || '').trim();
                if (!runHeadRepo || !prHeadRepo || runHeadRepo !== prHeadRepo) continue;
                if (String(run.head_branch || '').trim() !== headBranch) continue;
                const runPrNumbers = (run.pull_requests || []).map((item) => item.number);
                if (runPrNumbers.length > 0 && !runPrNumbers.includes(pr.number)) continue;
                // Only cancel QUEUED runs. An in-progress run already holds a
                // runner, so cancelling it frees no queue capacity; it only
                // converts a 1-5 minute advisory check into a red "cancelled"
                // conclusion that the cancelled-run guardian deliberately does
                // not rerun (its manifest covers required workflows only),
                // creating a manual-rerun tax that stalls merge settlement on
                // long-lived PRs. Queue-pressure relief is fully preserved:
                // queued advisory runs still yield to required checks.
                if (run.status !== 'queued') continue;
                // Fail closed on a broken (empty) keep-list: cancel nothing.
                if (keepListEmpty) continue;
                passConsidered += 1;

                const workflowPath = (run.path || '').split('@')[0];
                const workflowName = String(run.name || '').trim();
                if (
                  alwaysKeepWorkflowPaths.has(workflowPath) ||
                  alwaysKeepWorkflowNames.has(workflowName)
                ) {
                  continue;
                }

                // Defensive check: if a non-allowlisted workflow run currently owns
                // a required status context, keep it.
                const hasRequiredContext = await runHasRequiredContext(run);
                if (hasRequiredContext) continue;

                try {
                  // Close the race where a synchronize event lands after this
                  // sweep listed runs: a stale worker must never cancel the new
                  // live head's advisory checks.
                  const confirmedLiveHeadSha = await getLiveHeadSha();
                  if (!confirmedLiveHeadSha || confirmedLiveHeadSha !== headSha) {
                    staleSweep = true;
                    core.info(
                      `Stopping stale priority sweep before cancellation: event head ` +
                        `${headSha} is no longer the live PR head ` +
                        `${confirmedLiveHeadSha || '(unavailable)'}`
                    );
                    break;
                  }
                  await github.rest.actions.cancelWorkflowRun({
                    owner,
                    repo,
                    run_id: run.id,
                  });
                  passCanceled += 1;
                  if (!seenRunIds.has(run.id)) {
                    seenRunIds.add(run.id);
                    canceledRuns.push({
                      id: run.id,
                      workflow: run.name,
                      status: run.status,
                    });
                  }
                  core.info(`Canceled run ${run.id} (${run.name})`);
                } catch (error) {
                  core.warning(`Failed to cancel run ${run.id} (${run.name}): ${error.message}`);
                }
              }

              if (staleSweep) break;

              core.info(
                `Sweep ${pass}/${sweeps}: considered ${passConsidered} run(s), canceled ${passCanceled} run(s)`
              );
              if (passCanceled === 0) {
                emptySweepCount += 1;
              } else {
                emptySweepCount = 0;
              }
              if (emptySweepCount >= 2) {
                core.info('No cancellable runs for two consecutive sweeps; exiting early');
                break;
              }
              if (pass < sweeps) {
                await sleep(sweepDelayMs);
              }
            }

            await core.summary
              .addHeading('Required Check Priority')
              .addRaw(`PR #${pr.number} (${headBranch} @ ${headSha})`, true)
              .addRaw(`Canceled runs: ${canceledRuns.length}`, true)
              .addTable([
                [
                  { data: 'Run ID', header: true },
                  { data: 'Workflow', header: true },
                  { data: 'Status', header: true },
                ],
                ...canceledRuns.map((run) => [String(run.id), run.workflow, run.status]),
              ])
              .write();
