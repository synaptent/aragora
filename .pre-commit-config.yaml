# Pre-commit hooks for Aragora
# See https://pre-commit.com for more information
# Install: pre-commit install --hook-type pre-commit --hook-type pre-push
# Run all: pre-commit run --all-files

repos:
  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: (^docs/|\.md$)
      - id: end-of-file-fixer
        exclude: (^docs/|\.md$|\.json$|\.lock$|^\.github/workflows/contract_drift_trusted_launcher\.py$)
      - id: check-yaml
        args: [--unsafe]  # Allow custom tags
        exclude: ^(deploy/(helm|multi-region/helm|kubernetes/helm)|aragora-operator/helm)/.*templates/  # Helm templates use Go templating
      - id: check-json
        exclude: ^(package-lock\.json$|node_modules/)
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: detect-private-key
        exclude: ^(tests/|aragora/server/middleware/structured_logging\.py)  # Test files and redaction config contain field names

  # Ruff - fast Python linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
        exclude: ^\.github/workflows/contract_drift_trusted_launcher\.py$
      - id: ruff-format
        types_or: [python, pyi]
        exclude: ^(sdk/python/aragora/generated_types\.py|\.github/workflows/contract_drift_trusted_launcher\.py)$  # Integrity-pinned/generated, must stay stable

  # Type checking with mypy on the same local planning surface as CI's REQUIRED
  # phase-1 typecheck gate. Touched `aragora/**.py` files use CI's changed-file
  # mypy flags; CI force-full trigger files run the same full typecheck script
  # used by the workflow. This intentionally drops the old pre-push
  # baseline-style cross-file scan so local pushes follow the required CI gate
  # instead of failing on unrelated full-tree debt.
  # CI remains authoritative because it installs the project and computes the
  # changed-file plan from the PR/branch base; local pre-push remains a fast
  # guardrail, not the source of truth.
  #
  # We intentionally do NOT run the manual `mypy_with_baseline.py` helper on
  # pre-push. The required CI workflow uses `scripts/run_typecheck_gate.py` plus
  # `scripts/test_tiers.sh typecheck`; the baseline helper is available only for
  # explicit local baseline filtering or regeneration.
  #
  # This hook runs in an isolated `language: python` env, so pre-commit installs
  # mypy and the same type-stub packages as CI — the gate does not depend on the
  # developer's active environment having mypy (no "No module named mypy"
  # surprises). The hook pins mypy to the version recorded in uv.lock; focused
  # contract coverage prevents the isolated hook and locked CI runtime drifting.
  #
  # Run the full baseline check manually when you want it:
  #   python scripts/ci/mypy_with_baseline.py        # report NEW errors only
  #   python scripts/ci/mypy_with_baseline.py --sync  # regenerate .mypy-baseline
  - repo: local
    hooks:
      - id: typecheck-changed
        name: mypy (changed aragora files or full CI trigger)
        entry: >-
          bash -c 'set -eo pipefail;
          targets_file="$(mktemp)";
          plan_file="$(mktemp)";
          trap "rm -f \"$targets_file\" \"$plan_file\"" EXIT;
          python scripts/run_typecheck_gate.py --repo-root . --base-ref main --head-ref HEAD --targets-file "$targets_file" --json > "$plan_file";
          mode="$(python -c "import json, sys; print(json.load(open(sys.argv[1]))[\"mode\"])" "$plan_file")";
          if [[ "$mode" == "full" ]]; then
            venv_bin="$(python -c "import os, sys; print(os.path.dirname(sys.executable))")";
            export PATH="$venv_bin:$PATH";
            bash scripts/test_tiers.sh typecheck;
          elif [[ "$mode" == "changed" ]]; then
            targets=();
            while IFS= read -r target; do
              [[ -n "$target" ]] && targets+=("$target");
            done < "$targets_file";
            if [[ "${#targets[@]}" -gt 0 ]]; then
              mypy --ignore-missing-imports --follow-imports=skip --show-error-codes "${targets[@]}";
            else
              echo "warning: typecheck planner returned changed mode with no targets; skipping local mypy" >&2;
            fi;
          elif [[ "$mode" == "skip" ]]; then
            cat "$plan_file";
          else
            echo "error: unknown typecheck planner mode: $mode" >&2;
            cat "$plan_file" >&2;
            exit 1;
          fi' --
        language: python
        additional_dependencies:
          - mypy==2.1.0
          - types-requests
          - types-redis
          - types-python-dateutil
          - types-setuptools
          - types-jsonschema
          - types-PyYAML
        # `always_run` lets the entrypoint compute the same origin/main...HEAD
        # plan as CI, including deleted aragora Python files and nested
        # requirements files, instead of trusting pre-commit's existing-file
        # list alone.
        pass_filenames: false
        always_run: true
        files: ^(aragora/.*\.py|pyproject\.toml|uv\.lock|\.pre-commit-config\.yaml|\.github/workflows/lint\.yml|scripts/run_typecheck_gate\.py|scripts/test_tiers\.sh|(.*/)?requirements[^/]*\.txt|\.github/actions/pr-scope-classifier/.*)$
        # Run on pre-push to catch type errors before they hit CI.
        stages: [pre-push]

  # Secret detection with gitleaks - also runs at commit-time (not just pre-push)
  # so credentials are caught before they reach history, not just before push.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        name: Detect secrets with gitleaks
        description: Prevent secrets from being committed
        stages: [pre-commit, pre-push]

  # RBAC coverage check - prevent regression in permission coverage
  - repo: local
    hooks:
      - id: rbac-coverage
        name: Check RBAC decorator coverage
        entry: python scripts/audit_rbac_coverage.py --summary --min-coverage 55
        language: python
        pass_filenames: false
        files: ^aragora/server/handlers/
        stages: [pre-push]

  # Env-mutation audit — block new os.environ writes from concurrent surfaces.
  # Writing to os.environ in a concurrent request or feature path shares config
  # as mutable global state across requests (defect pattern flagged by the
  # Mode 3 panel on #6454, #6447, #6442, #6472). Known intentional mutations
  # are allowlisted in the script with a rationale.
  - repo: local
    hooks:
      - id: env-mutation-audit
        name: Audit os.environ mutation in concurrent surfaces
        entry: python scripts/audit_env_mutation.py
        language: python
        pass_filenames: false
        files: ^aragora/(server/handlers|epistemic)/.*\.py$
        stages: [pre-push]

  # TypeScript type checking for frontend
  - repo: local
    hooks:
      - id: tsc-check
        name: TypeScript type check (frontend)
        entry: bash scripts/tsc_check_hook.sh
        language: system
        pass_filenames: false
        files: ^aragora/live/src/.*\.(ts|tsx)$
        stages: [pre-push]

  # Portability guard: block new hardcoded private/legacy references
  # (private home dirs, .venv/bin/python, an0mium/aragora slug). Baselined in
  # scripts/portability_baseline.json so it only fails on NEW violations.
  - repo: local
    hooks:
      - id: portability-guard
        name: Portability guard (no new private/legacy references)
        entry: python3 scripts/check_portability.py
        language: system
        types: [text]

  # Boundary 2 quarantine: report new or stale receipts+verifier module edges.
  - repo: local
    hooks:
      - id: boundary2-edges
        name: Boundary 2 receipts+verifier fail-on-new edges
        entry: python3 scripts/ci/check_boundary_edges.py
        language: system
        pass_filenames: false
        files: ^(?:\.pre-commit-config\.yaml|aragora/.*|aragora-verify/src/aragora_verify/.*|scripts/baselines/boundary2_edges_baseline\.json|scripts/ci/boundary_maps/receipts_verifier\.json|scripts/ci/check_boundary_edges\.py)$
        stages: [pre-commit, pre-push]

  # Security checks
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.8
    hooks:
      - id: bandit
        args: [-c, pyproject.toml, -r, aragora/]
        additional_dependencies: ["bandit[toml]"]
        # Run on manual stage to avoid slowing down commits
        stages: [manual]

# CI-only configuration
# These checks run in CI but are too slow for every commit
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks
  autoupdate_commit_msg: |
    [pre-commit.ci] pre-commit autoupdate
  skip:
    - mypy-baseline  # Run separately in CI for better caching
    - bandit  # Run separately in CI
