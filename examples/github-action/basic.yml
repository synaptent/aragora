# Aragora AI Code Review - Basic Workflow
#
# Add this file to your repository at: .github/workflows/aragora-review.yml
#
# For setup instructions, see: docs/guides/GITHUB_ACTION_SETUP.md
#
# NOTE: this example predates emit-receipt (#8669); see receipt.yml for the
# receipt-emitting variant.

name: Aragora AI Code Review (Basic)

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: aragora-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Run Aragora Review
        id: review
        uses: synaptent/aragora@486a10d835be5da00df488b5bef6c1e708da8f10
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          post-comment: 'true'
