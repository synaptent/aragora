[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aragora"
version = "2.10.0"
description = "Auditable execution control plane for AI-assisted decisions: multi-model review in, a verifiable Decision Receipt out"
readme = {text = """
# Aragora

Aragora is an auditable execution control plane for AI-assisted decisions:
multi-model review in, a verifiable Decision Receipt out. Installing this
distribution provides the `aragora` CLI and the full `aragora` package.

## Try it without an API key

```bash
pip install aragora
aragora demo --offline --receipt aragora-demo-receipt.json
aragora receipt verify aragora-demo-receipt.json
```

The demo writes a native Decision Receipt and the final command verifies it
locally. See the [full Aragora documentation](https://github.com/synaptent/aragora#readme)
for provider-backed reviews and the independent Open Decision Receipt flow.
The smaller debate engine is published separately as
[`aragora-debate`](https://pypi.org/project/aragora-debate/).
""", content-type = "text/markdown"}
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{name = "Agora Contributors"}]
keywords = ["ai", "multi-agent", "debate", "deliberation", "consensus", "reasoning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    # botocore (pulled in transitively by boto3/supabase for AWS Secrets Manager)
    # accepts python-dateutil>=2.1, but versions <2.8.1 call the removed
    # ``collections.Callable`` and crash on Python 3.10+ during AWS timestamp
    # parsing — which aborts ``hydrate_env_from_secrets`` and the whole
    # settlement/secrets CLI path. Floor it above the fixed release.
    "python-dateutil>=2.9.0.post0",
    # Core runtime closure for the `aragora` CLI (verified: these are the
    # third-party module-level imports the full argparse tree pulls in at
    # ``aragora --help`` time — click/httpx/typer via cli/ submodules, plus
    # config/settings which need pydantic + PyYAML). Declared in base so any
    # install yields a working CLI, not just ``[test]``.
    "click>=8.4.2,<9.0",
    "httpx>=0.27,<1.0",
    "typer>=0.26.8,<1.0",
    "PyYAML>=6.0.3,<7.0",
    "pydantic>=2.13.4,<3.0",
    "pydantic-settings>=2.14.2,<3.0",
    # Core async runtime floor, audited against the bootable base set in
    # scripts/ci_install_project.sh (LEGACY_CONTROL_PLANE_BASE_DEPS, the floor
    # both Dockerfiles boot from). aiohttp has the widest runtime footprint
    # (server handlers, agents, connectors) and websockets backs the
    # aragora/server/stream/* WebSocket surface. Declared in base so these
    # import cleanly from a plain ``pip install aragora``; the FastAPI/uvicorn
    # gateway and the other optional stacks stay in their extras ([gateway],
    # [enterprise], ...). The aiohttp floor matches the [blockchain]/[all]
    # extras for one consistent pin.
    "aiohttp>=3.14.3,<4.0",
    "websockets>=13.0,<16.2",
    # XXE-safe XML parsing, imported at module level by aragora.pulse.ingestor
    # (via aragora/pulse/__init__.py), aragora.auth.saml, and
    # aragora.connectors.{arxiv,feeds.ingestor}. Server readiness feature
    # detection reaches aragora.pulse transitively, so a plain install must
    # provide it. Pin matches LEGACY_CONTROL_PLANE_BASE_DEPS in
    # scripts/ci_install_project.sh, which already side-loads it in CI (the
    # reason this gap never surfaced there).
    "defusedxml>=0.7,<1.0",
]

[project.scripts]
aragora = "aragora.cli.main:main"

[project.optional-dependencies]
test = [
    # tests/config/test_secrets.py imports boto3 at module level (AWS Secrets
    # Manager backend); without it the curated CI scope fails at collection.
    "boto3>=1.34,<2.0",
    "build>=1.5.0,<2.0",
    "pydantic>=2.13.4,<3.0",
    "pydantic-settings>=2.14.2,<3.0",
    "PyYAML>=6.0.3,<7.0",
    "pytest>=9.1.1,<10.0",
    "pytest-asyncio>=1.4.0,<2.0",
    "pytest-cov>=7.0.0,<8.0",
    "pytest-randomly>=4.0.1,<6.0",
    "pytest-rerunfailures>=16.1,<17.0",
    "pytest-timeout>=2.4.0,<3.0",
    "pytest-xdist>=3.8.0,<4.0",
    "twine>=6.2.0,<7.0",
]
gateway = [
    "fastapi>=0.139.0,<1.0",
    "uvicorn>=0.50.0,<1.0",
]
blockchain = [
    "aiohttp>=3.14.3,<4.0",
    "web3>=7.16.0,<8.0",
]
enterprise = [
    "asyncpg>=0.31.0,<1.0",
    "python3-saml>=1.16.0,<2.0",
    "supabase>=2.31.0,<3.0",
]
connectors = [
    "aiokafka>=0.14.0,<1.0",
    "aio-pika>=9.6.2,<10.0",
]
experimental = [
    "playwright>=1.61.0,<2.0",
]
dev = [
    "mypy>=2.1.0,<3.0",
    "mypy-baseline>=0.7.4,<0.8",
    "ruff==0.14.14",
    "types-PyYAML>=6.0.12.20260518,<7.0",
    "types-croniter>=6.2.2.20260518,<7.0",
    "bandit>=1.9.4,<2.0",
    # Hook runtime for repo-local git hooks. Declaring it here means
    # `uv sync --extra dev` self-heals the development environment, so agents
    # do not need to fall back to `--no-verify`
    # (FIX-ENV-ONCE — docs/AGENT_OPERATING_CONTRACT.md §Conductor).
    "pre-commit>=4.6.0,<5.0",
    # Build backend for the in-repo aragora-verify package so the ODR
    # walkthrough CLI smoke tests build the wheel offline-deterministically
    # in CI (tests/gauntlet/test_odr_walkthrough_fixture.py).
    "hatchling>=1.30.1,<2.0",
]
readiness = [
    "vulture>=2.16,<3.0",
    "deptry>=0.25.1,<1.0",
]
all = [
    "fastapi>=0.139.0,<1.0",
    "uvicorn>=0.50.0,<1.0",
    "aiohttp>=3.14.3,<4.0",
    "web3>=7.16.0,<8.0",
    "asyncpg>=0.31.0,<1.0",
    "python3-saml>=1.16.0,<2.0",
    "supabase>=2.31.0,<3.0",
    "aiokafka>=0.14.0,<1.0",
    "aio-pika>=9.6.2,<10.0",
    "playwright>=1.61.0,<2.0",
    "vulture>=2.16,<3.0",
    "deptry>=0.25.1,<1.0",
]

[project.urls]
Homepage = "https://aragora.ai"
Repository = "https://github.com/synaptent/aragora"
Issues = "https://github.com/synaptent/aragora/issues"

# -----------------------------------------------------------------------------
# uv resolver constraints — security floors for transitively-pulled packages.
#
# These constrain the locked versions of dependencies that are NOT declared
# directly (so they stay out of the published wheel's metadata) but must be
# floored to non-vulnerable releases for the pip-audit security gate
# (scripts/run_pip_audit_gate.py):
#
#   * cryptography >=48.0.1 — fixes GHSA-537c-gmf6-5ccf. Pulled in via
#     pyjwt[crypto] / secretstorage and used at runtime for AES-256-GCM
#     encryption (aragora/security/encryption.py). The floor is 48.0.1; the
#     resolver actually lands on 49.0.0 (a 46 -> 49 jump across three majors).
#     cryptography's hazmat AES-GCM surface is stable across this range and the
#     46->49 deprecations are in unused legacy x509/serialization helpers;
#     verified by exercising encrypt/decrypt + AAD on 49.0.0. pyjwt and
#     secretstorage floor cryptography far below 48, so nothing caps the bump.
#   * starlette >=1.3.1 — fixes CVE-2026-54283, CVE-2026-54282, CVE-2026-48818,
#     CVE-2026-48817. Pulled in via fastapi (gateway/all extras). fastapi
#     0.136.3 requires only ``starlette>=0.46.0`` (no upper bound) and already
#     resolves to the starlette 1.x line, so this stays on fastapi 0.x — no
#     FastAPI 1.x migration required. Aragora's only direct starlette usage is
#     BaseHTTPMiddleware / Response / StreamingResponse, all stable across 1.x.
# -----------------------------------------------------------------------------
[tool.uv]
constraint-dependencies = [
    "cryptography>=48.0.1",
    "starlette>=1.3.1",
]

# uv workspace: the in-repo sub-packages resolve into the single root uv.lock so
# `uv lock --check`, `uv sync --all-packages` and `uv run --package <member>`
# cover them. Members keep their own build backends and publish workflows
# (they build from their own directories); the root distribution's metadata
# does not depend on them.
[tool.uv.workspace]
members = ["aragora-debate", "aragora-verify", "sdk/python"]

[tool.uv.sources]
aragora-debate = { workspace = true }
aragora-verify = { workspace = true }
aragora-sdk = { workspace = true }

[tool.setuptools.packages.find]
where = ["."]
include = ["aragora*"]
exclude = ["aragora-debate*", "tests*", "docs*"]

[tool.setuptools.package-data]
"aragora" = ["py.typed"]

[tool.pytest.ini_options]
# `-p no:randomly` keeps default (and CI) ordering deterministic even though
# pytest-randomly is installed via the `test` extra. Opt in per run with
# `pytest -o addopts="-p no:rerunfailures" -p randomly --randomly-seed=<n> ...`.
addopts = "-p no:rerunfailures -p no:randomly"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
python_files = ["test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]

[tool.coverage.run]
source = ["aragora"]

[tool.coverage.report]
# Floor of the coverage measured on `tests/ci tests/config` (8.71% on
# 2026-09-04) minus one point. The curated `readiness-test-root` scope is a
# superset of those tests, so it always meets this floor. Ratchet upward only.
fail_under = 7

[tool.deptry]
known_first_party = ["aragora", "scripts", "tests"]
exclude = [
    "sdk",
    "tutorials",
    "tests",
    "scripts",
    "aragora-debate",
    "aragora-verify",
    "aragora/live",
    "docs",
    "docs-site",
    "ide",
    "aragora-operator",
    "\\.venv",
    "node_modules",
]
# The convenience bundle repeats runtime extras plus readiness tools. Runtime
# deps remain classified by their own extras; do not reclassify the tools as
# runtime merely because they also appear in all.
pep621_dev_dependency_groups = ["dev", "test", "readiness", "all"]
# Optional-provider imports are lazily guarded; DEP001/DEP003 enforcement
# is tracked in docs/TECH_DEBT.md rather than blocking optional integrations.
ignore = ["DEP001", "DEP003"]

[tool.deptry.package_module_name_map]
python3-saml = "onelogin"

[tool.deptry.per_rule_ignores]
DEP002 = [
    # Runtime compatibility floor for botocore's AWS timestamp parser (see
    # [project] dependencies); used transitively, not imported by aragora.
    "python-dateutil",
]
DEP004 = [
    # AWS providers guard boto3 imports when absent; [test] installs it for
    # tests/config/test_secrets.py, not as a required runtime dependency.
    "boto3",
]

[tool.ruff]
line-length = 100
exclude = ["aragora-debate*", "aragora-verify*"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = false

[tool.ruff.lint]
select = ["E", "F", "W", "T201", "BLE001", "UP006", "UP007", "G004", "C4", "SIM910", "S101"]
ignore = ["E402", "E501", "E731", "E741", "E712", "C401", "C405", "C408", "C416"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"aragora/cli/*" = ["T201", "BLE001"]
"aragora/ideacloud/cli/*" = ["T201"]
