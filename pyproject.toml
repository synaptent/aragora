[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aragora"
version = "2.11.1"
description = "Auditable execution control plane for AI-assisted decisions: multi-model review in, a verifiable Decision Receipt out"
readme = {text = """
# Aragora

Aragora is an auditable execution control plane for AI-assisted decisions:
multi-model review in, a verifiable Decision Receipt out. Installing this
distribution provides the `aragora` CLI and the full `aragora` package.

## Try it without an API key

```bash
pip install aragora
aragora demo --offline --receipt aragora-demo-receipt.json
aragora receipt verify aragora-demo-receipt.json
```

The demo writes a native Decision Receipt and the final command verifies it
locally. See the [full Aragora documentation](https://github.com/synaptent/aragora#readme)
for provider-backed reviews and the independent Open Decision Receipt flow.
The smaller debate engine is published separately as
[`aragora-debate`](https://pypi.org/project/aragora-debate/).
""", content-type = "text/markdown"}
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{name = "Agora Contributors"}]
keywords = ["ai", "multi-agent", "debate", "deliberation", "consensus", "reasoning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    # botocore (pulled in transitively by boto3/supabase for AWS Secrets Manager)
    # accepts python-dateutil>=2.1, but versions <2.8.1 call the removed
    # ``collections.Callable`` and crash on Python 3.10+ during AWS timestamp
    # parsing — which aborts ``hydrate_env_from_secrets`` and the whole
    # settlement/secrets CLI path. Floor it above the fixed release.
    "python-dateutil>=2.9.0.post0",
    # Core runtime closure for the `aragora` CLI (verified: these are the
    # third-party module-level imports the full argparse tree pulls in at
    # ``aragora --help`` time — click/httpx/typer via cli/ submodules, plus
    # config/settings which need pydantic + PyYAML). Declared in base so any
    # install yields a working CLI, not just ``[test]``.
    "click>=8.4.2,<9.0",
    "httpx>=0.27,<1.0",
    "typer>=0.26.8,<1.0",
    "PyYAML>=6.0.3,<7.0",
    "pydantic>=2.13.4,<3.0",
    "pydantic-settings>=2.14.2,<3.0",
    # Core async runtime floor, audited against the bootable base set in
    # scripts/ci_install_project.sh (LEGACY_CONTROL_PLANE_BASE_DEPS, the floor
    # both Dockerfiles boot from). aiohttp has the widest runtime footprint
    # (server handlers, agents, connectors) and websockets backs the
    # aragora/server/stream/* WebSocket surface. Declared in base so these
    # import cleanly from a plain ``pip install aragora``; the FastAPI/uvicorn
    # gateway and the other optional stacks stay in their extras ([gateway],
    # [enterprise], ...). The aiohttp floor matches the [blockchain]/[all]
    # extras for one consistent pin.
    "aiohttp>=3.14.3,<4.0",
    "websockets>=13.0,<16.2",
    # XXE-safe XML parsing, imported at module level by aragora.pulse.ingestor
    # (via aragora/pulse/__init__.py), aragora.auth.saml, and
    # aragora.connectors.{arxiv,feeds.ingestor}. Server readiness feature
    # detection reaches aragora.pulse transitively, so a plain install must
    # provide it. Pin matches LEGACY_CONTROL_PLANE_BASE_DEPS in
    # scripts/ci_install_project.sh, which already side-loads it in CI (the
    # reason this gap never surfaced there).
    "defusedxml>=0.7,<1.0",
    # Ed25519 receipt signing (aragora/gauntlet/odr_signing.py) and AES-GCM
    # encryption import this lazily, so a plain install could still reach a
    # configured signing key and then fail. Declared in base so the documented
    # `ARAGORA_ODR_SIGNING_KEY_FILE` path works from `pip install aragora`,
    # with the same GHSA-537c-gmf6-5ccf floor as the uv constraint below.
    "cryptography>=48.0.1,<51.0",
]

[project.scripts]
aragora = "aragora.cli.main:main"

[project.optional-dependencies]
test = [
    "build>=1.5.0,<2.0",
    # Backends for the cold-cache installed-CLI receipt fixture.
    "hatchling>=1.30.1,<2.0",
    "pydantic>=2.13.4,<3.0",
    "pydantic-settings>=2.14.2,<3.0",
    "PyYAML>=6.0.3,<7.0",
    "pytest>=9.1.1,<10.0",
    "pytest-asyncio>=1.4.0,<2.0",
    "setuptools>=83.0.0,<84.0",
    "twine>=6.2.0,<8.0",
    "uv>=0.11.19,<0.12",
    "wheel>=0.46.0,<1.0",
]
gateway = [
    "fastapi>=0.139.0,<1.0",
    "uvicorn>=0.50.0,<1.0",
]
blockchain = [
    "aiohttp>=3.14.3,<4.0",
    "web3>=7.16.0,<8.0",
]
enterprise = [
    "asyncpg>=0.31.0,<1.0",
    "python3-saml>=1.16.0,<2.0",
    "supabase>=2.31.0,<3.0",
]
connectors = [
    "aiokafka>=0.14.0,<1.0",
    "aio-pika>=9.6.2,<10.0",
]
experimental = [
    "playwright>=1.61.0,<2.0",
]
dev = [
    "mypy>=2.1.0,<3.0",
    "mypy-baseline>=0.7.4,<0.8",
    "ruff==0.14.14",
    "types-PyYAML>=6.0.12.20260518,<7.0",
    "types-croniter>=6.2.2.20260518,<7.0",
    "bandit>=1.9.4,<2.0",
    # Hook runtime for repo-local git hooks. Declaring it here means
    # `uv sync --extra dev` self-heals the development environment, so agents
    # do not need to fall back to `--no-verify`
    # (FIX-ENV-ONCE — docs/AGENT_OPERATING_CONTRACT.md §Conductor).
    "pre-commit>=4.6.0,<5.0",
    # Build backend for the in-repo aragora-verify package so the ODR
    # walkthrough CLI smoke tests build the wheel offline-deterministically
    # in CI (tests/gauntlet/test_odr_walkthrough_fixture.py).
    "hatchling>=1.30.1,<2.0",
]
all = [
    "fastapi>=0.139.0,<1.0",
    "uvicorn>=0.50.0,<1.0",
    "aiohttp>=3.14.3,<4.0",
    "web3>=7.16.0,<8.0",
    "asyncpg>=0.31.0,<1.0",
    "python3-saml>=1.16.0,<2.0",
    "supabase>=2.31.0,<3.0",
    "aiokafka>=0.14.0,<1.0",
    "aio-pika>=9.6.2,<10.0",
    "playwright>=1.61.0,<2.0",
]

[project.urls]
Homepage = "https://aragora.ai"
Repository = "https://github.com/synaptent/aragora"
Issues = "https://github.com/synaptent/aragora/issues"

# Run by aragora/core/decision_route_hooks.py on the first lookup that finds nothing
# registered, so a caller that only imports aragora.core still reaches the workflow,
# gauntlet, pipeline, chat connector and audit hooks.
[project.entry-points."aragora.decision_routes"]
server = "aragora.server.decision_routes:register_decision_routes"

# Run by aragora/agents/code_scanners.py on the first lookup that finds nothing
# registered, so a caller that only imports aragora.agents still builds the audit
# package's security scanner and bug detector.
[project.entry-points."aragora.code_scanners"]
audit = "aragora.audit.code_scanners:register_code_scanners"

# Run by aragora/events/debate_completion.py on the first debate_completed emit, so a
# process that only runs debates still records them in the debate analytics store.
[project.entry-points."aragora.debate_completed_subscribers"]
analytics = "aragora.analytics.debate_events:subscribe_debate_analytics"

# Run by aragora/debate/workspace_stores.py on the first lookup that finds nothing
# registered, so the debate engine records beads in the canonical workspace stores
# without importing aragora.stores.
[project.entry-points."aragora.workspace_stores"]
stores = "aragora.stores.debate_registration:register_debate_workspace_stores"

# -----------------------------------------------------------------------------
# uv resolver constraints — security floors for the pip-audit security gate
# (scripts/run_pip_audit_gate.py). They bound what the lockfile may resolve
# to regardless of how a package is reached (direct or transitive):
#
#   * cryptography >=48.0.1 — fixes GHSA-537c-gmf6-5ccf. Also a direct base
#     dependency above (Ed25519 receipt signing, AES-256-GCM encryption); this
#     entry keeps the lock floor pinned even if a transitive path (pyjwt[crypto],
#     secretstorage) is what pulls it in. The hazmat AES-GCM surface is stable
#     across 46 -> 50 and the deprecations are in unused legacy x509 helpers.
#   * starlette >=1.3.1 — fixes CVE-2026-54283, CVE-2026-54282, CVE-2026-48818,
#     CVE-2026-48817. Pulled in via fastapi (gateway/all extras). fastapi
#     0.136.3 requires only ``starlette>=0.46.0`` (no upper bound) and already
#     resolves to the starlette 1.x line, so this stays on fastapi 0.x — no
#     FastAPI 1.x migration required. Aragora's only direct starlette usage is
#     BaseHTTPMiddleware / Response / StreamingResponse, all stable across 1.x.
#   * pyjwt >=2.15.0 — fixes PYSEC-2026-4140, PYSEC-2026-4141, PYSEC-2026-4142,
#     PYSEC-2026-4143, PYSEC-2026-4144, PYSEC-2026-4145, PYSEC-2026-4146,
#     PYSEC-2026-4147, PYSEC-2026-4148, PYSEC-2026-4149, PYSEC-2026-4150,
#     PYSEC-2026-4151, PYSEC-2026-4152. Pulled in via supabase-auth. 2.14.0
#     clears every id except PYSEC-2026-4141, which is fixed only in 2.15.0.
#   * urllib3 >=2.8.0 — fixes PYSEC-2026-4175, PYSEC-2026-4176,
#     PYSEC-2026-4177. Pulled in via requests (also id, twine, types-requests).
#   * virtualenv >=21.7.13 — fixes PYSEC-2026-4011, PYSEC-2026-4012,
#     PYSEC-2026-4013, PYSEC-2026-4014 (PYSEC-2026-4013 needs 21.7.13). Pulled
#     in via pre-commit (dev tooling only).
# -----------------------------------------------------------------------------
[tool.uv]
constraint-dependencies = [
    "cryptography>=48.0.1",
    "pyjwt>=2.15.0",
    "starlette>=1.3.1",
    "urllib3>=2.8.0",
    "virtualenv>=21.7.13",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aragora*"]
exclude = ["aragora-debate*", "tests*", "docs*"]

[tool.setuptools.package-data]
"aragora" = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-p no:rerunfailures"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
exclude = ["aragora-debate*", "aragora-verify*"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = false

[tool.ruff.lint]
select = ["E", "F", "W", "T201", "BLE001", "UP006", "UP007", "G004", "C4", "SIM910", "S101"]
ignore = ["E402", "E501", "E731", "E741", "E712", "C401", "C405", "C408", "C416"]

[tool.ruff.lint.per-file-ignores]
"aragora/cli/*" = ["T201", "BLE001"]
