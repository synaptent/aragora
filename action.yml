name: 'Aragora AI Code Review'
description: 'Multi-agent AI red team code review for pull requests'
author: 'Aragora'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  agents:
    description: 'Comma-separated list of agents (anthropic-api,openai-api)'
    required: false
    default: 'anthropic-api,openai-api'
  rounds:
    description: 'Number of debate rounds'
    required: false
    default: '2'
  focus:
    description: 'Focus areas (security,performance,quality)'
    required: false
    default: 'security,performance,quality'
  anthropic-api-key:
    description: 'Anthropic API key for Claude'
    required: false
  openai-api-key:
    description: 'OpenAI API key for GPT'
    required: false
  openrouter-api-key:
    description: 'OpenRouter API key (fallback provider)'
    required: false
  post-comment:
    description: 'Post review as PR comment'
    required: false
    default: 'true'
  fail-on-critical:
    description: 'Fail workflow if critical issues found'
    required: false
    default: 'false'
  max-diff-size:
    description: 'Maximum diff size in bytes'
    required: false
    default: '50000'
  pr-number:
    description: 'Pull request number override for manual/self-test runs'
    required: false
    default: ''
  failure-threshold:
    description: 'Fail workflow if total issues exceed this count (0 = disabled)'
    required: false
    default: '0'
  output-format:
    description: 'Additional output format besides PR comment (sarif, json, none)'
    required: false
    default: 'none'
  sarif-upload:
    description: 'Upload SARIF to GitHub Security tab'
    required: false
    default: 'false'
  emit-receipt:
    description: >-
      Emit a portable, verifiable Open Decision Receipt (ODR) for the review and
      upload it as a build artifact. Runs a heterogeneous-model merge-quorum
      collection (dry-run, never posts) and bridges it to a signed-off-able
      receipt. Set to "true" to opt in; this performs a second model pass.
    required: false
    default: 'false'
  receipt-reviewers:
    description: 'Space-separated model families for the receipt quorum (keys must be provided)'
    required: false
    default: 'claude openai'
  odr-signing-key:
    description: >-
      PEM-encoded Ed25519 private key (PKCS#8) that signs the emitted receipt.
      Pass a repository secret. With a key the receipt carries a detached
      signature that anyone holding the matching public key can check offline
      with `aragora-verify --pubkey`; without one the receipt is unsigned. The
      key is written to a runner-private file for the emit step only and is
      never placed in a child process's environment.
    required: false
    default: ''
  use-secrets-manager:
    description: >-
      Load provider API keys from AWS Secrets Manager instead of inputs (the
      org's keyless pattern). Requires AWS credentials in the job env (e.g. via
      aws-actions/configure-aws-credentials with OIDC). When "true", the receipt
      quorum hydrates keys from Secrets Manager.
    required: false
    default: 'false'
  aws-region:
    description: 'AWS region for Secrets Manager (when use-secrets-manager is true)'
    required: false
    default: 'us-east-2'

outputs:
  review-path:
    description: 'Path to the generated review file'
    value: ${{ steps.review.outputs.review_path }}
  review-generated:
    description: 'Whether a review comment was generated'
    value: ${{ steps.review.outputs.review_generated }}
  review-json-path:
    description: 'Path to the generated JSON review file'
    value: ${{ steps.review.outputs.review_json_path }}
  review-log-path:
    description: 'Path to the review log file'
    value: ${{ steps.review.outputs.review_log_path }}
  unanimous-count:
    description: 'Number of unanimous issues found'
    value: ${{ steps.review.outputs.unanimous_count }}
  critical-count:
    description: 'Number of critical issues found'
    value: ${{ steps.review.outputs.critical_count }}
  high-count:
    description: 'Number of high severity issues found'
    value: ${{ steps.review.outputs.high_count }}
  medium-count:
    description: 'Number of medium severity issues found'
    value: ${{ steps.review.outputs.medium_count }}
  low-count:
    description: 'Number of low severity issues found'
    value: ${{ steps.review.outputs.low_count }}
  total-count:
    description: 'Total number of severity-tagged issues (critical+high+medium+low)'
    value: ${{ steps.review.outputs.total_count }}
  risk-areas-count:
    description: 'Number of risk areas noted'
    value: ${{ steps.review.outputs.risk_areas_count }}
  split-opinions-count:
    description: 'Number of split-opinion items (agent disagreement)'
    value: ${{ steps.review.outputs.split_opinions_count }}
  agreement-score:
    description: 'Agent agreement score (0-1)'
    value: ${{ steps.review.outputs.agreement_score }}
  sarif-path:
    description: 'Path to SARIF output file (if generated)'
    value: ${{ steps.review.outputs.sarif_path }}
  receipt-path:
    description: 'Path to the verifiable ODR decision receipt (if emitted)'
    value: ${{ steps.receipt.outputs.receipt_path }}
  receipt-verdict:
    description: 'Receipt verdict (PASS / CHANGES_REQUESTED)'
    value: ${{ steps.receipt.outputs.receipt_verdict }}
  receipt-digest:
    description: 'SHA-256 JCS content digest of the receipt'
    value: ${{ steps.receipt.outputs.receipt_digest }}
  receipt-verified:
    description: 'Whether the emitted receipt passed schema + digest verification'
    value: ${{ steps.receipt.outputs.receipt_verified }}
  receipt-signed:
    description: 'Whether the emitted receipt carries an Ed25519 signature'
    value: ${{ steps.receipt.outputs.receipt_signed }}
  receipt-key-id:
    description: 'Key id of the receipt signature (empty when unsigned); match it against your published public key'
    value: ${{ steps.receipt.outputs.receipt_key_id }}

runs:
  using: 'composite'
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Aragora
      shell: bash
      run: |
        pip install --upgrade pip
        pip install aragora

    - name: Get PR diff
      id: diff
      shell: bash
      run: |
        PR_NUMBER="${INPUT_PR_NUMBER:-$EVENT_PR_NUMBER}"
        if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
          echo "::error::A pull request number is required for Aragora review"
          exit 1
        fi
        if [[ ! "$MAX_DIFF_SIZE" =~ ^[0-9]+$ ]]; then
          echo "::error::max-diff-size must be numeric"
          exit 1
        fi
        gh pr diff "$PR_NUMBER" > pr.diff

        # Truncate if needed
        DIFF_SIZE=$(wc -c < pr.diff)
        MAX_SIZE="$MAX_DIFF_SIZE"
        if [ "$DIFF_SIZE" -gt "$MAX_SIZE" ]; then
          head -c "$MAX_SIZE" pr.diff > pr_truncated.diff
          echo -e "\n[... diff truncated ...]" >> pr_truncated.diff
          mv pr_truncated.diff pr.diff
        fi

        echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
      env:
        GH_TOKEN: ${{ github.token }}
        EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        INPUT_PR_NUMBER: ${{ inputs.pr-number }}
        MAX_DIFF_SIZE: ${{ inputs.max-diff-size }}

    - name: Run Aragora review
      id: review
      shell: bash
      run: |
        mkdir -p ./aragora-artifacts

        # Run review with github format for PR comment
        aragora review \
          --diff-file pr.diff \
          --output-format github \
          --output-dir ./aragora-artifacts \
          --agents "${{ inputs.agents }}" \
          --rounds ${{ inputs.rounds }} \
          --focus "${{ inputs.focus }}" \
          > ./aragora-artifacts/comment.md 2> ./aragora-artifacts/review.log || true

        # Also generate JSON output for structured data extraction
        aragora review \
          --diff-file pr.diff \
          --output-format json \
          --output-dir ./aragora-artifacts \
          --agents "${{ inputs.agents }}" \
          --rounds ${{ inputs.rounds }} \
          --focus "${{ inputs.focus }}" \
          > /dev/null 2>> ./aragora-artifacts/review.log || true

        # Generate SARIF output if requested
        if [ "${{ inputs.output-format }}" = "sarif" ]; then
          aragora review \
            --diff-file pr.diff \
            --output-format json \
            --output-dir ./aragora-artifacts \
            --agents "${{ inputs.agents }}" \
            --rounds ${{ inputs.rounds }} \
            --focus "${{ inputs.focus }}" \
            --sarif ./aragora-artifacts/review.sarif \
            > /dev/null 2>> ./aragora-artifacts/review.log || true

          if [ -f "./aragora-artifacts/review.sarif" ]; then
            echo "sarif_path=./aragora-artifacts/review.sarif" >> $GITHUB_OUTPUT
          else
            echo "sarif_path=" >> $GITHUB_OUTPUT
          fi
        else
          echo "sarif_path=" >> $GITHUB_OUTPUT
        fi

        if [ -f "./aragora-artifacts/comment.md" ] && [ -s "./aragora-artifacts/comment.md" ]; then
          echo "review_path=./aragora-artifacts/comment.md" >> $GITHUB_OUTPUT
          echo "review_generated=true" >> $GITHUB_OUTPUT
        else
          echo "review_generated=false" >> $GITHUB_OUTPUT
        fi

        # Action-level metadata and extracted counts from JSON output
        echo "review_log_path=./aragora-artifacts/review.log" >> $GITHUB_OUTPUT

        python3 "$GITHUB_ACTION_PATH/scripts/extract_review_counts.py" \
          ./aragora-artifacts/review.json >> "$GITHUB_OUTPUT"
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}

    - name: Emit decision receipt
      id: receipt
      if: inputs.emit-receipt == 'true'
      shell: bash
      run: |
        # Receipt emission is explicit opt-in. If enabled, failure to produce a
        # verified receipt is a real failure; details go to receipt.log.
        set +e
        mkdir -p ./aragora-artifacts
        LOG=./aragora-artifacts/receipt.log
        RECEIPT_REVIEWERS="${RECEIPT_REVIEWERS:-claude openai}"
        # Keep the signing key out of every child process's environment (the
        # quorum step runs third-party model CLIs): write it to a runner-private
        # file now and hand only the path to the emit step below.
        ODR_KEY_FILE=""
        if [ -n "${ODR_SIGNING_KEY:-}" ]; then
          ODR_KEY_FILE="${RUNNER_TEMP:-/tmp}/aragora-odr-signing-key.pem"
          ( umask 077 && printf '%s\n' "$ODR_SIGNING_KEY" > "$ODR_KEY_FILE" )
          trap 'rm -f "$ODR_KEY_FILE"' EXIT
        fi
        unset ODR_SIGNING_KEY
        receipt_failed() {
          echo "$1" >> "$LOG"
          echo "receipt_verified=false" >> "$GITHUB_OUTPUT"
          rm -f ./aragora-artifacts/decision-receipt.odr.json
          exit 0
        }

        if [[ ! "$RECEIPT_REVIEWERS" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*([[:space:]]+[A-Za-z0-9][A-Za-z0-9._-]*)*$ ]]; then
          receipt_failed "invalid receipt-reviewers input; receipt skipped"
        fi
        read -r -a RECEIPT_REVIEWER_ARGS <<< "$RECEIPT_REVIEWERS"

        # The bridge/emitter may be newer than the published PyPI 'aragora', so
        # install the action's own source into a job-local venv for the receipt
        # tooling. Never mutate shared runner site-packages. Keep the venv OUTSIDE
        # ./aragora-artifacts so it is never swept into the uploaded artifact
        # (uploading a full virtualenv would bloat / fail the upload).
        RECEIPT_VENV="${RUNNER_TEMP:-/tmp}/aragora-receipt-venv"
        rm -rf "$RECEIPT_VENV"
        python3 -m venv "$RECEIPT_VENV" >> "$LOG" 2>&1
        RECEIPT_PY="$RECEIPT_VENV/bin/python"
        if [ ! -x "$RECEIPT_PY" ]; then
          receipt_failed "receipt venv creation failed; receipt skipped"
        fi
        "$RECEIPT_PY" -m pip install --upgrade pip >> "$LOG" 2>&1
        "$RECEIPT_PY" -m pip install "$GITHUB_ACTION_PATH" jsonschema >> "$LOG" 2>&1
        if [ "$?" -ne 0 ]; then
          receipt_failed "receipt tooling install failed; receipt skipped"
        fi

        # Collect a heterogeneous-model quorum — DRY RUN: prepares + lints,
        # never posts (no --apply), Tier-gated regardless.
        "$RECEIPT_PY" "$GITHUB_ACTION_PATH/scripts/collect_quorum_evidence.py" \
          --repo "$REPO" --pr "$PR" \
          --reviewers "${RECEIPT_REVIEWER_ARGS[@]}" \
          --json > ./aragora-artifacts/outcome.json 2>> "$LOG"

        RECEIPT_OK=false
        if [ -s ./aragora-artifacts/outcome.json ]; then
          # An empty path is equivalent to unset: the receipt is emitted unsigned.
          ARAGORA_ODR_SIGNING_KEY_FILE="$ODR_KEY_FILE" \
          "$RECEIPT_PY" "$GITHUB_ACTION_PATH/scripts/emit_pr_receipt.py" \
            --outcome ./aragora-artifacts/outcome.json \
            --out ./aragora-artifacts/decision-receipt.odr.json \
            --verify \
            --github-output "$GITHUB_OUTPUT" >> "$LOG" 2>&1
          if [ "$?" -eq 0 ]; then
            RECEIPT_OK=true
          else
            receipt_failed "receipt emission or verification failed; dropping partial receipt"
          fi
        else
          receipt_failed "no outcome collected; receipt skipped"
        fi

        # Append a receipt summary to the PR comment if both exist.
        RECEIPT=./aragora-artifacts/decision-receipt.odr.json
        if [ "$RECEIPT_OK" = "true" ] && [ -f "$RECEIPT" ] && [ -f ./aragora-artifacts/comment.md ]; then
          VERDICT=$("$RECEIPT_PY" -c "import json;print(json.load(open('$RECEIPT'))['claim'].get('verdict',''))" 2>>"$LOG")
          RID=$("$RECEIPT_PY" -c "import json;print(json.load(open('$RECEIPT')).get('receipt_id',''))" 2>>"$LOG")
          KID=$("$RECEIPT_PY" -c "import json;s=json.load(open('$RECEIPT')).get('signatures') or [];print(s[0].get('key_id','') if s else '')" 2>>"$LOG")
          {
            echo ""
            echo "---"
            echo "### 🧾 Decision Receipt"
            echo ""
            echo "- Receipt: \`$RID\`  ·  Verdict: \`$VERDICT\`"
            if [ -n "$KID" ]; then
              echo "- Signed with Ed25519 key \`$KID\`. Verify offline against this repository's published public key: \`pip install aragora-verify && aragora-verify decision-receipt.odr.json --pubkey <public-key.pem>\`"
            else
              echo "- Independently verifiable: \`pip install aragora-verify && aragora-verify decision-receipt.odr.json\` (unsigned: pass \`odr-signing-key\` to sign receipts)"
            fi
            echo "- The full portable receipt is attached as a build artifact."
          } >> ./aragora-artifacts/comment.md
        fi
        exit 0
      env:
        GH_TOKEN: ${{ github.token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
        RECEIPT_REVIEWERS: ${{ inputs.receipt-reviewers }}
        ODR_SIGNING_KEY: ${{ inputs.odr-signing-key }}
        REPO: ${{ github.repository }}
        PR: ${{ steps.diff.outputs.pr_number }}
        ARAGORA_USE_SECRETS_MANAGER: ${{ inputs.use-secrets-manager }}
        AWS_REGION: ${{ inputs.aws-region }}

    - name: Post PR comment
      if: always() && inputs.post-comment == 'true' && steps.review.outputs.review_generated == 'true'
      shell: bash
      run: |
        gh pr comment "$PR" --body-file ./aragora-artifacts/comment.md
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ steps.diff.outputs.pr_number }}

    - name: Upload SARIF
      if: inputs.sarif-upload == 'true' && steps.review.outputs.sarif_path != ''
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.review.outputs.sarif_path }}

    - name: Check for critical issues
      if: inputs.fail-on-critical == 'true' && steps.review.outputs.critical_count != '0'
      shell: bash
      run: |
        echo "::error::Critical issues found in code review"
        exit 1

    - name: Check failure threshold
      if: inputs.failure-threshold != '0'
      shell: bash
      run: |
        TOTAL=${{ steps.review.outputs.total_count }}
        THRESHOLD=${{ inputs.failure-threshold }}
        if [ "$TOTAL" -ge "$THRESHOLD" ]; then
          echo "::error::Issue count ($TOTAL) exceeds threshold ($THRESHOLD)"
          exit 1
        fi

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: aragora-review-${{ steps.diff.outputs.pr_number }}
        path: ./aragora-artifacts/
        retention-days: 30

    - name: Check receipt emission
      if: inputs.emit-receipt == 'true' && steps.receipt.outputs.receipt_verified != 'true'
      shell: bash
      run: |
        echo "::error::Receipt emission was requested but no verified receipt was produced"
        exit 1
