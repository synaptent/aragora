[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aragora-debate"
version = "0.2.3"
description = "Adversarial multi-model debate engine -- pit LLMs against each other, detect hollow consensus, and produce cryptographic decision receipts. Zero required dependencies."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Aragora", email = "team@aragora.dev" },
]
keywords = [
    "adversarial-debate",
    "multi-agent",
    "decision-integrity",
    "llm",
    "consensus",
    "audit-trail",
    "hollow-consensus",
    "evidence-quality",
    "convergence-detection",
    "decision-receipt",
    "multi-model",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.20.0"]
openai = ["openai>=1.0.0"]
mistral = ["mistralai>=1.0.0"]
gemini = ["google-genai>=1.0.0"]
all = [
    "anthropic>=0.20.0",
    "openai>=1.0.0",
    "mistralai>=1.0.0",
    "google-genai>=1.0.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=7.0.0,<8.0",
    "pytest-randomly>=4.0.1,<6.0",
    "pytest-xdist>=3.8.0,<4.0",
    "pytest-timeout>=2.4.0,<3.0",
]

[project.urls]
Homepage = "https://github.com/synaptent/aragora"
Documentation = "https://github.com/synaptent/aragora/blob/main/docs/START_HERE.md"
Repository = "https://github.com/synaptent/aragora/tree/main/aragora-debate"
Changelog = "https://github.com/synaptent/aragora/blob/main/aragora-debate/CHANGELOG.md"
"Bug Tracker" = "https://github.com/synaptent/aragora/issues"

[tool.hatch.build.targets.sdist]
exclude = ["CLAUDE.md", "**/CLAUDE.md", ".nomic/", ".benchmarks/"]

[tool.hatch.build.targets.wheel]
packages = ["src/aragora_debate"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["aragora_debate"]

[tool.coverage.report]
# Full package suite: 91.10% lines (2026-09-06), minus one point.
fail_under = 90.10
precision = 2

[tool.deptry]
known_first_party = ["aragora_debate"]
optional_dependencies_dev_groups = ["dev"]

[tool.deptry.package_module_name_map]
google-genai = "google"

[tool.ruff]
extend = "../pyproject.toml"

[tool.ruff.lint]
select = ["E", "F", "W", "T201", "BLE001", "UP006", "UP007", "G004", "C4", "SIM910", "S101", "N", "C901"]
# Ruff's local select resets inherited ignores; retain the root policy.
ignore = ["E402", "E501", "E731", "E741", "E712", "C401", "C405", "C408", "C416"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"src/aragora_debate/__main__.py" = ["T201"]
# Internal config invariants and executable examples intentionally assert.
"src/aragora_debate/arena.py" = ["S101"]
"tests/*" = ["T201", "F401", "F821", "F841", "BLE001", "G004", "S101"]
"examples/*" = ["T201", "BLE001", "S101"]

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
# Provider SDKs are optional extras, absent in a standalone dev install.
module = ["anthropic", "anthropic.*", "openai", "openai.*", "mistralai", "mistralai.*", "google", "google.genai", "google.genai.*"]
ignore_missing_imports = true
